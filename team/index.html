function viewHome() {
  return `<div class="nx-empty"><div class="nx-empty-in">${MC_TASKS_LOGO}<p class="mc-tag">Հաշվապահություն, կադրեր և պայմանագրեր՝ մեկ համակարգում<span class="mc-dot">։</span></p>
    <p class="mc-hint">Ընտրեք բաժինը ցանկից՝ աշխատանքը սկսելու համար։</p></div></div>`;
}
function renderView() {
  if (!S.d) return;
  $('#pageTitle').textContent = TITLES[S.view] || '';
  vtActivate(S.view);
  const v = $('#view'); v.dataset.dv = String(S.d.dv);
  if (S.view === 'home') { document.body.classList.add('nx-home'); vtActivate('home'); const v0 = $('#view'); v0.dataset.dv = String(S.d.dv); v0.innerHTML = viewHome(); renderBnav(); return; }
  document.body.classList.remove('nx-home');
  const fn = { chats: viewChats, clients: viewClients, requests: viewRequests, stats: viewStats, tasks: viewTasks, reports: viewReports, archive: viewArchive, companies: viewCompanies, docs: viewDocs, mail: viewMail, team: viewTeam, settings: viewSettings }[S.view] || viewTasks;
  applyTaskCols();
  // բաց չաթը չվերաբեռնել (որ չկորի գրածը/ձայնագրությունը)
  if (S.view === 'chats' && v.querySelector('.chats') && TEAMCHAT && TEAMCHAT.thread === S.ch.thread && S.ch.thread) { drawChatList(); return; }
  v.innerHTML = mailBanner() + fn();
  bindColHeads();
  if (S.view === 'tasks') bindPageDrag();
  if (S.view === 'stats') bindStatsChart();
  if (S.view === 'archive' && !S.arch) loadArchive();
  if (S.view === 'stats' && !S.stats) loadStats();
  if (S.view === 'requests' && !S.reqs) loadRequests();
  if (S.view === 'clients' && (!S.ext || Date.now() - (S.extAt || 0) > 60000)) loadExt();
  if (S.view === 'chats') { if (S.ch.dock) closeDock(true); if (!S.ch.list) loadChats(); mountChatPane(); } else if (!S.ch.dock) unmountChatPane();
  mobTables(); renderBnav();
}
function matchQ(t) {
  const q = S.q.trim().toLowerCase(); if (!q) return true;
  return (t.title + ' ' + t.companyName + ' ' + t.id + ' ' + t.assignee).toLowerCase().includes(q);
}
function sortTasks(a, b) {
  return prioRank(a.priority) - prioRank(b.priority) || String(a.due).localeCompare(String(b.due)) || String(a.id).localeCompare(String(b.id));
}

/* ====================== TASKS VIEW ====================== */
function viewTasks() {
  const K = S.d.consts, m = me(), td = today();
  const mine = S.d.tasks.filter(t => t.assignee === m || splitList(t.participants).includes(m));
  const st = S.d.commentStats;
  const stats = [
    { k: 'late', l: 'Ժամկետանց', v: mine.filter(t => t.due && t.due < td).length, c: 'var(--bad)', i: 'alert' },
    { k: 'today', l: 'Այսօրվա ժամկետով', v: mine.filter(t => t.due === td).length, c: 'var(--warn)', i: 'clock' },
    { k: 'open', l: 'Իմ բաց թասքերը', v: mine.filter(t => t.kind === K.KIND_TASK).length, c: 'var(--accent-fg)', i: 'list' },
    isMgr()
      ? { k: 'review', l: 'Սպասում են ստուգման', v: S.d.tasks.filter(t => t.status === 'Սպասում է ստուգման').length, c: 'var(--stamp-fg)', i: 'eye' }
      : { k: 'comments', l: 'Նոր մեկնաբանություններ', v: S.d.tasks.filter(t => st[t.id] && st[t.id].unread).length, c: 'var(--stamp-fg)', i: 'chat' }
  ];

  let list = S.d.tasks.slice();
  const quick = S.f.quick;
  if (quick) {
    if (quick === 'late') list = mine.filter(t => t.due && t.due < td);
    if (quick === 'today') list = mine.filter(t => t.due === td);
    if (quick === 'open') list = mine.filter(t => t.kind === K.KIND_TASK);
    if (quick === 'review') list = S.d.tasks.filter(t => t.status === 'Սպասում է ստուգման');
    if (quick === 'comments') list = S.d.tasks.filter(t => st[t.id] && st[t.id].unread);
  } else {
    if (!S.f.withReports) list = list.filter(t => t.kind === K.KIND_TASK);
    if (S.scope === 'mine') list = list.filter(t => t.assignee === m);
    if (S.scope === 'joined') list = list.filter(t => splitList(t.participants).includes(m));
    if (S.scope === 'given') list = list.filter(t => t.createdBy === m);
    if (S.f.employee.length) list = list.filter(t => S.f.employee.includes(t.assignee) || splitList(t.participants).some(n => S.f.employee.includes(n)));
    if (S.f.company.length) list = list.filter(t => S.f.company.includes(t.companyId || NONE));
    if (S.f.status.length) list = list.filter(t => S.f.status.includes(t.status));
  }
  list = list.filter(matchQ).sort(sortTasks);

  const gOrder = pageOn('groups');
  const groups = K.PRIORITIES.map((p, i) => ({ p, i, items: list.filter(t => prioRank(t.priority) === i) })).filter(g => g.items.length)
    .sort((x, y) => gOrder.indexOf(x.p) - gOrder.indexOf(y.p));
  const other = list.filter(t => prioRank(t.priority) === 9);
  if (other.length) groups.push({ p: 'Առանց կարևորության', i: 3, items: other });
  const allStatuses = [...new Set(K.TASK_STATUSES.concat(S.f.withReports ? K.REPORT_STATUSES : []))];
  const cardsOn = pageOn('cards'), fOn = pageOn('filters');
  const byStat = Object.fromEntries(stats.map(x => [x.k, x]));
  const shown = cardsOn.map(k => byStat[k]).filter(Boolean);
  const F = {
    scope: () => `<div class="seg">${[['mine', 'Ինձ տրված'], ['joined', 'Ինձ կցված'], ['given', 'Իմ տվածները'], ['all', 'Բոլորը']].map(([k, l]) => `<button class="${S.scope === k ? 'on' : ''}" data-act="scope" data-k="${k}">${l}</button>`).join('')}</div>`,
    company: () => msel('f.company', compOpts(true), 'Բոլոր կազմակերպությունները'),
    employee: () => msel('f.employee', empOpts(), 'Բոլոր աշխատակիցները'),
    status: () => msel('f.status', allStatuses.map(x => ({ v: x, l: x })), 'Բոլոր կարգավիճակները'),
    withReports: () => `<label class="chk"><input type="checkbox" data-chg="f.withReports" ${S.f.withReports ? 'checked' : ''}> Ներառել հաշվետվությունները</label>`
  };
  const tools = `<span class="sp"></span><button class="btn sm colbtn" data-act="pageModal" title="Քարտերի, ֆիլտրերի և խմբերի դասավորություն">⇅ Դասավորել էջը</button>${colBtn('tasks')}<span class="muted">${list.length} թասք</span>`;
  const B = {
    cards: () => shown.length ? `<div class="stats" data-drag="1" style="--sn:${shown.length}">${shown.map(s => `<button class="stat" draggable="true" data-k="${s.k}" data-act="quick" title="Սեղմեք՝ ֆիլտրելու, քաշեք՝ տեղը փոխելու համար" style="${S.f.quick === s.k ? 'outline:2px solid ' + s.c : ''}"><div class="ic" style="background:color-mix(in srgb, ${s.c} 14%, var(--surface));color:${s.c}">${ico(s.i)}</div><div><div class="v">${s.v}</div><div class="l">${s.l}</div></div></button>`).join('')}</div>` : '',
    filters: () => `<div class="toolbar">
    ${quick ? `<span class="tag" style="background:var(--accent-soft);color:var(--accent-fg);padding:6px 10px">Ֆիլտր՝ ${esc((byStat[quick] || {}).l || '')}</span><button class="btn sm" data-act="quick" data-k="">${ico('nx-x')}Մաքրել</button>` : `
    ${fOn.map(k => F[k]()).join('')}
    ${S.f.company.length + S.f.employee.length + S.f.status.length ? `<button class="btn sm" data-act="clearF">${ico('nx-x')}Մաքրել ֆիլտրերը</button>` : ''}`}
    ${tools}
  </div>`,
    list: () => (pageOn('blocks').includes('filters') ? '' : `<div class="toolbar">${quick ? `<span class="tag" style="background:var(--accent-soft);color:var(--accent-fg);padding:6px 10px">Ֆիլտր՝ ${esc((byStat[quick] || {}).l || '')}</span><button class="btn sm" data-act="quick" data-k="">${ico('nx-x')}Մաքրել</button>` : ''}${tools}</div>`) + (groups.length ? groups.map(g => `
    <div class="group">
      <div class="ghead"><span class="dot" style="background:${PRIO_COLORS[g.i]}"></span>${esc(g.p)}<span class="n">${g.items.length}</span></div>
      <div class="list">${g.items.map(rowHtml).join('')}</div>
    </div>`).join('') : `<div class="list"><div class="empty"><div class="big"></div>Թասքեր չկան${S.scope === 'mine' && !quick ? '. Ստեղծեք նորը «+ Նոր թասք» կոճակով։' : ''}</div></div>`)
  };
  return pageOn('blocks').map(k => B[k]()).join('');
}
function rowHtml(t) {
  const di = dueInfo(t.due);
  const cs = S.d.commentStats[t.id];
  const people = [t.assignee].concat(splitList(t.participants)).filter(Boolean);
  const isRep = t.kind === S.d.consts.KIND_REPORT;
  const cols = visCols('tasks'), sepComp = cols.some(c => c.k === 'company');
  const cell = {
    title: () => `<div class="tmain"><div class="ttitle">${esc(t.title)}${isRep ? '<span class="kt">Հաշվետվ.</span>' : ''}</div>
      <div class="tmeta">${t.companyName && !sepComp ? `<b>${esc(t.companyName)}</b> · ` : ''}${esc(t.id)}${t.createdBy && t.createdBy !== t.assignee ? ' · տվել է ' + esc(t.createdBy) : ''}</div></div>`,
    company: () => `<div class="c-x" style="font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.companyName || '—')}</div>`,
    status: () => `<div class="pillw"><span class="pill" style="--c:${stColor(t.status)}">${esc(t.status)}</span></div>`,
    people: () => `<div class="people">${people.slice(0, 4).map(n => av(n)).join('')}${people.length > 4 ? `<span class="av" style="background:var(--muted)">+${people.length - 4}</span>` : ''}</div>`,
    priority: () => `<div class="c-x" style="font-size:12.5px;display:flex;gap:6px;align-items:center"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${prioColor(t.priority)}"></span>${esc(t.priority || '')}</div>`,
    due: () => `<div class="due ${di.cls}">${ico('cal')}${esc(di.label)}</div>`,
    comments: () => `<div class="cm ${cs && cs.unread ? 'unread' : ''}">${cs ? ico('chat') + cs.count : ''}</div>`
  };
  return `<div class="trow" data-act="open" data-id="${esc(t.id)}">
    <span class="stripe" style="background:${prioColor(t.priority)}"></span>
    ${cols.map(c => cell[c.k]()).join('')}
  </div>`;
}

/* ====================== REPORTS VIEW ====================== */
function reportsFiltered() {
  const K = S.d.consts, m = me();
  let list = S.d.tasks.filter(t => t.kind === K.KIND_REPORT);
  if (S.rf.scope === 'mine') list = list.filter(t => t.assignee === m || splitList(t.participants).includes(m) || (isMgr() && t.status === 'Սպասում է ստուգման'));
  if (S.rf.company.length) list = list.filter(t => S.rf.company.includes(t.companyId));
  if (S.rf.code.length) list = list.filter(t => S.rf.code.includes(t.reportCode));
  return list.filter(matchQ);
}

    && (!S.sf.company.length || S.sf.company.includes(t.companyId || NONE)) && (!S.sf.employee.length || S.sf.employee.includes(t.assignee)));

  // ---- KPI ----

    <div class="kpi"><div class="v">${A.early}</div><div class="l">Ժամկետից շուտ</div><div class="s">${A.early ? 'միջինը ' + fmt1(A.avgEarly) + ' օր շուտ' : '—'}</div></div>
    <div class="kpi"><div class="v" style="color:${overdueNow.length ? 'var(--bad)' : 'inherit'}">${overdueNow.length}</div><div class="l">Հիմա ժամկետանց</div><div class="s">բաց թասքեր</div></div>

  // ---- per employee ----

  let emps = empNames.map(n => {

    const a = agg(mine);
    a.name = n; a.part = inP.filter(r => splitList(r.participants).includes(n)).length;
    a.overdue = overdueNow.filter(t => t.assignee === n).length;

  const sorters = { done: (a, b) => b.n - a.n, pct: (a, b) => (b.pct ?? -1) - (a.pct ?? -1) || b.n - a.n, early: (a, b) => b.early - a.early || b.avgEarly - a.avgEarly, late: (a, b) => b.late - a.late || b.avgLate - a.avgLate, overdue: (a, b) => b.overdue - a.overdue };
  emps.sort(sorters[S.sf.sort] || sorters.done);

  // ---- highlights ----
  const withMin = emps.filter(e => e.n >= 3);
  const top = emps.slice().sort(sorters.done)[0];
  const fast = withMin.filter(e => e.early).sort((a, b) => (b.early / b.n) - (a.early / a.n) || b.avgEarly - a.avgEarly)[0];
  const slow = emps.filter(e => e.late).sort(sorters.late)[0];
  const hl = `<div class="hl">
    <div class="scard"><div class="big"></div><div><div class="muted" style="font-size:12px">Ամենաշատ ավարտած</div><b>${top && top.n ? esc(top.name) : '—'}</b><span class="muted" style="font-size:12.5px">${top && top.n ? top.n + ' թասք' : ''}</span></div></div>
    <div class="scard"><div class="big">${ico('nx-bolt')}</div><div><div class="muted" style="font-size:12px">Ամենաշատը ժամկետից շուտ</div><b>${fast ? esc(fast.name) : '—'}</b><span class="muted" style="font-size:12.5px">${fast ? `${fast.early} / ${fast.n} թասք, միջինը ${fmt1(fast.avgEarly)} օր շուտ` : 'առնվազն 3 ավարտված թասք'}</span></div></div>
    <div class="scard"><div class="big">${ico('nx-warn')}</div><div><div class="muted" style="font-size:12px">Ամենաշատ ուշացում</div><b>${slow ? esc(slow.name) : '—'}</b><span class="muted" style="font-size:12.5px">${slow ? `${slow.late} թասք, միջինը ${fmt1(slow.avgLate)} օր ուշ` : 'ուշացումներ չկան '}</span></div></div>
  </div>`;

  const th = (k, l) => `<th data-act="stSort" data-k="${k}" class="${S.sf.sort === k ? 'on' : ''}">${l}${S.sf.sort === k ? ' ↓' : ''}</th>`;
  const empTable = `<div class="scard" style="margin-top:14px"><h3>Ըստ աշխատակիցների</h3><div class="sub">Հաշվվում է կատարողին։ Սեղմեք սյունակի վերնագրին՝ դասավորելու համար։</div>
    <div class="stwrap"><table class="st"><thead><tr><th>Աշխատակից</th>${th('done', 'Ավարտված')}${th('pct', 'Ժամանակին')}${th('early', 'Շուտ')}<th>Միջ. օր շուտ</th>${th('late', 'Ուշ')}<th>Միջ. օր ուշ</th><th>Մասնակցել է</th>${th('overdue', 'Հիմա ժամկետանց')}</tr></thead><tbody>
    ${emps.map(e => `<tr><td><span style="display:inline-flex;gap:8px;align-items:center;cursor:pointer" data-act="stEmp" data-n="${esc(e.name)}">${av(e.name, 'sm')}${esc(e.name)}</span></td>
      <td><b>${e.n}</b></td>
      <td>${e.pct == null ? '<span class="muted">—</span>' : `<span class="pct">${e.pct}%<span class="mini"><span style="width:${e.pct}%"></span></span></span>`}</td>
      <td>${e.early || '<span class="muted">0</span>'}</td><td>${e.early ? fmt1(e.avgEarly) : '<span class="muted">—</span>'}</td>
      <td style="${e.late ? 'color:var(--bad);font-weight:600' : ''}">${e.late || '<span class="muted">0</span>'}</td><td>${e.late ? fmt1(e.avgLate) : '<span class="muted">—</span>'}</td>
      <td>${e.part || '<span class="muted">0</span>'}</td>
      <td style="${e.overdue ? 'color:var(--bad);font-weight:600' : ''}">${e.overdue || '<span class="muted">0</span>'}</td></tr>`).join('') || '<tr><td colspan="9" class="muted" style="text-align:center;padding:24px">Այս ժամանակաշրջանում ավարտված թասքեր չկան</td></tr>'}
    </tbody></table></div></div>`;

  // ---- per company ----
  const byC = {};
  inP.forEach(r => { const k = r.companyId || '_'; (byC[k] || (byC[k] = { name: r.companyId ? ((company(r.companyId) || {}).name || r.companyName) : 'Ներքին թասքեր', list: [] })).list.push(r); });
  const comps = Object.values(byC).map(c => Object.assign(agg(c.list), { name: c.name })).sort((a, b) => b.n - a.n);
  const maxC = comps.reduce((m, c) => Math.max(m, c.n), 0) || 1;
  const shown = comps.slice(0, 15), rest = comps.slice(15);
  const compCard = `<div class="scard"><h3>Ըստ կազմակերպությունների</h3><div class="sub">Ավարտված թասքերի քանակը (հաշվետվությունների հետ միասին՝ ըստ ընտրված ֆիլտրի)</div>
    <div class="legend" style="margin-bottom:8px"><span><i style="background:${C_GOOD}"></i>Ժամանակին</span><span><i style="background:${C_LATE}"></i>Ուշացումով</span></div>
    ${shown.map(c => `<div class="hbar" title="${esc(c.name)}՝ ${c.n} (ժամանակին ${c.onTime}, ուշ ${c.late})"><span class="nm">${esc(c.name)}</span>
      <span class="track" style="width:${Math.max(2, c.n / maxC * 100)}%">${c.onTime ? `<span class="seg" style="flex:${c.onTime};background:${C_GOOD}"></span>` : ''}${c.late ? `<span class="seg" style="flex:${c.late};background:${C_LATE}"></span>` : ''}</span>
      <span class="num"><b>${c.n}</b>${c.late ? ` <small>· ${c.late} ուշ</small>` : ''}</span></div>`).join('') || '<div class="muted" style="padding:16px 0">Տվյալներ չկան</div>'}
    ${rest.length ? `<div class="hint" style="margin-top:8px">Եվս ${rest.length} կազմակերպություն՝ ընդհանուր ${rest.reduce((a, c) => a + c.n, 0)} թասք</div>` : ''}
  </div>`;

  // ---- trend ----
  const N = { 'Ամսական': 12, 'Եռամսյակային': 8, 'Կիսամյակային': 6, 'Տարեկան': 5 }[S.sf.type];
  const trend = [];
  for (let i = N - 1; i >= 0; i--) {
    const q = statPeriod(S.sf.type, S.sf.off - i);
    const a = agg(all.filter(r => r.done >= q.start && r.done <= q.end));
    trend.push({ label: shortLabel(S.sf.type, q, i === N - 1), full: q.label, on: a.onTime, late: a.late, n: a.n, pct: a.pct, cur: i === 0 });
  }
  S.trend = trend;
  const trendCard = `<div class="scard"><h3>Դինամիկա</h3><div class="sub">Ավարտված թասքեր՝ վերջին ${N} ժամանակաշրջանում</div>
    <div class="legend" style="margin-bottom:8px"><span><i style="background:${C_GOOD}"></i>Ժամանակին</span><span><i style="background:${C_LATE}"></i>Ուշացումով</span></div>
    <div class="chartwrap" id="trendChart">${trendSvg(trend)}<div class="ctip" id="ctip"></div></div></div>`;

  return bar + kpis + `<div class="sgrid2">${trendCard}${compCard}</div>` + hl + empTable;
}

/** Ամբողջ թվերով առանցք՝ 1/2/5 × 10ⁿ քայլով */
function niceScale(v) {
  const raw = Math.max(1, v) / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = Math.max(1, [1, 2, 5, 10].map(m => m * p).find(x => x >= raw));
  const ticks = Math.max(1, Math.ceil(Math.max(1, v) / step));
  return { step, max: step * ticks, ticks };
}
function trendSvg(tr) {
  const vw = ($('#view') && $('#view').clientWidth) || 900;
  const W = vw >= 1100 ? 560 : Math.max(320, Math.min(560, vw - 70)), H = 240, L = 34, R = 8, T = 14, B = 38;
  const sc = niceScale(Math.max(...tr.map(t => t.n)));
  const max = sc.max;
  const cw = (W - L - R) / tr.length, bw = Math.min(34, cw * 0.62);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= sc.ticks; i++) {
    const v = sc.step * i, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" style="stroke:var(--line)" stroke-width="1"${i ? ' stroke-dasharray="2 3"' : ''}/><text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${v}</text>`;
  }
  const rTop = (x, y0, w, h) => { const r = Math.min(4, h, w / 2); return `M${x},${y0 + h}V${y0 + r}Q${x},${y0} ${x + r},${y0}H${x + w - r}Q${x + w},${y0} ${x + w},${y0 + r}V${y0 + h}Z`; };
  const cols = tr.map((t, i) => {
    const x = L + cw * i + (cw - bw) / 2;
    const yOn = y(t.on), hOn = y(0) - yOn;
    const yL = y(t.on + t.late), hL = yOn - yL;
    let marks = '';
    const gap = t.on && t.late ? 2 : 0;
    if (t.late) marks += t.on ? `<path d="${rTop(x, yL, bw, Math.max(0, hL - gap))}" fill="${C_LATE}"/>` : `<path d="${rTop(x, yL, bw, hL)}" fill="${C_LATE}"/>`;
    if (t.on) marks += t.late ? `<rect x="${x}" y="${yOn}" width="${bw}" height="${hOn}" fill="${C_GOOD}"/>` : `<path d="${rTop(x, yOn, bw, hOn)}" fill="${C_GOOD}"/>`;
    const lbl = `<text x="${x + bw / 2}" y="${H - 22}" text-anchor="middle" font-size="11" style="fill:${t.cur ? 'var(--ink)' : 'var(--muted)'}" font-weight="${t.cur ? 700 : 400}">${esc(t.label.top)}</text>` + (t.label.sub ? `<text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${esc(t.label.sub)}</text>` : '');
    const top = t.cur && t.n ? `<text x="${x + bw / 2}" y="${yL - 5}" text-anchor="middle" font-size="11" font-weight="700" style="fill:var(--ink)">${t.n}</text>` : '';
    return `<g class="col" data-i="${i}"><rect class="hit" x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T - B}" fill="transparent"/>${marks}${top}${lbl}</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ավարտված թասքերի դինամիկա">${g}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--field-line)"/>${cols}</svg>`;
}
function bindStatsChart() {
  const wrap = $('#trendChart'); if (!wrap) return;

    if (!codes.length) { m.querySelector('#cPrev').innerHTML = '<span class="muted">Նշեք հաշվետվությունները, և այստեղ կտեսնեք, թե ինչ թասքեր կստեղծվեն։</span>'; return; }
    fd.startDate = fd.startDate || S.d.settings.defaultStart;
    const keys = new Set(S.d.tasks.concat(S.d.recentReports).filter(t => c && t.companyId === c.id).map(t => t.reportCode + '|' + t.period));

      const pr = periodsFrom(rt.period, fd.startDate, today());
      const cut = addDays(today(), -(S.d.settings.overdueGrace || 0));
      const past = pr.due.filter(p => rtDue(rt, p) < cut);
      const fresh = pr.due.filter(p => rtDue(rt, p) >= cut && !keys.has(code + '|' + p.period));
      const now = fresh.length ? `հիմա կստեղծվի՝ ${fresh.slice(0, 4).map(p => `<b>${esc(periodLabel(p))}</b> (ժամկ. ${esc(rtDue(rt, p))})`).join(', ')}${fresh.length > 4 ? ` և ևս ${fresh.length - 4}` : ''}` : '<span class="muted">հիմա նոր թասք չկա</span>';
      const nx = pr.upcoming ? ` · հաջորդը՝ <b>${esc(periodLabel(pr.upcoming))}</b>, կհայտնվի ${esc(pr.upcoming.next)}, ժամկետ ${esc(rtDue(rt, pr.upcoming))}` : '';
      const sk = past.length ? `<div class="muted" style="font-size:12px;margin-left:4px">↷ ${past.length} ժամանակաշրջան (${esc(periodLabel(past[0]))} – ${esc(periodLabel(past[past.length - 1]))}) բաց է թողնվում՝ ժամկետն արդեն անցել է</div>` : '';
      return `<div style="margin:3px 0"><span class="tag">${esc(code)}</span> ${now}${nx}${sk}</div>`;
    }).join('');
  };
  m.addEventListener('change', prev); m.addEventListener('input', prev); prev();
}

function showDiag(name, r) {
  const d = r.diag || [];
  if (!d.length) { toast('Պահպանվեց', 'ok'); return; }
  const rows = d.map(x => {
    let st;
    if (x.problem) st = `<span style="color:var(--red)">${ico('nx-warn')}${esc(x.problem)}</span>`;
    else {
      const parts = [];
      if (x.created && x.created.length) parts.push(`<span style="color:var(--green)">${ico('nx-check')}ստեղծվեց՝ ${esc(x.created.join(', '))}</span>`);
      else if (x.open) parts.push(`<span class="muted">բաց թասք արդեն կա (${x.open})</span>`);
      if (x.skipped) parts.push(`<span class="muted">↷ ${x.skipped.n} հին ժամանակաշրջան (${esc(x.skipped.from)} – ${esc(x.skipped.to)}) բաց թողնվեց՝ ժամկետն անցել է</span>`);
      if (x.next) parts.push(`հաջորդը՝ <b>${esc(x.next.label)}</b>, կհայտնվի <b>${esc(x.next.date)}</b>, ժամկետ ${esc(x.next.due)}`);
      st = parts.join('<br>') || '<span class="muted">—</span>';
    }
    return `<tr><td><b>${esc(x.code)}</b><div class="muted" style="font-size:12px">${esc(x.name || '')}${x.period ? ' · ' + esc(x.period) : ''}</div></td><td>${st}</td></tr>`;
  }).join('');
  openModal('Պահպանված է՝ ' + name, `<p class="muted" style="margin-top:0">Ամեն հաշվետվության թասքը հայտնվում է ժամանակաշրջանի ավարտին հաջորդող օրը։</p>

}

async function reqTake(id) {
  const r = reqById(id); if (!r) return;
  const who = r.assignee || r.handledBy;
  if (!await NxDlg.confirm('Վերցնե՞լ «' + r.title + '»-ը Ձեզ' + (who ? '\nԱյն կփոխանցվի ' + who + '-ից Ձեզ, ' + who + '-ը կստանա ծանուցում։' : ''), { ok: 'Վերցնել', danger: false })) return;
  try { const x = await call('takeRequest', { id }); toast('Հարցումը Ձերն է' + (x.taskId ? '՝ թասք ' + esc(x.taskId) : ''), 'ok'); S.reqs = null; await refresh(); if (S.view === 'requests') loadRequests(); }
  catch (e) { toast(esc(e.message), 'err'); }
}
function reqById(id) { return S.reqs && S.reqs.rows.find(r => r.id === id); }
async function setReqStatus(id, status, note) {
  try {
    const r = await call('setRequestStatus', { id, status, note });
    if (!S.reqs || !S.reqs.rows) { loadRequests(); return true; }
    const i = S.reqs.rows.findIndex(x => x.id === id); if (i >= 0) S.reqs.rows[i] = Object.assign(S.reqs.rows[i], r);
    if (S.d.reqNew) { const cnt = S.reqs.rows.filter(x => x.status === 'Նոր'); S.d.reqNew = {}; cnt.forEach(x => S.d.reqNew[x.companyId] = (S.d.reqNew[x.companyId] || 0) + 1); }
    renderShell(); renderView(); return true;
  } catch (e) { toast(esc(e.message), 'err'); return false; }
}

function readB64(f) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('Չհաջողվեց կարդալ ' + f.name)); r.readAsDataURL(f); });
}
async function uploadFiles(files) {
  if (!S.drawer || !files.length) return;
  const id = S.drawer.id, st = () => $('#upSt'); let n = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 25 * 1048576) { toast(`«${esc(f.name)}» ֆայլը մեծ է 25 ՄԲ-ից`, 'err'); continue; }
    if (st()) st().textContent = `Բեռնվում է ${i + 1}/${files.length}՝ ${f.name}…`;
    try {
      const data = await readB64(f);
      const r = await call('uploadFile', { taskId: id, file: { name: f.name, mime: f.type, data } }, { silent: true });
      n++; if (S.drawer && S.drawer.id === id) { S.drawer.data.files = r.files; renderDrawer(); }
    } catch (e) { toast(esc(e.message), 'err'); }
  }
  if (st()) st().textContent = '';
  if (n) toast('Կցվեց ' + n + ' ֆայլ', 'ok');
}

/** Պատճենում է տեքստը (աշխատում է նաև Apps Script-ի iframe-ում) */
function copyText(t) {
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
  } catch (e) {}
  if (!ok && navigator.clipboard) { try { navigator.clipboard.writeText(t); ok = true; } catch (e) {} }
  return ok;
}

async function musUpload(files) {

    if (f.size > 30 * 1048576) { toast(`«${esc(f.name)}» ֆայլը մեծ է 30 ՄԲ-ից. դրեք այն Drive-ի երաժշտության թղթապանակը և սեղմեք «Ավելացնել Drive-ից»`, 'err', null, 12000); continue; }
    if (st) st.textContent = `Վերբեռնվում է ${i + 1}/${files.length}՝ ${f.name}…`;
    try { const r = await call('musicUpload', { file: { name: f.name, mime: f.type, data: await readB64(f) }, slot: /^\d\d-\d\d$/.test(f.name.slice(0, 5)) ? '' : slot }, { silent: true }); (S.mus.rows = S.mus.rows || []).push(r); ok++; }

  renderView();
}

  const t = (el, n) => { const c = kids(el, n)[0]; return c ? c.textContent.trim() : ''; };

  return parts.map(p => {

    const ba = [t(p, 'BusinessAddress')]; const bx = kids(p, 'BusinessAddresses')[0];
    if (bx) [...bx.getElementsByTagNameNS('*', '*')].forEach(e => { if (!e.children.length && /address/i.test(e.localName) && e.textContent.trim()) ba.push(e.textContent.trim()); });

  });
}

function dueText(r) {
  const off = r.dueMonth === '' || r.dueMonth == null ? 1 : +r.dueMonth;
  const unit = { 'Ամսական': 'ամսվան', 'Եռամսյակային': 'եռամսյակին', 'Կիսամյակային': 'կիսամյակին', 'Տարեկան': 'տարվան' }[r.period] || '';
  if (r.period === 'Տարեկան' && off >= 1 && off <= 12) return `հաջորդ տարվա ${MONTHS_FULL[off - 1].toLowerCase()}ի ${r.dueDay}-ը`;
  if (off === 0) return `ժամանակաշրջանի վերջին ամսվա ${r.dueDay}-ը`;
  if (off === 1) return `${unit} հաջորդող ամսվա ${r.dueDay}-ը`;
  return `ավարտից ${off}-րդ ամսվա ${r.dueDay}-ը`;

  const patch = Object.assign({}, S.drawer.edit || {}, extra || {});
  if (!Object.keys(patch).length) { if (!stay) closeDrawer(); return; }
  if (patch.status && ARCHIVE_ST.includes(patch.status) && !(await NxDlg.confirm(`Նշե՞լ «${patch.status}»\nԹասքը կտեղափոխվի արխիվ։`, { ok: 'Այո, ' + patch.status, danger: false }))) return;

const ARCHIVE_ST = ['Ավարտված', 'Ուղարկված է'];
async function patchTask(patch, okMsg) {
  const id = S.drawer.id;
  // օպտիմիստական թարմացում՝ էկրանը փոխվում է անմիջապես, սերվերը հաստատում է հետո
  const i0 = S.d.tasks.findIndex(x => x.id === id);
  const before = i0 >= 0 ? Object.assign({}, S.d.tasks[i0]) : null;
  const local = Object.assign({}, patch);
  if (local.participants) local.participants = local.participants.join(', ');
  const willArchive = patch.status && ARCHIVE_ST.includes(patch.status);
  if (before && !willArchive) {
    Object.assign(S.d.tasks[i0], local);
    Object.assign(S.drawer.data.task, local);
    renderDrawer(); renderView();
  }
  try {
    const t = await call('updateTask', { id, patch }, { silent: !willArchive });
    const i = S.d.tasks.findIndex(x => x.id === id);
    if (t.archived) {
      if (i >= 0) S.d.tasks.splice(i, 1);
      toast('' + esc(t.status) + ' — տեղափոխվեց արխիվ', 'ok');
      S.arch = null; closeDrawer();
    } else {
      if (i >= 0) S.d.tasks[i] = t;
      if (S.drawer && S.drawer.id === id) { S.drawer.data.task = Object.assign(S.drawer.data.task, t); renderDrawer(); }
      if (okMsg) toast(okMsg, 'ok');
    }
    renderShell(); renderView();
    return true;
  } catch (e) {
    toast(esc(e.message), 'err');
    if (before) { const i = S.d.tasks.findIndex(x => x.id === id); if (i >= 0) S.d.tasks[i] = before; if (S.drawer && S.drawer.id === id) Object.assign(S.drawer.data.task, before); renderView(); }
    renderDrawer();
    return false;
  }
}
async function sendComment() {

/* ====================== 💼 ԱՇԽԱՏԱՎԱՐՁԻ ՀԱՇՎԻՉ ======================
   Դրույքները՝ ըստ ամսվա (ym ≥ from)։ Փոփոխության դեպքում ավելացնել նոր տող SAL_RULES-ում։
   Աղբյուրներ՝ ՀՀ հարկային օրենսգիրք, «Կուտակային կենսաթոշակների մասին», «Զինծառայողների ... վնասների հատուցման մասին»,
   «Առողջության համընդհանուր ապահովագրության մասին» ՀՕ-459-Ն (17.12.2025), ՊԵԿ պարզաբանում (25.12.2025) */
const SAL_RULES = [
  { from: '2023-01', it: 0.20, health: false,
    stamp: [[100000, 1500], [200000, 3000], [500000, 5500], [1000000, 8500], [Infinity, 15000]] },
  // 2025-ի դեկտեմբերից՝ առողջության ապահովագրավճար (>200 000), վճարողների դրոշմանիշայինը՝ 1 000
  { from: '2025-12', it: 0.20, health: true, stampIns: [[1000000, 1000], [Infinity, 15000]],
    stamp: [[100000, 1500], [200000, 3000], [500000, 5500], [1000000, 8500], [Infinity, 15000]] },
  // 2026-ի սեպտեմբերից՝ դրոշմանիշայինը 1 000 բոլորի համար (մինչև 1 000 000)
  { from: '2026-09', it: 0.20, health: true, stampIns: [[1000000, 1000], [Infinity, 15000]], stamp: [[1000000, 1000], [Infinity, 15000]] }
];
const SAL_SOC = { cap: 1125000, lim: 500000, low: 0.05, high: 0.10, minus: 25000, volNewCap: 56250 };
const SAL_HEALTH = { thr: 200000, lim: 500000, low: 4800, high: 10800 };
function salRules(ym) { let r = SAL_RULES[0]; SAL_RULES.forEach(x => { if (ym >= x.from) r = x; }); return r; }
function salBand(tbl, g) { for (const [lim, v] of tbl) if (g <= lim) return v; return tbl[tbl.length - 1][1]; }
/** Կեղտոտից՝ պահումները. o = {ym, soc:'mand'|'volOld'|'volNew'|'none', ins:'auto'|'yes'|'no', it10:bool} */
function salFromGross(g, o) {
  g = Math.max(0, Math.round(g)); const R = salRules(o.ym);
  const it = Math.round(g * (o.it10 ? 0.10 : R.it));
  let soc = 0;
  if (o.soc !== 'none' && g > 0) {
    const b = Math.min(g, SAL_SOC.cap);
    if (o.soc === 'volNew') soc = Math.min(Math.round(b * SAL_SOC.low), SAL_SOC.volNewCap);
    else soc = b <= SAL_SOC.lim ? Math.round(b * SAL_SOC.low) : Math.round(b * SAL_SOC.high - SAL_SOC.minus);
  }
  const insured = R.health && g > 0 && (o.ins === 'yes' || (o.ins === 'auto' && g > SAL_HEALTH.thr));
  const health = insured ? (g <= SAL_HEALTH.lim ? SAL_HEALTH.low : SAL_HEALTH.high) : 0;
  const stamp = g > 0 ? salBand(insured && R.stampIns ? R.stampIns : R.stamp, g) : 0;
  const ded = it + soc + stamp + health;
  return { gross: g, it, soc, stamp, health, insured, ded, net: g - ded };
}
/** Մաքուրից՝ կեղտոտ. շեմերի մոտ մաքուրը կարող է նվազել (նոր դրույք), ուստի որոնվում է ամեն միջակայքում առանձին և ընտրվում է ամենափոքր կեղտոտը */
function salFromNet(n, o) {

  const cuts = [0, 100000, 200000, 500000, 1000000, 1125000], top = Math.max(n * 3, 3000000), segs = [];
  cuts.forEach((c, i) => segs.push([i ? c + 1 : 1, i < cuts.length - 1 ? cuts[i + 1] : top]));
  let best = null;
  segs.forEach(([lo, hi]) => {
    if (salFromGross(hi, o).net < n) return;
    while (lo < hi) { const md = Math.floor((lo + hi) / 2); if (salFromGross(md, o).net >= n) hi = md; else lo = md + 1; }
    const r = salFromGross(lo, o);
    if (!best || (r.net === n && best.net !== n) || ((r.net === n) === (best.net === n) && r.gross < best.gross)) best = r;
  });
  return best || salFromGross(n, o);
}

}
function vtDrop(v) { VTL = VTL.filter(x => x !== v); const el = VT[v]; if (el && el.id !== 'view') { el.remove(); delete VT[v]; } vtSave(); }
/** Ակտիվացնում է v-ի section-ը (ստեղծում է, եթե չկա). true՝ եթե արդեն կար */
function vtActivate(v) {
  const cur = document.getElementById('view');
  vtAdd(v);
  if (!cur.dataset.v || cur.dataset.v === v) { cur.dataset.v = v; VT[v] = cur; vtDraw(); return true; }
  cur.dataset.sy = String(window.scrollY || 0); cur.removeAttribute('id'); cur.style.display = 'none';
  let el = VT[v]; const had = !!(el && document.body.contains(el));
  if (!had) { el = document.createElement('section'); el.className = 'content'; el.dataset.v = v; cur.parentNode.insertBefore(el, cur.nextSibling); VT[v] = el; }
  el.id = 'view'; el.style.display = '';
  vtDraw();
  return had;
}
/** Մենյուից/ներդիրից անցում արդեն բաց բաժին՝ առանց վերագծման (վիճակը մնում է) */
function vtKeep(v) {
  if (v === 'stats' && !isMgr()) v = 'tasks';
  const el = VT[v];
  if (!el || !document.body.contains(el) || v === S.view || v === 'chats' || v === 'home' || S.view === 'chats') return false;
  document.body.classList.remove('nx-home');
  const prev = S.view; S.view = v;
  if (!NAV_POP) histPush({ nxv: v });
  lsSet('nx_view', v); sideClose();
  vtActivate(v); renderShell(); $('#pageTitle').textContent = TITLES[v] || '';
  if (el.dataset.dv !== String(S.d.dv) && !(v === 'docs' && (S.docTab || 'make') === 'make') && v !== 'settings') renderView();
  else { mobTables(); renderBnav(); }
  window.scrollTo(0, +el.dataset.sy || 0);
  return true;
}
function vtClose(v) {
  const wasActive = v === S.view;
  VTL = VTL.filter(x => x !== v); vtSave();
  if (wasActive) {
    const next = VTL[VTL.length - 1] || 'home';
    if (!vtKeep(next)) { ACT.go({ dataset: { v: next } }); }
  }
  const el = VT[v]; if (el && el.id !== 'view') { el.remove(); delete VT[v]; }
  vtDraw();
}
function vtDraw() {
  const bar = document.getElementById('vtabs'); if (!bar) return;
  if (!S.view) { bar.innerHTML = ''; return; }
  const L = VTL.length || S.view === 'home' ? VTL : [S.view];
  bar.innerHTML = L.map(v => `<div class="wtab ${v === S.view ? 'on' : ''}" role="tab" aria-selected="${v === S.view}" tabindex="0" data-act="vtGo" data-v="${v}" title="${esc(TITLES[v])}"><span class="wt-i">${ico(VT_ICO[v] || 'list')}</span><span class="wt-t">${esc(TITLES[v])}</span>${L.length > 1 ? `<button type="button" class="wt-x" data-act="vtClose" data-v="${v}" aria-label="Փակել՝ ${esc(TITLES[v])}">${ico('x')}</button>` : ''}</div>`).join('');
}
Object.assign(ACT, { vtGo: el => ACT.go(el), vtClose: (el, e) => { e.stopPropagation(); vtClose(el.dataset.v); } });
/* ====================== 🧰 ԳՈՐԾԻՔՆԵՐ (վերևի տող) ====================== */
const TOOL_MENU = {
  tax: [['salary', '', 'Աշխատավարձի հաշվիչ', 'Գրանցված ↔ մաքուր, պահումներ'], ['turnover', '', 'Շրջանառության հարկի հաշվիչ', 'Եռամսյակային, ծախսերի նվազեցումով']]
};
function toolPopClose() { const p = $('#toolPop'); if (p) p.remove(); }
const IS_WIN = /Windows/i.test(navigator.userAgent);
if (!IS_WIN) document.documentElement.classList.add('nowin');
/** Համակարգչի ծրագրի գործարկում (Windows՝ ms-calculator:, ms-word:, ms-excel:) */
function toolLaunch(uri) { const a = document.createElement('a'); a.href = uri; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }
function toolTpl(f) {
  if (/github\.io$/.test(location.hostname)) return new URL(f, location.href).href;
  const base = String((S.d && S.d.settings && S.d.settings.clientAppUrl) || 'https:/' + '/datanumetrix-sudo.github.io/app/').replace(/\/?$/, '/');
  return base + 'team/' + f;
}
/** 🧮 / W / X՝ անմիջապես բացում է համակարգչի ծրագիրը */
function toolPrimary(el) { toolPopClose(); toolGo({ calc: 'calcApp', word: 'wordApp', excel: 'xlsApp' }[el.dataset.k]); }
function toolMenu(el, note, keep) {
  const k = el.dataset.k, was = $('#toolPop');
  toolPopClose(); if (was && was.dataset.k === k && !keep) return;
  const r = el.getBoundingClientRect(), d = document.createElement('div');
  d.id = 'toolPop'; d.className = 'tpop'; d.dataset.k = k;
  d.innerHTML = (note ? `<div style="font-size:12px;color:var(--muted);padding:6px 10px 8px;max-width:300px;border-bottom:1px solid var(--line);margin-bottom:4px">${esc(note)}</div>` : '') + TOOL_MENU[k].map(([a, i, t, sub]) => `<button type="button" data-act="toolGo" data-k="${a}"><span style="font-size:18px;width:24px;text-align:center">${i}</span><span><b style="font-weight:600">${t}</b><small>${sub}</small></span></button>`).join('');
  document.body.appendChild(d);
  d.style.top = (r.bottom + 6) + 'px'; d.style.left = Math.max(8, Math.min(r.left, innerWidth - d.offsetWidth - 8)) + 'px';
}
document.addEventListener('mousedown', e => { if ($('#toolPop') && !e.target.closest('#toolPop,[data-act=toolMenu],[data-act=toolPrimary]')) toolPopClose(); });
function toolGo(k, keep) {
  if (!keep) toolPopClose();
  if (k === 'calcApp') return toolLaunch('ms-calculator:');
  if (k === 'wordApp') return toolLaunch('ms-word:nft|u|' + toolTpl('blank.docx'));
  if (k === 'xlsApp') return toolLaunch('ms-excel:nft|u|' + toolTpl('blank.xlsx'));
  if (k === 'salary') return salCalcOpen();
  if (k === 'turnover') return toCalcOpen();
}
Object.assign(ACT, { toolMenu: el => toolMenu(el), toolPrimary: el => toolPrimary(el), toolGo: el => toolGo(el.dataset.k) });

document.addEventListener('click', e => {
  unlockAudio();
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('#npanel')) closeNotifs(); return; }
  if (el.dataset.act !== 'toggleNotifs' && !el.closest('#npanel')) closeNotifs();
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.act];
  if (fn) {
    try { const r = fn(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast(esc(err.message || String(err)), 'err'); }); }
    catch (err) { console.error(err); toast('Սխալ՝ ' + esc(err.message || String(err)) + ' (' + esc(el.dataset.act) + ')', 'err'); }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.dlm) { const F = docLogF(); if (el.checked) F.mark[el.dataset.dlm] = true; else delete F.mark[el.dataset.dlm]; renderView(); return; }
  if (el.dataset && el.dataset.dlx === 'all') { const F = docLogF(); F.mark = {}; if (el.checked) (F.rows || []).filter(r => !r.deletedAt && (isMgr() || r.by === me())).forEach(r => { F.mark[r.fid] = true; }); renderView(); return; }
  if (el.dataset && el.dataset.dlx === 'del') { const F = docLogF(); F.del = el.checked; F.rows = null; renderView(); return; }
  if (el.dataset && el.dataset.dl) { const F = docLogF(); F[el.dataset.dl] = el.value; if (el.dataset.dl === 'to') F.toAuto = !el.value || el.value === today(); F.rows = null; F.busy = false; renderView(); return; }
  if (el.id === 'taxYmIn') { if (/^\d{4}-\d\d$/.test(el.value)) { S.taxYm = el.value; renderView(); } return; }
  if (el.id === 'taxWho') { S.taxWho = el.value; renderView(); return; }
  if (el.id === 'docComp') { S.docComp = el.value; S.docMark = {}; renderView(); return; }
  if (el.hasAttribute && el.hasAttribute('data-markall')) { const L = (S.docList || {})[S.docComp]; S.docMark = {}; if (el.checked && L) L.files.forEach(f => { S.docMark[f.fid] = true; }); renderView(); return; }
  if (el.dataset.mark) { S.docMark = S.docMark || {}; S.docMark[el.dataset.mark] = el.checked; renderView(); return; }
  if (el.dataset.chg) {
    const k = el.dataset.chg, v = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'sound') { lsSet('nx_sound', v ? '1' : '0'); return; }
    const [o, f] = k.split('.');
    S[o][f] = v;
    if (o === 'af') { S.arch = null; renderView(); return; }
    renderView(); return;
  }
  if (el.dataset.dchg && S.drawer) {
    const k = el.dataset.dchg;
    if (k === 'addPart') { if (!el.value) return; const E = S.drawer.edit || {}; const cur = E.participants || splitList(S.drawer.data.task.participants); stageEdit('participants', cur.concat(el.value)); return; }
    stageEdit(k, el.value);
  }
});
let rzTimer;
// ժամանակավոր ղեկավարի ժամկետը լրացավ՝ վերաբեռնել (ադմինի բաժինները կփակվեն)
setInterval(() => { if (S.d && S.d.me && S.d.me.tempUntil && today() > S.d.me.tempUntil) { S.d.me.tempUntil = ''; toast('Ժամանակավոր ղեկավարի ժամկետը ավարտվեց', ''); refresh(); } }, 60000);
window.addEventListener('resize', () => { clearTimeout(rzTimer); rzTimer = setTimeout(() => { if (S.d && S.view === 'stats' && S.stats) renderView(); }, 250); });
let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value; if (S.view === 'archive') { S.arch = null; } renderView(); }, 200); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.msOpen) closeMs(); else if ($('#modal').classList.contains('on')) closeModal(); else if (S.drawer) ACT.closeDrawer(); else closeNotifs(); }
});

/* ====================== start ====================== */
(function init() {
  S.token = lsGet('nx_token', null);
  if (S.token) boot(); else showLogin();
})();

(function () { var b = document.getElementById('nxboot'); if (b) b.remove(); })();
</script>
