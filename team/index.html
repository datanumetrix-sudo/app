/* Numetrix UI — ընդհանուր ոճ Numetrix HR, Numetrix Tasks և «Պայմանագրեր» ծրագրերի համար։
   Աղբյուրը՝ Numetrix HR 1.5.9-ի app.css (նույն թոքենները, նույն դասերը)։ Մուգ թեման՝ ըստ համակարգի կամ <html data-theme="dark">։
   Մի փոխեք արժեքները առանձին ծրագրում. փոփոխությունը արեք այստեղ և թարմացրեք երեք ծրագրում էլ։ */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F7F9FC;
  --surface-3: #E9EDF5;
  --seg-on: #FFFFFF;
  --ink: #0F172A;
  --ink-2: #334155;
  --muted: #5B6B82;
  --line: #E5E9F2;
  --line-2: #EEF1F7;
  --accent: #101B34;
  --accent-fg: #1F3A75;
  --accent-ink: #FFFFFF;
  --accent-soft: #EDF0F6;
  --stamp: #7C3AED;
  --stamp-fg: #7C3AED;
  --stamp-soft: #EFE7FD;
  --stamp-ink: #FFFFFF;
  --info: #0369A1;
  --info-soft: #E2F4FC;
  --ok: #166534;
  --ok-soft: #DCF5E6;
  --warn: #92400E;
  --warn-soft: #FDF1D6;
  --bad: #B91C1C;
  --bad-soft: #FDE8E8;
  --chip: #ECEEF1;
  --chip-ink: #4B5A70;
  --field-bg: #FFFFFF;
  --field-line: #C3CCDA;
  --field-hover: #98A6BD;
  --field-ro: #F2F5F9;
  --field-ro-line: #D9DFE8;
  --bad-row: #FDF1F1;
  --bad-row-hover: #FBE7E7;
  --paper: #FFFFFF;
  --paper-ink: #111827;
  --focus: #1F3A75;
  --scrim: rgba(13, 21, 48, .5);
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px rgba(15, 23, 42, .08);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
  --side-bg: #101B34;
  --side-border: #101B34;
  /* Պատվիրատուի օրինակի գույները (2026-10-15)․ մուգ կապույտ և ոսկեգույն */
  --gold: #C99A3D;
  --navy: #101B34;
  --tile: #101B34;
  --title: #16213A;
  --frame: #E1E5EC;
  --side-active: #2D3036;
  --side-ink: #C7D0EA;
  --side-strong: #FFFFFF;
  --side-muted: #8EA0D6;
  --side-hover: #18213F;
  --side-card: #16214A;
  --side-field: #1B233C;
  --side-line: #2E3858;
  --side-badge: #2F364D;
  --side-on: #C99A3D;
  --side-on-badge: #E3C27A;
  --font-ui: "Noto Sans Armenian", "Noto Sans", "Segoe UI", Arial, sans-serif;
  --font-doc: "Noto Serif Armenian", "Noto Serif", Georgia, "Times New Roman", serif;
  --font-code: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans Armenian", monospace;
  --r: 8px;
  --r-lg: 12px;
  --side-w: 274px;
}

    --ink: #E6EAF2; --ink-2: #C3CADB; --muted: #94A0B8; --line: #27324E; --line-2: #1E2842;
    --accent: #2F62F6; --accent-fg: #8DADFF; --accent-ink: #FFFFFF; --accent-soft: #1B2955;
    --stamp: #7C3AED; --stamp-fg: #C4A8FF; --stamp-soft: #2B2050; --stamp-ink: #FFFFFF;
    --info: #6DCFF6; --info-soft: #0F2C3D; --ok: #6BD69A; --ok-soft: #13301F; --warn: #F2C04D; --warn-soft: #352809;
    --bad: #F79494; --bad-soft: #3B1A1E; --chip: #222C45; --chip-ink: #B4BED2;
    --field-bg: #0E1628; --field-line: #3A4766; --field-hover: #5A6890; --field-ro: #151E33; --field-ro-line: #2A3550; --bad-row: #2A1619; --bad-row-hover: #331B1F;
    --paper: #18213A; --paper-ink: #E6EAF2; --focus: #8DADFF; --scrim: rgba(2, 5, 14, .62);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
    --side-border: #1E2842; --gold: #D9AE55; --tile: #22305A; --title: #E6EAF2; --frame: #27324E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #121A2E; --surface-2: #172036; --surface-3: #1C2740; --seg-on: #2B3858;
  --ink: #E6EAF2; --ink-2: #C3CADB; --muted: #94A0B8; --line: #27324E; --line-2: #1E2842;
  --accent: #2F62F6; --accent-fg: #8DADFF; --accent-ink: #FFFFFF; --accent-soft: #1B2955;
  --stamp: #7C3AED; --stamp-fg: #C4A8FF; --stamp-soft: #2B2050; --stamp-ink: #FFFFFF;
  --info: #6DCFF6; --info-soft: #0F2C3D; --ok: #6BD69A; --ok-soft: #13301F; --warn: #F2C04D; --warn-soft: #352809;
  --bad: #F79494; --bad-soft: #3B1A1E; --chip: #222C45; --chip-ink: #B4BED2;
  --field-bg: #0E1628; --field-line: #3A4766; --field-hover: #5A6890; --field-ro: #151E33; --field-ro-line: #2A3550; --bad-row: #2A1619; --bad-row-hover: #331B1F;
  --paper: #18213A; --paper-ink: #E6EAF2; --focus: #8DADFF; --scrim: rgba(2, 5, 14, .62);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
  --side-border: #1E2842; --gold: #D9AE55; --tile: #22305A; --title: #E6EAF2; --frame: #27324E;

  --page-x: 23px;

  --r-pill: 99px;
  --top-h: 52px;

* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-fg); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.code, .num { font-family: var(--font-code); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.num { text-align: right; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
/* ---------- Shell ----------
   Պատվիրատուի օրինակով․ ձախում՝ մուգ ուղղորդիչ առանձին քարտով, աջում՝ սպիտակ աշխատանքային դաշտ եզրագծով, ներդիրները՝ դրա վերևում */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); gap: var(--gap-page); min-height: 100%; padding: 6px 10px 10px; }
.app.nav-off { grid-template-columns: minmax(0, 1fr); }
.app.nav-off > .side { display: none; }
.side {
  position: sticky; top: 6px; height: calc(100vh - 16px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--side-line) transparent;
  background: var(--side-bg); color: var(--side-ink); border-radius: var(--r-lg); display: flex; flex-direction: column;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 16px 14px; }
.brand img { width: 40px; height: 40px; flex: none; }
.brand b { display: block; font-size: 17px; font-weight: 700; color: var(--side-strong); letter-spacing: -.01em; line-height: 1.2; }
.brand span { display: block; font-size: 12.5px; color: var(--side-muted); }
.orgpick { margin: 2px 12px 8px; }
.orgpick label { display: block; font-size: 11px; color: var(--side-muted); text-transform: uppercase; letter-spacing: .07em; margin: 0 0 5px 4px; }
.orgpick select { width: 100%; background-color: var(--side-field); border-color: var(--side-line); color: var(--side-strong); color-scheme: dark; }
.side-head { display: flex; align-items: center; gap: 4px; padding-right: 8px; }
.side-head .brand { flex: 1; min-width: 0; }
.side-x { width: 32px; height: 32px; flex: none; border: 0; border-radius: var(--r); background: none; color: var(--side-muted); cursor: pointer; display: grid; place-items: center; }
.side-x:hover { background: var(--side-hover); color: var(--side-strong); }
.side-x svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; }
/* Բաժինների ցանկ՝ 8 կետ, ընտրվածը՝ բաց ֆոնով և ոսկեգույն ձախ գծով */
.snav { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px 16px; }
.snav button { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 8px 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--side-ink); text-align: left; cursor: pointer; font-size: 13px; line-height: 1.3; }
.snav button:hover { background: rgba(255, 255, 255, .06); color: var(--side-strong); }
.snav button.on { background: var(--side-active); color: #FFFFFF; font-weight: 600; }
.snav button.on::before { content: ''; position: absolute; left: -4px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--gold); }
.snav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; }
.snav .lbl { min-width: 0; flex: 1 1 auto; }
.snav .cnt { margin-left: auto; font-size: 11px; font-weight: 600; line-height: 1; padding: 4px 7px; border-radius: var(--r-pill); background: var(--side-badge); color: var(--side-ink); white-space: nowrap; flex: none; }
.snav button.on .cnt { background: color-mix(in srgb, var(--gold) 35%, var(--side-active)); color: #FFFFFF; }
.snav .dot { width: 7px; height: 7px; flex: none; margin-left: auto; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent); }
.side-scrim { display: none; }
.side-foot { margin-top: auto; padding: 12px; display: grid; gap: 6px; }
.ucard { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-lg); background: var(--side-card); color: var(--side-strong); }
.ucard:hover { background: color-mix(in srgb, var(--side-card) 85%, #FFFFFF); }
.ucard:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.uav { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--side-on); color: var(--navy); font-size: 13px; font-weight: 700; box-shadow: 0 0 0 2px var(--side-card), 0 0 0 3px var(--side-on-badge); }
.uinfo { min-width: 0; display: grid; }
.uinfo b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uinfo span { font-size: 12px; color: var(--side-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ucard svg { margin-left: auto; width: 16px; height: 16px; flex: none; stroke: var(--side-muted); fill: none; stroke-width: 1.8; }
.ucard select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; color-scheme: dark; }
.side-foot .reset { justify-self: start; border: 0; background: none; padding: 4px 6px; font-size: 12px; color: var(--side-muted); cursor: pointer; border-radius: var(--r-sm); }
.side-foot .reset:hover { color: var(--side-strong); background: var(--side-hover); }

.main { min-width: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--frame); border-radius: var(--r-lg); min-height: calc(100vh - 16px); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: stretch; gap: 10px; min-height: 52px;
  padding: 0 14px 0 8px; background: var(--surface); border-bottom: 1px solid var(--frame); border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.top > .menu-btn, .top > .syncpill, .top > .orgl { align-self: center; }
/* Աշխատանքային դաշտի ներդիրներ */
.wtabs { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 2px; padding-top: 9px; margin-bottom: -1px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; box-shadow: inset 0 -1px 0 var(--frame); position: relative; z-index: 1; }
.wtabs::-webkit-scrollbar { display: none; }
.wtab { flex: 0 1 auto; min-width: 92px; display: flex; align-items: center; gap: 7px; max-width: 240px; height: 38px; padding: 0 6px 0 14px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--r) var(--r) 0 0; color: var(--muted); cursor: pointer; font-size: 13px; user-select: none; }
.wtab:hover { color: var(--ink); background: color-mix(in srgb, var(--surface-3) 60%, transparent); }
.wtab.on { color: var(--title); font-weight: 600; background: var(--surface); border-color: var(--frame); border-bottom: 1px solid var(--surface); height: 39px; }
.wt-i { display: grid; place-items: center; flex: none; color: color-mix(in srgb, var(--muted) 70%, transparent); }
.wt-i svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.wtab.on .wt-i { color: var(--gold); }
.wtab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.wt-t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt-x { width: 22px; height: 22px; flex: none; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.wt-x:hover { background: var(--surface-3); color: var(--ink); }
.wt-x svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.orgl { font-size: 12.5px; color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .crumbs { min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .crumbs b { color: var(--ink); font-weight: 600; }
.top .grow { flex: 1; }
.syncpill { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 5px 12px; background: var(--surface); box-shadow: var(--shadow-sm); cursor: pointer; }
.syncpill:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.syncpill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.syncpill.pending i { background: var(--warn); }
.syncpill.error i { background: var(--bad); }

.page { padding-block: 22px 60px; padding-inline: var(--page-x); display: flex; flex-direction: column; gap: var(--gap-page); max-width: var(--page-max); width: 100%; }
/* ---------- Քարտեր (Փաստաթղթեր, Հաշվետվություններ)՝ պատվիրատուի օրինակի չափերով ---------- */
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 15px; }
.gcard {
  display: flex; flex-direction: column; align-items: flex-start; min-width: 0; min-height: 146px; padding: 20px 20px 22px; text-align: left;
  background: var(--surface); border: 1px solid var(--frame); border-radius: var(--r-card); color: var(--title); cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.gcard:hover { border-color: var(--gold); box-shadow: 0 6px 18px rgba(16, 27, 52, .07); }
.gcard:focus-visible { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 28%, transparent); }
.gcard[disabled] { cursor: not-allowed; opacity: .55; box-shadow: none; border-color: var(--frame); }
.gcard .gi { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: var(--r); background: var(--tile); color: var(--gold); margin-bottom: 20px; }
.gcard .gi svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.gcard .gi.code { width: auto; min-width: 38px; padding: 0 7px; font-family: var(--font-code); font-size: 12px; font-weight: 600; letter-spacing: -.01em; }
.gcard .gt { max-width: 100%; font-size: 14.5px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.gcard .gc { max-width: 100%; margin-top: 12px; font-size: 13px; line-height: 1.4; color: var(--muted); overflow-wrap: anywhere; }
.gcard.tcard .gt { font-size: 14px; -webkit-line-clamp: 3; }
.gcard.tcard .gc { margin-top: auto; padding-top: 12px; font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* Բաժնի ենթաէջեր */
.secnav { display: flex; gap: 6px; flex-wrap: wrap; }
.secnav button { height: 32px; padding: 0 14px; border: 1px solid var(--frame); border-radius: var(--r-pill); background: var(--surface); color: var(--ink-2); font-size: 13px; cursor: pointer; }
.secnav button:hover { border-color: var(--gold); color: var(--title); }
.secnav button.on { background: var(--tile); border-color: var(--tile); color: #FFFFFF; font-weight: 600; cursor: default; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .t { min-width: 0; flex: 1 1 320px; }
.page-head h1 { margin: 0; font-weight: 700; font-size: 22px; line-height: 1.25; letter-spacing: -.015em; text-wrap: balance; }
.page-head .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
/* «Լողացող» վերնագիր (app.js՝ stickySetup). Հետ, Պահպանել, Ջնջել, Հաստատել…՝ միշտ տեսանելի, ոլորելիս՝ սեղմ տեսքով */
/* Ոլորման «խարիսխը» (scroll anchoring) անջատված է. վերնագիրը սեղմվելիս Chrome-ը էջը ետ էր տանում վերև, և վերնագիրը թրթռում էր (ոլորել չէր լինում) */
html { overflow-anchor: none; }
.sticky-sent { flex: none; margin-bottom: -18px; }
.sticky-head { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 52px)); z-index: 15; background: var(--surface); margin: -8px calc(-1 * var(--page-x)); padding: 8px var(--page-x); }
.page-head > .page-back { flex: 1 0 100%; margin-bottom: 2px; }
.emphead > .page-back { grid-column: 1 / -1; margin-bottom: 2px; }
.sticky-head.stuck { box-shadow: 0 1px 0 var(--frame), 0 12px 18px -18px rgba(16, 27, 52, .5); }
.page-head.stuck { flex-wrap: nowrap; align-items: center; gap: 12px; }
.emphead.stuck { grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; }
.sticky-head.stuck > .page-back { flex: none; grid-column: auto; margin: 0; }
.page-head.stuck .t { flex: 1 1 auto; }
.sticky-head.stuck h1 { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sticky-head.stuck .sub, .sticky-head.stuck .meta, .sticky-head.stuck .avatar, .sticky-head.stuck .asof { display: none; }
.sticky-head.stuck .actions { flex-wrap: nowrap; }
@media (max-width: 640px) {
  .sticky-head.stuck h1 { display: none; }
  .sticky-head.stuck > .page-back .btn { font-size: 0; gap: 0; padding: 0 8px; }
  .sticky-head.stuck .actions { overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; justify-content: flex-start; }
  .sticky-head.stuck .actions > :first-child { margin-left: auto; }
  .sticky-head.stuck .actions::-webkit-scrollbar { display: none; }
  .sticky-head.stuck .actions .btn { flex: none; height: 32px; padding: 0 10px; font-size: 12.5px; }
}
.actions { display: flex; gap: var(--gap-actions); flex-wrap: wrap; align-items: center; }
h2.sec { margin: 0; font-size: 15px; font-weight: 600; }
h3.sec { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--control-h); padding: 0 14px; font-weight: 500;
  border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: none; background: color-mix(in srgb, var(--accent) 86%, #FFFFFF); border-color: color-mix(in srgb, var(--accent) 86%, #FFFFFF); }
.btn.stamp { background: var(--stamp); border-color: var(--stamp); color: var(--stamp-ink); font-weight: 600; }
.btn.stamp:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); }
.btn.danger { color: var(--bad); }
.btn.sm { height: var(--control-h-sm); padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
/* Հղում-կոճակ (<a class="btn">, օր.՝ ֆայլի հղում)՝ առանց ընդգծման */ a.btn { text-decoration: none; }

input[type=text], input[type=password], input[type=date], input[type=number], input[type=email], input[type=tel], input[type=search], input[type=month], select, textarea {
  width: 100%; height: var(--control-h); padding: 0 10px; border: 1px solid var(--field-line); border-radius: var(--r); background: var(--field-bg); color: var(--ink);
  box-shadow: inset 0 1px 2px rgba(15, 23, 42, .05);
}
input:hover, select:hover, textarea:hover { border-color: var(--field-hover); }
textarea { height: auto; min-height: 72px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
input[readonly], select[disabled], input[disabled], textarea[readonly] { background: var(--field-ro); border-color: var(--field-ro-line); color: var(--ink-2); box-shadow: none; }
input.code { letter-spacing: .02em; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.field > label .lhint { font-size: 11.5px; font-weight: 400; color: var(--muted); }
.field > label.check { flex-wrap: nowrap; font-size: 13.5px; font-weight: 400; color: var(--ink); }
.field > label .req { color: var(--bad); }
.field > label .xml { margin-left: auto; font-family: var(--font-code); font-size: 10.5px; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }
.field .err { font-size: 12px; color: var(--bad); }
.field.bad input, .field.bad select { border-color: var(--bad); }
.field.warn input, .field.warn select { border-color: var(--warn); background: var(--warn-soft); }
.check { display: flex; gap: 8px; align-items: center; min-height: var(--control-h); cursor: pointer; }
.check input { width: 16px; height: 16px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--gap-form-y) var(--gap-cols); }
.form .w2 { grid-column: span 2; }
.form .wall { grid-column: 1 / -1; }
.row { display: flex; gap: var(--gap-actions); align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }
.inline-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.multi { display: flex; gap: 6px; flex-wrap: wrap; }
.multi label { border: 1px solid var(--field-line); border-radius: var(--r-pill); padding: 4px 11px; cursor: pointer; font-size: 12.5px; user-select: none; background: var(--surface); }
.multi label.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-fg); }
.multi input { display: none; }
/* ---------- Panels ---------- */
.panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.panel > .ph { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.panel > .ph .grow { flex: 1; }
.panel > .pb { padding: var(--gap-cols); display: flex; flex-direction: column; gap: var(--gap-panel); }
.panel > .pb.flush { padding: 0; }
.panel > .pb.flush > .tw:last-child, .panel > .pb.flush > .t:last-child { border-radius: 0 0 var(--r-lg) var(--r-lg); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--gap-cols); align-items: start; }
.cols > * { min-width: 0; }
.kv { display: grid; grid-template-columns: minmax(140px, 38%) 1fr; gap: 6px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
/* ---------- Tables ---------- */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: var(--cell-y) var(--cell-x); border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
.t td { padding: var(--cell-y) var(--cell-x); border-bottom: 1px solid var(--line-2); vertical-align: top; }
.t tbody tr:last-child td { border-bottom: 0; }
.t tbody tr:hover td { background: var(--surface-2); }
.t tr.click { cursor: pointer; }
.t tr.dim td { color: var(--muted); }
.t td.num, .t th.num { text-align: right; }
.t .sub { display: block; font-size: 12px; color: var(--muted); }
.t tfoot td { font-weight: 600; border-top: 1px solid var(--line); border-bottom: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
/* ---------- Chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; line-height: 1; padding: 4px 10px; border-radius: var(--r-pill); background: var(--chip); color: var(--chip-ink); border: 1px solid transparent; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.chip.lbl::before { display: none; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.stamp { background: var(--stamp-soft); color: var(--stamp-fg); }
.chip.acc { background: var(--accent-soft); color: var(--accent-fg); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.draft { background: transparent; border: 1px dashed color-mix(in srgb, var(--muted) 55%, transparent); color: var(--muted); }
.t td .chip { white-space: normal; line-height: 1.25; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.tag { font-family: var(--font-code); font-size: 11px; padding: 2px 6px; border-radius: var(--r-sm); background: var(--surface-3); color: var(--ink-2); }
/* ---------- Tabs, steps ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 0 2px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 9px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--accent-fg); border-bottom-color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; gap: 2px; max-width: 100%; padding: 3px; border-radius: var(--r-card); background: var(--surface-3); overflow-x: auto; scrollbar-width: none; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: var(--r); cursor: pointer; color: var(--muted); white-space: nowrap; font-weight: 500; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--seg-on); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sm); }
.steps { display: flex; gap: 0; counter-reset: s; overflow-x: auto; }
.steps .s { flex: 1 1 0; min-width: 120px; padding: 10px 12px; border-bottom: 2px solid var(--line); color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.steps .s b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; border: 1px solid var(--line); flex: none; }
.steps .s.on { color: var(--ink); border-bottom-color: var(--accent); }
.steps .s.on b { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps .s.done b { background: var(--accent-soft); color: var(--accent-fg); border-color: transparent; }
/* ---------- Notices ---------- */
.note { display: flex; gap: 10px; align-items: flex-start; padding: var(--cell-y) var(--cell-x); border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line-2); font-size: 13px; }
.note svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; margin-top: 1px; }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.note.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.note.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.note.stamp { background: var(--stamp-soft); border-color: transparent; color: var(--stamp-fg); }
.note.info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.note > div { min-width: 0; }
/* ---------- Timeline ---------- */
.tl { display: flex; flex-direction: column; }
.tl .it { display: grid; grid-template-columns: 96px 18px minmax(0, 1fr); gap: 10px; }
.tl .d { font-family: var(--font-code); font-size: 12px; color: var(--muted); padding-top: 2px; text-align: right; }
.tl .ln { position: relative; }
.tl .ln::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 1px; background: var(--line); }
.tl .ln::after { content: ""; position: absolute; left: 4px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl .it.imp .ln::after { border-color: var(--muted); }
.tl .bx { padding-bottom: 14px; min-width: 0; }
.tl .bx b { font-weight: 600; }
/* ---------- Document sheet ---------- */
.sheetwrap { background: var(--surface-3); border-radius: var(--r-lg); padding: 20px; overflow-x: auto; }
.sheet { background: var(--paper); color: var(--paper-ink); max-width: 760px; margin: 0 auto; padding: 48px 56px; box-shadow: var(--shadow); font-family: var(--font-doc); font-size: 14.5px; line-height: 1.6; }
.sheet h4 { text-align: center; margin: 0 0 4px; font-size: 16px; letter-spacing: .02em; }
.sheet .cap { text-align: center; margin: 0 0 18px; font-size: 13.5px; }
.sheet .hdr { display: flex; justify-content: space-between; gap: 12px; margin: 18px 0; font-size: 13.5px; }
.sheet .tagv { background: var(--accent-soft); color: var(--accent-fg); border-radius: 4px; padding: 0 4px; font-family: var(--font-ui); font-size: 13px; }
.sheet .placeholder .code { overflow-wrap: anywhere; }
.sheet .placeholder { border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 14px; font-family: var(--font-ui); font-size: 13px; color: var(--muted); margin: 14px 0; }
.sheet .sign { display: flex; justify-content: space-between; gap: 24px; margin-top: 36px; font-size: 13.5px; }
/* Ձևանմուշով գծված փաստաթուղթ */
.sheet.doc { font-size: 13.5px; line-height: 1.55; padding: 44px 52px; }
.sheet.doc .d-title { text-align: center; font-weight: 700; margin: 1px 0; letter-spacing: .01em; }
.sheet.doc .d-right { margin: 0 0 4px auto; width: fit-content; max-width: 62%; display: grid; gap: 1px; }
.sheet.doc .d-row { display: flex; justify-content: space-between; gap: 16px; }
.sheet.doc .d-p { margin: 0 0 3px; text-align: justify; hyphens: manual; }
.sheet.doc .d-sub { padding-left: 1.4em; }
.sheet.doc .d-sub2 { padding-left: 2.8em; }
.sheet.doc .d-subt { text-align: center; margin: 0 0 1px; }
.sheet.doc .d-sign { text-align: left; }
.sheet.doc .d-gap { height: .85em; }
.sheet.doc .d-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; margin: 2px 0 6px; font-size: 13px; line-height: 1.5; }
.sheet.doc .d-col { min-width: 0; overflow-wrap: anywhere; }
.sheet.doc .d-colh { font-weight: 700; }
.sheet.doc .tv { background: color-mix(in srgb, var(--accent-soft) 75%, transparent); border-radius: 3px; padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.sheet.doc.plain .tv { background: none; padding: 0; }
.sheet.doc .tm { background: var(--bad-soft, #FDECEC); color: var(--bad); border: 1px dashed currentColor; border-radius: 3px; padding: 0 3px; font-family: var(--font-ui); font-size: .82em; white-space: nowrap; }
/* Կարճ փաստաթղթեր (հրաման, դիմում, ծանուցում, որոշում, ակտ)՝ A4 էջ (210 մմ = 794 px), դաշտեր՝ 1,5 սմ, ձախից 2 սմ, տառաչափ 12։
   Տարածությունները (d-gap) ձգվում են, որ փաստաթուղթը բաշխվի էջի վրա վերևից ներքև։ PDF-ը կառուցվում է նույն չափերով (drive.js՝ չափում է) */
.sheet.doc.letter { width: var(--sheet-w); max-width: 100%; min-height: 1123px; box-sizing: border-box; padding: 57px 57px 57px 76px; font-size: 16px; line-height: 1.564; }
.sheet.doc.letter .d-flow { display: flex; flex-direction: column; min-height: 868px; }
.sheet.doc.letter .d-flow > * { flex: none; }
.sheet.doc.letter .d-p { margin: 0 0 8px; text-indent: 47px; }
.sheet.doc.letter .d-p.d-nind, .sheet.doc.letter .d-p.d-quote { text-indent: 0; }
.sheet.doc.letter .d-sub, .sheet.doc.letter .d-sub2 { padding-left: 0; }
.sheet.doc.letter .d-flow > .d-gap { flex: 1 1 0; min-height: 14px; max-height: 46px; height: auto; }
.sheet.doc.letter .d-flow > .d-gap.g2 { flex-grow: 2; max-height: 76px; }
.sheet.doc.letter .d-flow > .d-gap.g3 { flex-grow: 3; max-height: 110px; }
.sheet.doc.letter .d-title { margin: 0; letter-spacing: 0; }
.sheet.doc.letter .d-org { font-size: 17.33px; padding-bottom: 10px; border-bottom: 1px solid currentColor; }
.sheet.doc.letter .d-main { font-size: 18.67px; margin-bottom: 4px; }
.sheet.doc.letter .d-main.d-long { font-size: 16px; }
.sheet.doc.letter .d-orgname { font-size: 17.33px; }
.sheet.doc.letter .d-subj { margin-bottom: 2px; }
.sheet.doc.letter .d-subt { margin: 0 0 2px; }
.sheet.doc.letter .d-right { margin: 0 0 0 auto; width: fit-content; min-width: 45%; max-width: 58%; line-height: 1.5; gap: 1px; }
.sheet.doc.letter .d-row { gap: 24px; }
.sheet.doc.letter .d-signs { display: grid; grid-template-columns: fit-content(42%) 130px minmax(0, 1fr); column-gap: 14px; align-items: end; }
.sheet.doc.letter .d-signs > * { padding-top: 30px; min-width: 0; }
.sheet.doc.letter .d-signs > .r0 { padding-top: 0; }
.sheet.doc.letter .d-signs > .e, .sheet.doc.letter .d-signs > .s-d { padding-top: 4px; }
.sheet.doc.letter .s-ln:not(.e) { border-bottom: 1px solid currentColor; height: 1.1em; box-sizing: content-box; }
.sheet.doc.letter .d-cols, .sheet.doc.letter .d-tblw { margin: 0; }
.sheet.doc.letter .d-cols { font-size: 14.67px; line-height: 1.5; }
.sheet.doc.letter .d-tbl { font-size: 12px; line-height: 1.5; }
.sheet.doc.letter .d-tbl th, .sheet.doc.letter .d-tbl td { padding: 2.67px 4px; }
.stampmark { display: inline-block; border: 2px solid var(--stamp-fg); color: var(--stamp-fg); border-radius: var(--r-sm); padding: 2px 8px; font-family: var(--font-code); font-size: 12px; transform: rotate(-3deg); }
/* ---------- Combo (search select) ---------- */
.combo { position: relative; }
.combo .list { position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 4px); max-height: 260px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.combo .opt { padding: 7px 10px; cursor: pointer; display: flex; gap: 10px; font-size: 13px; }
.combo .opt .code { color: var(--muted); font-size: 12px; min-width: 64px; }
.combo .opt.hi, .combo .opt:hover { background: var(--accent-soft); }
/* ---------- Modal & toast ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 80; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r-modal); box-shadow: var(--shadow); width: min(var(--modal-w), 100%); max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; }
.modal.wide { width: min(880px, 100%); }
.modal .mh { padding: 18px 20px 6px; font-weight: 700; font-size: 16px; }
.modal .mb { padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.modal .mf { padding: 12px 20px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
/* երկար պատուհանում «Պահպանել»-ը և «Չեղարկել»-ը՝ միշտ տեսանելի (ներքևում) */
.modal .mf { position: sticky; bottom: 0; z-index: 2; background: var(--surface); border-radius: 0 0 var(--r-modal) var(--r-modal); }
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: var(--r-card); box-shadow: var(--shadow); font-size: 13px; max-width: 360px; cursor: pointer; overflow-wrap: anywhere; }
/* ---------- Misc ---------- */
.stats { display: flex; gap: 24px; flex-wrap: wrap; }

.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ac,var(--muted)) 18%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ac,var(--muted));font-size:11px;font-weight:700;border:2px solid var(--panel);flex:none;letter-spacing:.3px}
.people .av+.av{margin-left:-8px}
.av.lg{width:38px;height:38px;font-size:13px}
.av.sm{width:22px;height:22px;font-size:9.5px;border-width:1.5px}
.due{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--ink-2);white-space:nowrap}
.due.late{color:var(--red)}
.due.today{color:var(--orange)}
.cm{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12.5px;position:relative}
.cm.unread{color:var(--brand);font-weight:700}
.cm.unread::after{content:'';position:absolute;top:-2px;left:12px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--panel)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:6px}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--surface-3);border-radius:var(--r);padding:10px;min-height:200px}
.khead{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:4px 4px 10px}
.khead .n{margin-left:auto;background:var(--panel);border-radius:20px;padding:0 8px;font-size:12px;color:var(--muted)}
.kcard{background:var(--panel);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.06);border-left:4px solid var(--pc);cursor:pointer;transition:.12s}
.kcard:hover{box-shadow:0 4px 14px rgba(15,23,42,.1)}
.kcard .co{font-weight:700;font-size:13.5px}
.kcard .rn{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.kcard .ft{display:flex;align-items:center;gap:8px;margin-top:10px}
.kcard .ft .btn{margin-left:auto}
.kcard[draggable=true]{cursor:grab}.kcard.kdrag{opacity:.45}
.kcol.kover{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}.kcol.kno{outline:2px dashed var(--bad);outline-offset:-3px}

/* ---------- matrix ---------- */
.mwrap{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);overflow:auto;max-height:calc(100vh - 220px)}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.mx th,table.mx td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
table.mx thead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-weight:600;color:var(--ink-2);min-width:150px}
table.mx tbody th{position:sticky;left:0;background:var(--panel);z-index:1;font-weight:600;min-width:200px}
table.mx thead th:first-child{left:0;z-index:3}
.mcell{display:flex;flex-direction:column;gap:4px}
.mchip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 8px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--ink);font-weight:600;cursor:pointer;border:0;text-align:left;font-size:12px}
.mchip small{font-weight:500;opacity:.8}
.mdone{color:var(--green);font-weight:700}
.mna{color:var(--muted)}
.mpend{color:var(--muted2)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tbl th{background:var(--panel2);font-size:12px;color:var(--muted);text-align:left;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tag.r1{background:var(--info-soft);color:var(--info)}.tag.r2{background:var(--warn-soft);color:var(--warn)}.tag.r3{background:var(--ok-soft);color:var(--ok)}.tag.r4{background:var(--stamp-soft);color:var(--stamp-fg)}
.muted{color:var(--muted)}

/* ---------- team ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);padding:16px}
.card h3{margin:0;font-size:15px}
.kv{display:flex;gap:16px;margin:12px 0}
.kv div{font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:18px;color:var(--text)}
.dev{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 0;border-top:1px dashed var(--line)}
.dev span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(580px,100vw);background:var(--panel);z-index:41;box-shadow:var(--shadow2);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible}
.drawer:not(.on){visibility:hidden;transition:transform .25s,visibility 0s .25s}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dh .ttl{flex:1;min-width:0}
.dh .ttl .sub{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dh h2{margin:0;font-size:18px;line-height:1.3}
.dh input.inp{font-size:17px;font-weight:700;padding:6px 8px;margin-left:-9px;border-color:transparent}
.dh input.inp:hover{border-color:var(--line)}
.db{flex:1;overflow:auto;padding:18px 20px}
.sec{margin-bottom:22px}
.sec h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px;font-size:12.5px;font-weight:500;text-align:left;display:flex;gap:7px;align-items:center;line-height:1.2;min-height:40px}
.sbtn::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.sbtn:hover{border-color:var(--c)}
.sbtn.on{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-color:var(--c);font-weight:700}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:flex;gap:4px}
.step{flex:1;border:0;background:var(--surface-2);padding:10px 6px 8px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;position:relative;line-height:1.2}
.step .num{display:block;width:22px;height:22px;border-radius:50%;background:var(--surface-3);margin:0 auto 5px;line-height:22px;color:var(--ink-2)}
.step.done{background:var(--ok-soft);color:var(--ok)}.step.done .num{background:var(--green);color:#fff}
.step.cur{background:var(--brandSoft);color:var(--brand2)}.step.cur .num{background:var(--brand);color:#fff}
.step:disabled{cursor:not-allowed;opacity:.6}
.dfields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dfields .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 3px;border-radius:20px;background:var(--surface-2);font-size:12.5px;font-weight:500}
.chip button{border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
.chip button:hover{color:var(--red)}
.chips select.inp{width:auto;padding:5px 8px;font-size:12.5px;border-style:dashed}
.comments{display:flex;flex-direction:column;gap:12px}
.cmt{display:flex;gap:10px;max-width:92%}
.cmt.mine{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--surface-2);border-radius:14px;padding:9px 12px;min-width:0}
.cmt.mine .bub{background:var(--brandSoft)}
.bub .h{font-size:12px;color:var(--muted);margin-bottom:2px}
.bub .h b{color:var(--text)}
.bub .t{white-space:pre-wrap;word-wrap:break-word}
.bub .rd{font-size:11px;color:var(--muted2);margin-top:4px}
.newc{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.newc textarea{min-height:44px;max-height:180px}
.hist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.hist div b{color:var(--ink-2)}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}

/* ---------- modal ---------- */
.modal-bg:not(.on){display:none}
.modal-bg{place-items:start center;padding:4vh 16px;overflow:hidden}
@media (min-width:861px){body.dockon .modal-bg{right:var(--dkw,440px)}}
.mminb{font-size:14px;font-weight:700}
.mmbar{position:fixed;left:300px;bottom:10px;z-index:61;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 320px)}
.mmchip{display:flex;align-items:center;background:var(--accent-fg);color:#fff;border-radius:10px;box-shadow:0 6px 18px rgba(15,23,42,.25);overflow:hidden}
.mmchip button{background:none;border:0;color:inherit;cursor:pointer;font:inherit;font-size:13px;padding:8px 10px}.mmchip button:first-child{font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mmchip button:hover{background:var(--accent)}
@media (max-width:860px){.mmbar{left:10px;bottom:70px;max-width:calc(100vw - 20px)}}
.mbox{width:100%;max-width:var(--modal-w);overflow:hidden;animation:pop .18s ease;display:flex;flex-direction:column;max-height:calc(96vh - 58px)}
.mbox>.mh,.mbox>.mf{flex:none}.mbox>.mb{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
.mbox.wide{max-width:880px}
@keyframes spin{to{transform:rotate(360deg)}}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.mh h3{margin:0;font-size:16px;flex:1}
.prio{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prio label{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;line-height:1.2;display:flex;align-items:center;justify-content:center;min-height:44px}
.prio input{display:none}
.prio input:checked+span{color:var(--ink);font-weight:700}
.prio label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,var(--surface))}
.tpick{display:flex;flex-wrap:wrap;gap:6px}
.tpick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 4px;cursor:pointer;font-size:12.5px}
.tpick input{display:none}
.tpick label:has(input:checked){border-color:var(--brand);background:var(--brandSoft);font-weight:600}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches label{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.swatches input{display:none}
.swatches label:has(input:checked){border-color:var(--text)}
.rlist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
.ritem{display:grid;grid-template-columns:1fr 190px;gap:8px;align-items:center;padding:4px 6px;border-radius:8px}
.ritem.on{background:var(--brandSoft)}
.ritem .chk{color:var(--text)}
.ritem select.inp{padding:5px 8px;font-size:12.5px}
.ritem:not(.on) select{opacity:.4}
.ms-btn{display:inline-flex;align-items:center;gap:8px;max-width:270px;min-width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13.5px;text-align:left;color:var(--text)}
.ms-btn:hover{border-color:var(--line)}
.ms-btn.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand2);font-weight:600}
.ms-btn.open{box-shadow:0 0 0 3px var(--brandSoft);border-color:var(--brand)}
.ms-btn .ms-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn .ms-n{background:var(--brand);color:#fff;border-radius:20px;font-size:11px;padding:0 7px;line-height:18px}
.ms-btn .ms-ch{width:16px;height:16px;color:var(--muted);transition:transform .15s}
.ms-btn.open .ms-ch{transform:rotate(180deg)}
.mspop{position:fixed;z-index:95;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow2);display:none;flex-direction:column;max-height:min(420px,70vh)}
.mspop.on{display:flex}
.ms-search{position:relative;padding:10px 10px 6px}
.ms-search svg{position:absolute;left:21px;top:50%;transform:translateY(-35%);color:var(--muted2);width:16px;height:16px}
.ms-search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:8px;outline:none}
.ms-search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
.ms-acts{display:flex;justify-content:space-between;padding:0 12px 6px}
.ms-acts button{border:0;background:none;color:var(--brand);font-size:12.5px;font-weight:600;padding:2px 0}
.ms-list{overflow:auto;padding:0 6px 8px;border-top:1px solid var(--line2)}
.ms-it{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
.ms-it:hover{background:var(--surface-2)}
.ms-it input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.ms-it .ms-t{display:block;line-height:1.25}
.ms-it small{display:block;color:var(--muted2);font-size:11.5px}
.ms-it.dim{opacity:.55}
.dirty{border-color:var(--warn)!important;box-shadow:0 0 0 3px #fef3c7!important}
.sbtn.dirty,.step.dirty{box-shadow:0 0 0 2px #f59e0b!important}
.unsaved{font-size:12.5px;color:var(--warn);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.unsaved::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--warn)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px}
.file svg{width:15px;height:15px;color:var(--muted);flex:none}
.file a{font-weight:600;color:var(--text);text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file a:hover{color:var(--brand);text-decoration:underline}
.file small{color:var(--muted2);margin-left:auto;white-space:nowrap}
.file button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 4px;cursor:pointer}
.file button:hover{color:var(--red)}
.rq{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
.rq.new{border-left:4px solid var(--brand)}
.rq .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.rq .rh b{color:var(--text);font-size:13.5px}
.rq .rt{font-weight:700;font-size:15px;margin:6px 0 2px}
.rq .rd{white-space:pre-wrap;color:var(--ink-2);font-size:13.5px}
.rq .ra{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.rq .note{font-size:13px;background:var(--surface-2);border-left:3px solid var(--brand);padding:6px 10px;border-radius:0 8px 8px 0;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:4px 0 16px}
.kpi{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted2);margin-top:2px}
.sgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.scard{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.scard h3{margin:0 0 4px;font-size:15px}
.scard .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.hl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.hl .scard{display:flex;gap:12px;align-items:center}
.hl .big{font-size:26px}
.hl b{display:block;font-size:14px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap .col{cursor:pointer}
.chartwrap .col:hover .hit{fill:rgba(15,23,42,.04)}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;opacity:0;transition:opacity .1s;z-index:5}
.ctip.on{opacity:1}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-top:1px solid var(--line2)}
.hbar:first-of-type{border-top:0}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:14px;display:flex;gap:2px}
.hbar .seg{height:100%;min-width:2px}
.hbar .seg:first-child{border-radius:0}
.hbar .seg:last-child{border-radius:0 4px 4px 0}
.hbar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hbar .num small{color:var(--muted2)}
table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st th[data-act]{cursor:pointer}
table.st th[data-act]:hover,table.st th.on{color:var(--brand)}
table.st td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.st tr:last-child td{border-bottom:0}
table.st .pct{display:inline-flex;align-items:center;gap:8px}
table.st .mini{width:60px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:inline-block}
table.st .mini span{display:block;height:100%;background:var(--ok)}
.stwrap{overflow-x:auto}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.sgrid2,.hl{grid-template-columns:1fr}}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 80px}}
.preview{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink-2)}

/* ---------- notif panel ---------- */
.npanel{position:fixed;top:64px;right:28px;width:min(400px,calc(100vw - 32px));max-height:70vh;background:var(--panel);border-radius:14px;box-shadow:var(--shadow2);z-index:50;display:none;flex-direction:column;border:1px solid var(--line)}
.npanel.on{display:flex}
.npanel .nh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.npanel .nh button{margin-left:auto}
.nlist{overflow:auto}
.nitem{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13px}
.nitem:hover{background:var(--surface-2)}
.nitem.unread{background:var(--surface-2)}
.nitem.unread .t{font-weight:600}
.nitem .tm{font-size:11.5px;color:var(--muted2);margin-top:2px}

/* ---------- toasts ---------- */
.toasts{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast.err{background:var(--ink)}
.toast.ok{background:var(--ink)}
.toast.nt{background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--brand)}

textarea.inp { min-height: 72px; line-height: 1.5; }
label.f { display: block; font-size: 12.5px; font-weight: 500; color: var(--ink-2); margin: 0 0 4px; }
.fgrid { gap: var(--gap-form-y) var(--gap-cols); }
/* աղյուսակ՝ վահանակի մեջ */
table.t.tbl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); border-collapse: separate; border-spacing: 0; overflow: hidden; }
table.t.tbl th { position: static; }
table.t.tbl td { vertical-align: middle; }
/* կմախքը չպետք է սահմանափակվի էկրանի բարձրությամբ (#app-ին տրված height:100%-ը կոտրում էր կպչուն ուղղորդիչն ու ներդիրները) */
#app.app { height: auto; }
/* աղյուսակի գլուխը ոլորելիս մնում է էջի վերնագրի տակ (երբ աղյուսակը տեղավորվում է լայնությամբ) */
.tblwrap.fit { overflow: visible; }
.tblwrap.fit > table.t.tbl { overflow: visible; }
.tblwrap.fit > table.t.tbl thead th { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 52px) + var(--head-h, 0px) - 1px); z-index: 6; box-shadow: 0 1px 0 var(--line); }
.tblwrap.fit > table.t.tbl thead th:first-child { border-top-left-radius: var(--r-lg); }
.tblwrap.fit > table.t.tbl thead th:last-child { border-top-right-radius: var(--r-lg); }
/* թեգերի գույներ (հաշվետվության տեսակ) */
.tag { margin: 1px 2px 1px 0; display: inline-block; }
.tag.r1 { background: var(--info-soft); color: var(--info); }
.tag.r2 { background: var(--warn-soft); color: var(--warn); }
.tag.r3 { background: var(--ok-soft); color: var(--ok); }
.tag.r4 { background: var(--stamp-soft); color: var(--stamp-fg); }
/* պատուհան */
.mbox > .mh { display: flex; align-items: center; gap: 8px; padding: 16px 20px 10px; }
.mbox > .mh h3 { margin: 0; font-size: 16px; font-weight: 700; flex: 1; }
.mbox > .mb { padding: 8px 20px 16px; display: block; }
.toast { display: flex; gap: 10px; align-items: flex-start; }
.toast.err { background: var(--bad); color: #FFFFFF; }
.toast.ok { background: var(--ok); color: #FFFFFF; }
.toast.nt { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--accent); }
/* վահանակներ */
.list, .card, .stat, .mwrap { box-shadow: var(--shadow-sm); border-color: var(--line); border-radius: var(--r-lg); }
.seg { vertical-align: middle; }
.empty .big { font-size: 28px; opacity: .55; }
@media (max-width: 640px) { .page-head .actions .search { width: 100%; order: -1; } .topact .tbar { display: none; } .page-head .actions { width: 100%; } }
@media (min-width: 641px) { .bnav { display: none !important; } }
@media (max-width: 860px) { .btn.refbtn .reft, .btn.refbtn .refat { display: none; } .btn.refbtn { padding: 0 10px; } }
</style>

    // պատուհանի չափը/բովանդակությունը փոխվելիս՝ ներքևում մնալ (եթե ներքևում էինք)
    try { new ResizeObserver(() => { if (S.atBottom || Date.now() < (S.pinUntil || 0)) list.scrollTop = list.scrollHeight; }).observe(list); } catch (e) {}
    list.addEventListener('scroll', () => { if (Date.now() < (S.pinUntil || 0)) { S.atBottom = true; const nb0 = root.querySelector('.nxc-new'); if (nb0) nb0.remove(); return; } S.atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 80; if (S.atBottom) { const nb = root.querySelector('.nxc-new'); if (nb) nb.remove(); } });

    /* ---------- մեդիա ---------- */
    function media(id) { return fetchMedia(id, call); }
    const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return; io.unobserve(e.target);
      media(e.target.dataset.fid).then(m => { e.target.src = m.url; }).catch(() => { e.target.alt = ''; });
    }), { root: list, rootMargin: '300px' }) : null;
    function viewer(f) {
      media(f.id).then(m => {
        const save = () => { const a = document.createElement('a'); a.href = m.url; a.download = m.name || f.name; document.body.appendChild(a); a.click(); a.remove(); };
        if (!/^(image|video|audio)[/]/.test(m.mime)) return save();
        const v = document.createElement('div'); v.className = 'nxc-view';
        v.innerHTML = (/^image/.test(m.mime) ? `<img src="${m.url}">` : /^video/.test(m.mime) ? `<video src="${m.url}" controls autoplay playsinline></video>` : `<div style="font-size:54px" class="nxc-big">${nxi('mic')}</div><audio src="${m.url}" controls autoplay></audio>`)
          + `<div class="nm">${esc(f.name)}</div><div class="vb"><button data-a="s" style="background:var(--surface, #fff)">${nxi('download')} ${_t('Պահպանել')}</button><button data-a="c" style="background:var(--muted, #334155);color:#fff">${nxi('x')} ${_t('Փակել')}</button></div>`;
        document.body.appendChild(v);
        v.onclick = e => { const a = e.target.dataset.a; if (a === 's') save(); if (a === 'c' || e.target === v) v.remove(); };
      }).catch(e => NxDlg.alert(e.message));
    }
    function fileHtml(f) {
      if (f.kind === 'image') return `<img class="nxc-img" data-fid="${esc(f.id)}" data-view="${esc(f.id)}" alt="">`;

      if (f.kind === 'video') return `<button class="nxc-vid" data-play="${esc(f.id)}"><span class="ic">${nxi('play')}</span><span>${esc(f.name)}</span><small>${size(f.size)}</small></button>`;
      return `<button class="nxc-doc" data-view="${esc(f.id)}"><span class="ic">${nxi('file')}</span><span>${esc(f.name)}</span><small>${size(f.size)}</small></button>`;
    }
    const allFiles = () => { const m = {}; S.msgs.forEach(x => x.files.forEach(f => { m[f.id] = f; })); return m; };

    /* ---------- հաղորդագրությունների ցուցակ (փոփոխվում են միայն փոխված տողերը) ---------- */
    function msgKey(m) { return JSON.stringify([m.text, m.edited, m.deleted, m.reactions, m.read, m.pending, m.files.length, S.q && m.text.toLowerCase().includes(S.q) ? S.q : '']); }
    function msgHtml(m) {
      if (m.side === 'sys') return `<div class="nxc-sys">${linkify((typeof window !== 'undefined' && window.NX_SYS) ? window.NX_SYS(m.text) : m.text)} <span style="opacity:.6;font-size:11px">${hm(m.at)}</span></div>`;
      const by = S.msgs.find(x => x.id === m.replyTo);
      const showAuthor = !m.mine && (o.side === 'team' || m.side === 'team');
      const rx = Object.entries(m.reactions || {});
      const me = o.meName || '';
      return `<div class="nxc-m ${m.mine ? 'nxc-me' : ''}" data-id="${esc(m.id)}">
        <div class="nxc-b">${showAuthor ? `<div class="nxc-a" style="${m.side === 'client' ? 'color:var(--ok, #0f766e)' : ''}">${esc(m.author)}${m.side === 'client' && o.side === 'team' ? ' · ' + _t('հաճախորդ') : ''}</div>` : ''}
          ${by ? `<div class="nxc-q" data-jump="${esc(by.id)}"><b>${esc(by.mine ? _t('Դուք') : by.author)}</b><span>${esc(by.deleted ? _t('ջնջված հաղորդագրություն') : (by.text || (by.files[0] ? kindIcon(by.files[0].kind) + ' ' + by.files[0].name : '')))}</span></div>` : ''}
          ${m.deleted ? '<div class="nxc-tx nxc-del">' + _t('Հաղորդագրությունը ջնջված է') + '</div>' : m.files.map(fileHtml).join('') + (m.text ? `<div class="nxc-tx">${linkify(m.text, S.q)}</div>` : '')}
          <div class="nxc-ft">${m.edited ? _t('խմբագրված') + ' · ' : ''}${hm(m.at)}${m.pending ? '<span class="nxc-ck" title="' + _t('Ուղարկվում է') + '">' + nxi('clock') + '</span>' : m.mine && !m.deleted ? `<span class="nxc-ck ${m.read ? 'r' : ''}" title="${m.read ? _t('Կարդացված է') : _t('Ուղարկված է')}">${m.read ? '<span class="nxc-rd">' + nxi('check') + nxi('check') + '</span>' : nxi('check')}</span>` : ''}</div>
          ${m.deleted || m.pending ? '' : `<button class="nxc-more" data-menu="${esc(m.id)}" title="${_t('Գործողություններ')}">⋯</button>`}
        </div>
        ${rx.length ? `<div class="nxc-rx">${rx.map(([e, w]) => `<button data-react="${esc(m.id)}" data-e="${e}" class="${w.includes(me) ? 'on' : ''}" title="${esc(w.join(', '))}">${e}${w.length > 1 ? ' ' + w.length : ''}</button>`).join('')}</div>` : ''}
      </div>`;
    }
    function drawList() {
      const items = [];
      let day = '';
      const q = S.q;
      const msgs = q ? S.msgs.filter(m => !m.deleted && (m.text.toLowerCase().includes(q) || m.files.some(f => f.name.toLowerCase().includes(q)))) : S.msgs;
      msgs.forEach(m => {
        const d = String(m.at).slice(0, 10);
        if (d !== day) { day = d; items.push({ id: 'd-' + d, key: d, html: `<div class="nxc-day">${dayLabel(d)}</div>` }); }
        items.push({ id: m.id, key: msgKey(m), html: msgHtml(m) });
      });
      if (!items.length) { list.innerHTML = `<div class="nxc-empty">${q ? _t('Ոչինչ չի գտնվել') : (o.emptyText || _t('Հաղորդագրություններ դեռ չկան։ Գրեք առաջինը'))}</div>`; return; }
      if (list.querySelector('.nxc-empty')) list.innerHTML = '';
      const have = {}; [...list.children].forEach(el => { if (el.dataset.k !== undefined) have[el.dataset.i] = el; });
      const keep = new Set();
      items.forEach((it, i) => {
        let el = have[it.id];
        if (!el || el.dataset.k !== it.key) {
          const t = document.createElement('div'); t.innerHTML = it.html.trim(); const n = t.firstElementChild;
          n.dataset.i = it.id; n.dataset.k = it.key;
          if (el) el.replaceWith(n); el = n;
          el.querySelectorAll('img[data-fid]').forEach(img => io ? io.observe(img) : media(img.dataset.fid).then(m => { img.src = m.url; }));
        }
        keep.add(el);
        if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);
      });
      [...list.children].forEach(el => { if (!keep.has(el)) el.remove(); });
    }
    function drawFiles() {
      const box = $r('files'), fs = Object.values(allFiles()).sort((a, b) => String(b.at).localeCompare(String(a.at)));
      const med = fs.filter(f => f.kind === 'image' || f.kind === 'video'), aud = fs.filter(f => f.kind === 'audio'), doc = fs.filter(f => f.kind === 'file');
      box.innerHTML = !fs.length ? '<div class="nxc-empty">' + _t('Ֆայլեր դեռ չկան') + '</div>' :
        (med.length ? `<div class="nxc-h">${_t('Նկարներ և տեսանյութեր')} (${med.length})</div><div class="nxc-grid">${med.map(f => `<button class="g" data-view="${esc(f.id)}">${f.kind === 'image' ? `<img data-fid="${esc(f.id)}" alt="">` : nxi('video')}<small>${size(f.size)}</small></button>`).join('')}</div>` : '')
        + (aud.length ? `<div class="nxc-h">${_t('Ձայնային')} (${aud.length})</div>${aud.map(f => `<div style="font-size:11.5px;color:var(--muted, #64748b);margin:6px 0 2px">${esc(f.at.slice(0, 16))} · ${esc(f.by)}</div>` + voiceHtml(f.id, size(f.size))).join('')}` : '')
        + (doc.length ? `<div class="nxc-h" style="margin-top:12px">${_t('Փաստաթղթեր')} (${doc.length})</div>${doc.map(f => `<button class="nxc-doc" data-view="${esc(f.id)}" style="max-width:none;margin-bottom:6px"><span class="ic">${nxi('file')}</span><span>${esc(f.name)}</span><small>${size(f.size)} · ${esc(f.at.slice(0, 10))}</small></button>`).join('')}` : '');
      box.querySelectorAll('img[data-fid]').forEach(img => media(img.dataset.fid).then(m => { img.src = m.url; }).catch(() => {}));
    }
    function drawTop() {
      const i = S.info;
      $r('ttl').innerHTML = o.topText ? o.topText(i) : '';
      $r('fbtn').classList.toggle('on', S.tab === 'files');
      $r('sbtn').classList.toggle('on', S.search);
      $r('q').style.display = S.search ? '' : 'none';
      $r('ttl').style.display = S.search ? 'none' : '';
      $r('list').style.display = S.tab === 'chat' ? '' : 'none';
      $r('files').style.display = S.tab === 'files' ? '' : 'none';
      $r('cmp').style.display = S.tab === 'chat' ? '' : 'none';
      $r('typ').style.display = S.tab === 'chat' ? '' : 'none';
    }

    /* ---------- գրելու դաշտ ---------- */
    function drawComposer() {
      const c = $r('cmp');
      if (S.rec) {
        c.innerHTML = `<div class="nxc-rec"><span class="dot"></span><span data-r="rt">00:00</span><span class="sp"></span><button class="nxc-ib" data-a="rx" title="${_t('Չեղարկել')}">${nxi('trash')}</button><button class="nxc-ib nxc-send" data-a="rs" title="${_t('Ուղարկել')}">${nxi('send')}</button></div>`;
        return;
      }
      const ctx = S.edit ? `<div class="nxc-ctx">${nxi('edit')}<span>${_t('Խմբագրում')}՝ ${esc(S.edit.text)}</span><button data-a="cx">${nxi('x')}</button></div>`
        : S.reply ? `<div class="nxc-ctx">${nxi('back')}<span><b>${esc(S.reply.mine ? _t('Դուք') : S.reply.author)}</b>՝ ${esc(S.reply.text || (S.reply.files[0] ? S.reply.files[0].name : ''))}</span><button data-a="cx">${nxi('x')}</button></div>` : '';
      const draft = c.querySelector('textarea') ? c.querySelector('textarea').value : (S.edit ? S.edit.text : '');
      c.innerHTML = ctx + (S.files.length ? `<div class="nxc-st">${S.files.map((f, i) => `<div class="f">${fileKindLocal(f) === 'image' ? `<img src="${URL.createObjectURL(f)}">` : fileKindLocal(f) === 'video' ? `<video src="${URL.createObjectURL(f)}" muted playsinline></video>` : kindIcon(fileKindLocal(f))}<small>${esc(f.name)}</small><button data-rm="${i}">${nxi('x')}</button></div>`).join('')}</div>` : '')
        + `<div class="nxc-row">
          ${S.edit ? '' : `<button class="nxc-ib" data-a="att" title="${_t('Կցել')}">${nxi('clip')}</button>`}
          <textarea rows="1" placeholder="${S.edit ? _t('Խմբագրել…') : _t('Հաղորդագրություն…')}" ${S.busy ? 'disabled' : ''}>${esc(draft)}</textarea>
          <button class="nxc-ib ${draft.trim() || S.files.length || S.edit ? 'nxc-send' : ''}" data-a="${draft.trim() || S.files.length || S.edit ? 'send' : 'mic'}" title="${draft.trim() || S.files.length || S.edit ? _t('Ուղարկել') : _t('Ձայնային հաղորդագրություն')}">${S.busy ? '…' : (draft.trim() || S.files.length || S.edit ? nxi('send') : nxi('mic'))}</button>
        </div>
        <input type="file" data-f="cam" accept="image/${'*'}" capture="environment" hidden>
        <input type="file" data-f="vid" accept="video/${'*'}" capture="environment" hidden>
        <input type="file" data-f="gal" accept="image/${'*'},video/${'*'}" multiple hidden>
        <input type="file" data-f="any" multiple hidden>
        <input type="file" data-f="aud" accept="audio/${'*'}" capture hidden>
        ${S.err ? `<div class="nxc-err">${esc(S.err)}</div>` : ''}`;
      const ta = c.querySelector('textarea');
      const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; };
      fit();
      ta.oninput = () => {
        fit();
        const btn = c.querySelector('[data-a=send],[data-a=mic]'), has = ta.value.trim() || S.files.length || S.edit;
        btn.dataset.a = has ? 'send' : 'mic'; btn.innerHTML = has ? nxi('send') : nxi('mic'); btn.classList.toggle('nxc-send', !!has);
        if (Date.now() - S.typingAt > 3000 && ta.value.trim()) { S.typingAt = Date.now(); if (S.fbPath && NxFb.on()) NxFb.typing(S.fbPath); else call('chatTyping', { thread: o.thread }).catch(() => {}); }
      };
      ta.onkeydown = e => {
        if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); send(); }
        if (e.key === 'Escape') { S.reply = null; S.edit = null; drawComposer(); }
      };
      c.querySelectorAll('input[type=file]').forEach(fi => fi.onchange = async () => { await addFiles(fi.files); fi.value = ''; });
    }
    async function addFiles(fl) {
      S.err = '';
      const max = (S.info && S.info.maxFileMb) || 25;
      for (let f of [...fl]) {
        if (S.files.length >= 10) { S.err = _t('Առավելագույնը {0} ֆայլ', 10); break; }
        f = await shrinkImage(f);
        if (f.size > max * 1048576) { S.err = _t('«{0}» ֆայլը մեծ է {1} ՄԲ-ից', f.name, max) + (/^video/.test(f.type) ? ' ' + _t('Նկարեք ավելի կարճ տեսանյութ։') : ''); continue; }
        if (S.files.reduce((a, x) => a + x.size, 0) + f.size > 45 * 1048576) { S.err = _t('Մեկ անգամում՝ մինչև 45 ՄԲ'); break; }
        S.files.push(f);
      }
      drawComposer();
    }
    function attachMenu() {
      const old = root.querySelector('.nxc-att'); if (old) { old.remove(); return; }
      const m = document.createElement('div'); m.className = 'nxc-att';
      m.innerHTML = [['cam', nxi('camera'), 'Նկարել'], ['vid', nxi('video'), 'Տեսանյութ'], ['gal', nxi('image'), 'Գալերեա'], ['any', nxi('file'), 'Ֆայլ']].map(([k, i, l]) => `<button data-pick="${k}"><b>${i}</b>${_t(l)}</button>`).join('');
      root.querySelector('.nxc').appendChild(m);
      m.onclick = e => { const b = e.target.closest('[data-pick]'); if (!b) return; m.remove(); root.querySelector(`[data-f="${b.dataset.pick}"]`).click(); };
    }
    /** Արագ ուղարկում Firebase-ով (միայն տեքստ)՝ մյուս կողմը տեսնում է անմիջապես, աղյուսակում պահվում է զուգահեռ */
    async function sendFast(text, files) {
      files = files || [];
      const id = NxFb.newId(), me = NxFb.me(), sd = NxFb.side(), at = NxFb.nowStr(), replyTo = S.reply ? S.reply.id : '', pth = S.fbPath;
      const fl = files.map(f => {
        const k = kindOf(f.name) !== 'file' ? kindOf(f.name) : fileKindLocal(f);
        const m = { id: 'L-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), name: f.name, size: f.size, kind: k, at, by: me.n, mime: f.type || 'application/octet-stream', n: 1, live: 1 };
        SHARED.set(m.id, Promise.resolve({ url: URL.createObjectURL(f), mime: m.mime, name: f.name }));   // ուղարկողը տեսնում է անմիջապես
        return { f, m };
      });
      S.pend.set(id, { id, author: me.n, side: sd, text, at, replyTo, files: fl.map(x => x.m), edited: false, deleted: false, reactions: {}, mine: true, read: false, pending: true });
      S.reply = null; S.err = ''; S.typingAt = 0; S.files = [];
      $r('cmp').innerHTML = ''; drawComposer(); setMsgs(true);
      const t2 = $r('cmp').querySelector('textarea'); if (t2 && !('ontouchstart' in window)) t2.focus();
      let ok = true, data = [];
      try {
        data = await Promise.all(fl.map(async x => ({ name: x.f.name, mime: x.f.type, data: await readB64(x.f) })));
        if (fl.length) {
          fl.forEach((x, i) => { x.m.n = NxFb.chunks(data[i].data); });
          await NxFb.putFiles(pth, fl.map((x, i) => ({ id: x.m.id, b64: data[i].data })));
        }
        const msg = { author: me.n, side: sd, x: me.x || '', text, at, replyTo, files: fl.map(x => x.m), edited: false, deleted: false, reactions: {}, rt: INT ? false : sd === 'team', rc: sd === 'client' };
        await NxFb.send(pth, id, msg, S.info.companyId, o.thread);
      } catch (e) { ok = false; }
      const payload = { thread: o.thread, text, replyTo, fid: id, fat: at, files: data };
      if (ok && fl.length) payload.live = fl.map(x => ({ id: x.m.id, n: x.m.n }));
      if (!ok) {
        // Firebase-ը չաշխատեց՝ ուղարկում ենք սովորական ճանապարհով (նույն ID-ով, կրկնօրինակ չի լինի)
        try { const r = await call('chatSend', Object.assign(payload, { push: 1 })); S.pend.delete(id); apply(r, true); }
        catch (e) { S.pend.delete(id); setMsgs(); S.err = e.message; drawComposer(); const t = $r('cmp').querySelector('textarea'); if (t && !t.value) t.value = text; }
        return;
      }
      for (let i = 0; i < 4; i++) {
        try { await call('chatSend', Object.assign({}, payload, { lite: 1 })); return; }
        catch (e) { if (/AUTH|հասանելի չէ|չի գտնվել|Սխալ/.test(e.raw || e.message) || i === 3) { S.err = _t('Հաղորդագրությունը չպահպանվեց') + '՝ ' + e.message; drawComposer(); return; } await new Promise(r => setTimeout(r, 2000 * (i + 1))); }
      }
    }
    async function send() {
      const ta = $r('cmp').querySelector('textarea'); const text = ta ? ta.value.trim() : '';
      if (S.busy || (!text && !S.files.length)) return;
      // Firebase-ով (արագ)՝ տեքստ և մինչև 6 ՄԲ ֆայլեր, մեծերը՝ սովորական ճանապարհով
      if (!S.edit && S.fbPath && NxFb.on() && S.info && S.files.reduce((a, f) => a + f.size, 0) <= 6 * 1048576) return sendFast(text, S.files.slice());
      S.busy = true; S.err = ''; drawComposer();
      try {
        let r;
        if (S.edit) r = await call('chatEdit', { id: S.edit.id, text });
        else {
          const files = await Promise.all(S.files.map(async f => ({ name: f.name, mime: f.type, data: await readB64(f) })));
          r = await call('chatSend', { thread: o.thread, text, files, replyTo: S.reply ? S.reply.id : '' });
        }
        S.files = []; S.reply = null; S.edit = null; S.busy = false;
        $r('cmp').innerHTML = ''; apply(r, true); drawComposer();
        const t2 = $r('cmp').querySelector('textarea'); if (t2 && !('ontouchstart' in window)) t2.focus();
      } catch (e) { S.busy = false; S.err = e.message; drawComposer(); }
    }
    async function startRec() {
      let stream;
      try {
        if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('nosupport');
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        if (e && e.name === 'NotAllowedError') { S.err = _t('Միկրոֆոնի թույլտվությունը տրված չէ (միացրեք բրաուզերի/հեռախոսի կարգավորումներում)'); drawComposer(); return; }

function mergeOrder(defKeys, saved) {
  const out = (saved || []).filter(k => defKeys.includes(k));
  defKeys.forEach((k, i) => {
    if (out.includes(k)) return;
    const prev = defKeys.slice(0, i).reverse().find(x => out.includes(x));
    out.splice(prev ? out.indexOf(prev) + 1 : 0, 0, k);
  });
  return out;
}

function myLayout() { return (S.d && S.d.me.layout) || {}; }
let layTimer = null;
function saveLayout(L) {

/** Քաշել-թողնել՝ container-ի ներսում itemSel տարրերի հերթականությունը. axis՝ 'x' կամ 'y' */
function sortable(box, itemSel, axis, onEnd) {
  if (!box) return;
  let dragEl = null;
  box.querySelectorAll(itemSel).forEach(el => {
    el.addEventListener('dragstart', e => { dragEl = el; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', el.dataset.k); } catch (x) {} });
    el.addEventListener('dragend', () => { el.classList.remove('drag'); box.querySelectorAll('.dropl,.dropr').forEach(x => x.classList.remove('dropl', 'dropr')); if (dragEl) { dragEl = null; onEnd([...box.querySelectorAll(itemSel)].map(x => x.dataset.k)); } });
    el.addEventListener('dragover', e => {
      if (!dragEl || dragEl === el) return;
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const after = axis === 'x' ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
      el.parentNode.insertBefore(dragEl, after ? el.nextSibling : el);
    });
    el.addEventListener('drop', e => e.preventDefault());
  });
}

/** Ընդհանուր պատուհան՝ մի քանի ցուցակ քաշել-թողնելով */
function orderModal(title, intro, secs, onSave, onReset) {
  const st = {}; secs.forEach(sc => st[sc.k] = sc.items.map(x => Object.assign({}, x)));
  const draw = k => st[k].map((c, i) => `<div class="coli ${c.req && !secs.find(x => x.k === k).noHide ? 'req' : ''}" draggable="true" data-k="${esc(c.k)}"><span class="h">⠿</span>
      ${secs.find(x => x.k === k).noHide ? '' : `<input type="checkbox" data-on="${esc(c.k)}" ${c.on ? 'checked' : ''} ${c.req ? 'disabled' : ''}>`}<span class="t">${esc(c.l)}</span>
      <button type="button" class="mv" data-mv="-1" data-k="${esc(c.k)}" ${i ? '' : 'disabled'}>↑</button><button type="button" class="mv" data-mv="1" data-k="${esc(c.k)}" ${i < st[k].length - 1 ? '' : 'disabled'}>↓</button></div>`).join('');
  const m = openModal(title, `<p class="muted" style="margin-top:0">${intro}</p>${secs.map(sc => `<div class="lsec"><h4>${esc(sc.title)}</h4><div class="coll" data-sec="${sc.k}">${draw(sc.k)}</div></div>`).join('')}`,
    () => onSave(st), { extra: `<button type="button" class="btn" id="ordReset" style="margin-right:auto">↺ Լռելյայն</button>` });
  const bind = k => {
    const box = m.querySelector(`[data-sec="${k}"]`);
    const redraw = () => { box.innerHTML = draw(k); bind(k); };
    sortable(box, '.coli', 'y', keys => { const by = Object.fromEntries(st[k].map(c => [c.k, c])); st[k] = keys.map(x => by[x]); redraw(); });
    box.querySelectorAll('[data-on]').forEach(cb => cb.onchange = () => { st[k].find(c => c.k === cb.dataset.on).on = cb.checked; });
    box.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const i = st[k].findIndex(c => c.k === b.dataset.k), j = i + +b.dataset.mv; [st[k][i], st[k][j]] = [st[k][j], st[k][i]]; redraw(); });
  };

  m.querySelector('#ordReset').onclick = () => { onReset(); closeModal(); };
  return m;
}
