    try { await call('deleteExtUser', { id: u.id }); toast('Ջնջված է', 'ok'); S.ext = null; loadExt(); } catch (e) { toast(esc(e.message), 'err'); }
  },
  resetExt: async el => { if (!(await NxDlg.confirm('Զրոյացնե՞լ PIN-ը\nՀաջորդ մուտքին նա կստեղծի նորը։', { ok: 'Զրոյացնել' }))) return; try { await call('resetExtPin', { id: el.dataset.id }); toast('PIN-ը զրոյացված է', 'ok'); S.ext = null; loadExt(); } catch (e) { toast(esc(e.message), 'err'); } },
  copyInvite: async el => { if (!S.ext || !S.ext.rows) await loadExt(); const u = S.ext && S.ext.rows && S.ext.rows.find(x => x.id === el.dataset.id); if (!u) { toast('Փորձեք նորից', 'err'); return; } toast(copyText(inviteText(u)) ? '📋 Հրավերի տեքստը պատճենված է' : 'Չհաջողվեց պատճենել', 'ok'); },
  copyClientUrl: () => toast(copyText(S.ext.url) ? '📋 Հասցեն պատճենված է՝ ' + esc(S.ext.url) : 'Չհաջողվեց պատճենել', 'ok'),
  pageModal: (el, e) => { e.stopPropagation(); pageModal(); },
  colsModal: (el, e) => { e.stopPropagation(); colsModal(el.dataset.k); },
  hardRefresh: async () => {
    const b = $('#hardRef'); if (b.classList.contains('spin')) return;
    b.classList.add('spin');
    try {
      await call('forceRefresh', {}, { silent: true });
      S.arch = null; S.stats = null; S.reqs = null;
      await refresh(true);
      if (S.drawer && S.drawer.id && !Object.keys(S.drawer.edit || {}).length) loadDrawer(S.drawer.id, true);
      toast('🔄 Տվյալները թարմացված են', 'ok');
    } catch (e) { toast(esc(e.message), 'err'); }
    finally { b.classList.remove('spin'); }
  },
  openFilesFolder: async () => { const w = window.open('', '_blank'); try { const r = await call('filesFolder', {}); if (w) w.location = r.url; else window.open(r.url, '_blank'); } catch (e) { if (w) w.close(); toast(esc(e.message), 'err'); } },
  reqStatus: el => setReqStatus(el.dataset.id, el.dataset.s),
  reqNote: el => reqNoteModal(el.dataset.id, false),
  reqReject: el => reqNoteModal(el.dataset.id, true),
  delFile: async el => {
    if (!(await NxDlg.confirm('Ջնջե՞լ ֆայլը։', { ok: 'Ջնջել' }))) return;
    try { const r = await call('deleteFile', { id: el.dataset.id }); if (S.drawer) { S.drawer.data.files = r.files; renderDrawer(); } } catch (e) { toast(esc(e.message), 'err'); }
  },
  stType: el => { S.sf.type = el.dataset.k; S.sf.off = 0; renderView(); },
  stKind: el => { S.sf.kind = el.dataset.k; renderView(); },
  stPrev: () => { S.sf.off--; renderView(); },
  stNext: () => { if (S.sf.off < 0) { S.sf.off++; renderView(); } },
  stSort: el => { S.sf.sort = el.dataset.k; renderView(); },
  stEmp: el => { S.view = 'tasks'; S.scope = 'all'; S.f = { company: [], employee: [el.dataset.n], status: [], withReports: true, quick: '' }; renderShell(); renderView(); },
  msOpen: el => openMs(el.dataset.k),
  clearF: () => { S.f.company = []; S.f.employee = []; S.f.status = []; renderView(); },
  logout, enableNotif,
  testSound: () => { unlockAudio(); chime(); },
  newTask: () => newTask(),
  open: el => openTask(el.dataset.id),
  closeDrawer: async () => { if (await confirmDiscard()) closeDrawer(); },
  closeModal,
  quick: el => { S.f.quick = S.f.quick === el.dataset.k ? '' : el.dataset.k; renderView(); },
  scope: el => { S.scope = el.dataset.k; renderView(); },
  rview: el => { S.rview = el.dataset.k; renderView(); },
  rscope: el => { S.rf.scope = el.dataset.k; renderView(); },
  toggleNotifs,
  readAll: async () => { S.d.notifs.forEach(n => n.read = true); renderBadge(); renderNotifPanel(); try { await call('markNotifs', { all: true }, { silent: true }); } catch (e) {} },
  notifClick: el => {
    const n = S.d.notifs.find(x => String(x.id) === el.dataset.id); if (!n) return;
    if (!n.read) { n.read = true; renderBadge(); call('markNotifs', { ids: [n.id] }, { silent: true }).catch(() => {}); }
    if (n.type === 'mail' || /^M:/.test(n.taskId || '')) { closeNotifs(); openMailNotif(n); return; }
    if (n.type === 'chat' || /^(G-|R-|WA-)/.test(n.taskId || '')) { closeNotifs(); openChat(n.taskId); return; }
    if (n.taskId) openTask(n.taskId);
    else { closeNotifs(); if (n.type === 'reports') ACT.go({ dataset: { v: 'reports' } }); else if (n.type === 'request') ACT.go({ dataset: { v: 'requests' } }); else if (n.type === 'company') ACT.go({ dataset: { v: 'companies' } }); else if (n.type === 'tax') ACT.docTabTax(); }
  },
  setStatus: el => stageEdit('status', el.dataset.s),
  saveTask: () => saveTask(),
  finishTask: () => saveTask({ status: 'Ավարտված' }),
  discardEdit: () => { if (S.drawer) { S.drawer.edit = {}; renderDrawer(); } },
  advance: async (el, e) => {
    e.stopPropagation();
    const s = el.dataset.s;
    if (s === 'Ուղարկված է' && !(await NxDlg.confirm('Նշե՞լ «Ուղարկված է»\nՀաշվետվությունը կտեղափոխվի արխիվ։', { ok: 'Այո, ուղարկված է', danger: false }))) return;
    el.disabled = true;
    const i0 = S.d.tasks.findIndex(x => x.id === el.dataset.id), before = i0 >= 0 ? Object.assign({}, S.d.tasks[i0]) : null;
    if (before && s !== 'Ուղարկված է') { S.d.tasks[i0].status = s; renderView(); }   // անմիջապես
    try {
      const t = await call('updateTask', { id: el.dataset.id, patch: { status: s } }, { silent: s !== 'Ուղարկված է' });
      const i = S.d.tasks.findIndex(x => x.id === el.dataset.id);
      if (i >= 0) { if (t.archived) { S.d.tasks.splice(i, 1); S.d.recentReports.push({ companyId: t.companyId, reportCode: t.reportCode, period: t.period, archivedAt: t.archivedAt, id: t.id }); } else S.d.tasks[i] = t; }
      toast(t.archived ? '🗄 Ուղարկված է — արխիվում է' : '→ ' + esc(s), 'ok');
      renderShell(); renderView();
    }
    catch (err) { toast(esc(err.message), 'err'); el.disabled = false; if (before) { const i = S.d.tasks.findIndex(x => x.id === before.id); if (i >= 0) S.d.tasks[i] = before; renderView(); } }
  },
  rmPart: el => { const E = S.drawer.edit || {}; const cur = E.participants || splitList(S.drawer.data.task.participants); stageEdit('participants', cur.filter(n => n !== el.dataset.n)); },
  sendComment,
  delTask: async () => { if (!(await NxDlg.confirm('Ջնջե՞լ թասքը վերջնականապես։\nԱյս գործողությունը հետ բերել հնարավոր չէ։', { ok: 'Ջնջել' }))) return; try { await call('deleteTask', { id: S.drawer.id }); closeDrawer(); toast('Ջնջված է', 'ok'); await refresh(); } catch (e) { toast(esc(e.message), 'err'); } },
  restore: async (el, e) => { e.stopPropagation(); try { await call('restoreTask', { id: el.dataset.id }); toast('Վերականգնված է', 'ok'); S.arch = null; closeDrawer(); await refresh(); } catch (err) { toast(esc(err.message), 'err'); } },
  editCompany: el => editCompany(el.dataset.id),
  companyTasks: (el, e) => { e.stopPropagation(); S.view = 'tasks'; S.scope = 'all'; S.f = { company: [el.dataset.id], employee: [], status: [], withReports: true, quick: '' }; renderShell(); renderView(); },
  empTasks: el => { S.view = 'tasks'; S.scope = 'all'; S.f = { company: [], employee: [el.dataset.n], status: [], withReports: true, quick: '' }; renderShell(); renderView(); },
  editEmp: el => editEmp(el.dataset.n),
  resetPin: async el => { if (!(await NxDlg.confirm(`Զրոյացնե՞լ ${el.dataset.n}-ի PIN-ը։ Նրա բոլոր սարքերը կանջատվեն, և հաջորդ մուտքին նա կստեղծի նոր PIN։`, { ok: 'Զրոյացնել' }))) return; await call('resetPin', { name: el.dataset.n }); toast('PIN-ը զրոյացված է', 'ok'); await refresh(); },
  revoke: async el => { if (!(await NxDlg.confirm('Անջատե՞լ այս սարքը։', { ok: 'Անջատել' }))) return; await call('revokeDevice', { tid: el.dataset.tid }); toast('Սարքն անջատված է', 'ok'); await refresh(); },
  editRT: el => editRT(el.dataset.code),
  cleanupOld: async () => {
    try {
      const r = await call('cleanupOldReports', { dry: true });
      if (!r.count) { toast('Հեռացնելու բան չկա', 'ok'); return; }
      const list = Object.entries(r.byCompany).sort((a, b) => b[1] - a[1]).map(([n, c]) => `<tr><td>${esc(n)}</td><td style="text-align:right"><b>${c}</b></td></tr>`).join('');
      openModal('Հեռացնել ժամկետն անցած հաշվետվությունները', `<p>Կհեռացվի <b>${r.count}</b> ավտոմատ ստեղծված հաշվետվություն, որոնց ժամկետն անցել է (մինչև ${esc(r.cutoff)}), աշխատանք չի սկսվել («Ենթակա է լրացման») և մեկնաբանություն չունեն։ Մնացածը չի փոխվի։</p>
        <table class="tbl" style="box-shadow:none;border:1px solid var(--line)"><thead><tr><th>Կազմակերպություն</th><th style="text-align:right">Քանակ</th></tr></thead><tbody>${list}</tbody></table>`,
        async () => { const d = await call('cleanupOldReports', {}); toast(`🧹 Հեռացվեց ${d.count} հաշվետվություն`, 'ok'); await refresh(); },
        { submit: 'Հեռացնել', wide: true });
    } catch (e) { toast(esc(e.message), 'err'); }
  },
  genReports: async () => { const r = await call('generateReportsNow', {}); toast(r.generated ? `Ստեղծվեց ${r.generated} հաշվետվություն` : 'Բոլոր հաշվետվություններն արդեն ստեղծված են', 'ok'); await refresh(); },
  saveSettings: async () => {
    const f = formData($('#setForm'));
    try { await call('saveSettings', { companyName: f.companyName, regimes: splitList(f.regimes), pollSeconds: f.pollSeconds, holidays: f.holidays, defaultStart: f.defaultStart, overdueGrace: f.overdueGrace, autoPriority: f.autoPriority, hrLabel: f.hrLabel, hrUrl: f.hrUrl, mailInbox: f.mailInbox, mailTo: f.mailTo, mailFrom: f.mailFrom, mailFromName: f.mailFromName, mailFromPerson: !!f.mailFromPerson, sigPhone: f.sigPhone, sigAddr: f.sigAddr, sigWeb: f.sigWeb, clientAppUrl: f.clientAppUrl }); toast('Պահպանված է', 'ok'); await refresh(); }
    catch (e) { toast(esc(e.message), 'err'); }
  }
};
document.addEventListener('click', e => {
  unlockAudio();
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('#npanel')) closeNotifs(); return; }
  if (el.dataset.act !== 'toggleNotifs' && !el.closest('#npanel')) closeNotifs();
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.act];
  if (fn) {
    try { const r = fn(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast(esc(err.message || String(err)), 'err'); }); }
    catch (err) { console.error(err); toast('Սխալ՝ ' + esc(err.message || String(err)) + ' (' + esc(el.dataset.act) + ')', 'err'); }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.dlm) { const F = docLogF(); if (el.checked) F.mark[el.dataset.dlm] = true; else delete F.mark[el.dataset.dlm]; renderView(); return; }
  if (el.dataset && el.dataset.dlx === 'all') { const F = docLogF(); F.mark = {}; if (el.checked) (F.rows || []).filter(r => !r.deletedAt && (isMgr() || r.by === me())).forEach(r => { F.mark[r.fid] = true; }); renderView(); return; }
  if (el.dataset && el.dataset.dlx === 'del') { const F = docLogF(); F.del = el.checked; F.rows = null; renderView(); return; }
  if (el.dataset && el.dataset.dl) { const F = docLogF(); F[el.dataset.dl] = el.value; if (el.dataset.dl === 'to') F.toAuto = !el.value || el.value === today(); F.rows = null; F.busy = false; renderView(); return; }
  if (el.id === 'taxYmIn') { if (/^\d{4}-\d\d$/.test(el.value)) { S.taxYm = el.value; renderView(); } return; }
  if (el.id === 'taxWho') { S.taxWho = el.value; renderView(); return; }
  if (el.id === 'docComp') { S.docComp = el.value; S.docMark = {}; renderView(); return; }
  if (el.hasAttribute && el.hasAttribute('data-markall')) { const L = (S.docList || {})[S.docComp]; S.docMark = {}; if (el.checked && L) L.files.forEach(f => { S.docMark[f.fid] = true; }); renderView(); return; }
  if (el.dataset.mark) { S.docMark = S.docMark || {}; S.docMark[el.dataset.mark] = el.checked; renderView(); return; }
  if (el.dataset.chg) {
    const k = el.dataset.chg, v = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'sound') { lsSet('nx_sound', v ? '1' : '0'); return; }
    const [o, f] = k.split('.');
    S[o][f] = v;
    if (o === 'af') { S.arch = null; renderView(); return; }
    renderView(); return;
  }
  if (el.dataset.dchg && S.drawer) {
    const k = el.dataset.dchg;
    if (k === 'addPart') { if (!el.value) return; const E = S.drawer.edit || {}; const cur = E.participants || splitList(S.drawer.data.task.participants); stageEdit('participants', cur.concat(el.value)); return; }
    stageEdit(k, el.value);
  }
});
let rzTimer;
// ժամանակավոր ղեկավարի ժամկետը լրացավ՝ վերաբեռնել (ադմինի բաժինները կփակվեն)
setInterval(() => { if (S.d && S.d.me && S.d.me.tempUntil && today() > S.d.me.tempUntil) { S.d.me.tempUntil = ''; toast('👑 Ժամանակավոր ղեկավարի ժամկետը ավարտվեց', ''); refresh(); } }, 60000);
window.addEventListener('resize', () => { clearTimeout(rzTimer); rzTimer = setTimeout(() => { if (S.d && S.view === 'stats' && S.stats) renderView(); }, 250); });
let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value; if (S.view === 'archive') { S.arch = null; } renderView(); }, 200); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.msOpen) closeMs(); else if ($('#modal').classList.contains('on')) closeModal(); else if (S.drawer) ACT.closeDrawer(); else closeNotifs(); }
});

/* ====================== start ====================== */
(function init() {
  S.token = lsGet('nx_token', null);
  if (S.token) boot(); else showLogin();
})();

(function () { var b = document.getElementById('nxboot'); if (b) b.remove(); })();
</script>
</body>
