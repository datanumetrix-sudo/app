<!DOCTYPE html>
<html lang="hy">
<head>
<script>
/* Ախտորոշում. եթե էջը չի բեռնվում, սխալը ցույց է տրվում էկրանին (ուղարկեք դրա նկարը) */
window.__nxErr = function (m) { try { var d = document.getElementById('nxerr'); if (!d) { d = document.createElement('div'); d.id = 'nxerr'; d.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:99999;background:#7f1d1d;color:#fff;font:13px/1.45 monospace;padding:12px 14px;border-radius:10px;white-space:pre-wrap;max-height:45vh;overflow:auto'; (document.body || document.documentElement).appendChild(d); } d.textContent += '⚠ ' + m + '\n'; } catch (e) {} };
window.addEventListener('error', function (e) { window.__nxErr((e.message || 'Error') + (e.lineno ? ' (տող ' + e.lineno + ':' + e.colno + ')' : '') + (e.filename ? ' ' + String(e.filename).slice(-60) : '')); });
window.addEventListener('unhandledrejection', function (e) { var r = e.reason; window.__nxErr('Promise: ' + (r && r.message || r)); });
</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Numetrix Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#f8fafc; --line:#e5e9f2; --line2:#eef1f7;
  --text:#0f172a; --muted:#64748b; --muted2:#94a3b8;
  --brand:#2457f5; --brand2:#1d44c4; --brandSoft:#e9efff;
  --side:#0d1530; --side2:#16214a; --sideText:#c7d0ea;
  --red:#dc2626; --orange:#ea580c; --amber:#ca8a04; --green:#16a34a; --blue:#2563eb;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --shadow2:0 12px 40px rgba(15,23,42,.18);
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans Armenian',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.hidden{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- loading bar ---------- */
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--brand),#7c3aed);z-index:999;transition:width .3s,opacity .3s;opacity:0}
#bar.on{opacity:1;width:70%;transition:width 8s cubic-bezier(.1,.8,.2,1)}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1200px 600px at 10% -10%,#dfe7ff 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#efe4ff 0,transparent 60%),var(--bg)}
.lcard{width:100%;max-width:520px;background:var(--panel);border-radius:20px;box-shadow:var(--shadow2);padding:32px}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#7c3aed);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px}
.logo b{font-size:20px}
.logo small{display:block;color:var(--muted);font-weight:500}
.lstep{margin-top:24px}
.lstep h3{margin:0 0 10px;font-size:15px}
.empgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;max-height:300px;overflow:auto;padding:2px}
.empbtn{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:left;transition:.15s}
.empbtn:hover{border-color:var(--brand);background:var(--brandSoft)}
.empbtn.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
.empbtn span{font-weight:500;font-size:13px;line-height:1.25}
.lnote{background:#fff7e6;border:1px solid #fde7b0;color:#7a5200;border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.lerr{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--sideText);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.side .logo{padding:4px 8px 18px}
.side .logo b{color:#fff;font-size:17px}
.side .logo small{color:#8ea0d6;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:transparent;color:var(--sideText);border-radius:10px;text-align:left;font-weight:500}
.nav button:hover{background:var(--side2);color:#fff}
.nav button.on{background:var(--brand);color:#fff}
.nav button>span:not(.cnt){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .cnt{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:0 8px;font-size:12px;min-width:22px;text-align:center}
.nav button.on .cnt{background:rgba(255,255,255,.25)}
.nav a.ext{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#fff;text-decoration:none;font-weight:600;margin-top:10px;background:linear-gradient(135deg,#7c3aed,#2457f5);box-shadow:0 4px 14px rgba(36,87,245,.35)}
.nav a.ext:hover{filter:brightness(1.1)}
.nav button.ext{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#fff;font-weight:600;margin-top:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);text-align:left;width:100%}
.nav button.ext:hover{background:rgba(255,255,255,.12)}
.nav button.ext .arr{margin-left:auto;opacity:.8}
.srcl{display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:4px}
.srcr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:8px}
.srcr:hover{background:#f3f6fc}
.srcr .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcr .cp{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:2px}
.cpb{border:0;background:none;padding:0;color:var(--muted);font:inherit;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.cpb:hover{color:var(--brand)}
.cpb svg{width:13px;height:13px}
.srcbtn{display:inline-flex;align-items:center;gap:6px}
.srcbtn svg{width:15px;height:15px}
.nav a.ext .arr{margin-left:auto;opacity:.8}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 8px}
.side .bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.notifcta{border:1px dashed rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;padding:10px;font-size:12.5px;display:flex;gap:8px;align-items:center;text-align:left}
.notifcta:hover{background:var(--side2)}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--side2)}
.me .nm{color:#fff;font-weight:600;font-size:13px;line-height:1.2}
.me .rl{font-size:11.5px;color:#8ea0d6}
.me button{margin-left:auto;border:0;background:transparent;color:#8ea0d6;padding:6px;border-radius:8px}
.me button:hover{color:#fff;background:rgba(255,255,255,.08)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;background:rgba(244,246,251,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;border-bottom:1px solid transparent}
.top h1{font-size:20px;margin:0;font-weight:700;white-space:nowrap}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted2)}
.iconbtn{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--text)}
.iconbtn:hover{border-color:#cfd6e4}
.iconbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center;border:2px solid var(--bg)}
.content{padding:8px 28px 40px}
.menubtn{display:none}

/* ---------- buttons/inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#cbd3e1;background:var(--panel2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
textarea.inp{resize:vertical;min-height:80px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:#e9edf5;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted);font-size:13px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 16px}
.toolbar select.inp{width:auto;min-width:150px;padding:7px 10px}
.toolbar .sp{flex:1}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);user-select:none}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(var(--sn,4),minmax(0,1fr));gap:14px;margin-top:6px}
.stat{background:var(--panel);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--line2);display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;transition:.15s}
.stat:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(15,23,42,.08)}
.stat .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.stat .v{font-size:22px;font-weight:700;line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.stat>div:last-child{min-width:0}

/* ---------- task list ---------- */
.group{margin-top:18px}
.ghead{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-weight:600;font-size:13.5px}
.ghead .dot{width:10px;height:10px;border-radius:50%}
.ghead .n{color:var(--muted);font-weight:500}
.list{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);overflow:hidden}
.trow{display:grid;grid-template-columns:var(--tc,4px minmax(0,1fr) 210px 110px 120px 54px);align-items:center;gap:14px;padding:12px 16px 12px 0;border-top:1px solid var(--line2);cursor:pointer;transition:background .12s}
.trow:first-child{border-top:0}
.trow:hover{background:#f7f9fd}
.trow .stripe{align-self:stretch;border-radius:0 4px 4px 0}
.ttitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmeta{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tmeta b{color:#334155;font-weight:600}
.kt{display:inline-block;font-size:11px;font-weight:600;background:#eef2ff;color:#4338ca;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:color-mix(in srgb,var(--c) 12%,white);color:color-mix(in srgb,var(--c) 85%,black);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.people{display:flex;align-items:center}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:2px solid var(--panel);flex:none;letter-spacing:.3px}
.people .av+.av{margin-left:-8px}
.av.lg{width:38px;height:38px;font-size:13px}
.av.sm{width:22px;height:22px;font-size:9.5px;border-width:1.5px}
.due{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;color:#334155;white-space:nowrap}
.due.late{color:var(--red)}
.due.today{color:var(--orange)}
.cm{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12.5px;position:relative}
.cm.unread{color:var(--brand);font-weight:700}
.cm.unread::after{content:'';position:absolute;top:-2px;left:12px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--panel)}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:6px}

/* ---------- kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{background:#eaeef6;border-radius:var(--r);padding:10px;min-height:200px}
.khead{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:4px 4px 10px}
.khead .n{margin-left:auto;background:var(--panel);border-radius:20px;padding:0 8px;font-size:12px;color:var(--muted)}
.kcard{background:var(--panel);border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(15,23,42,.06);border-left:4px solid var(--pc);cursor:pointer;transition:.12s}
.kcard:hover{box-shadow:0 4px 14px rgba(15,23,42,.1)}
.kcard .co{font-weight:700;font-size:13.5px}
.kcard .rn{font-size:12.5px;color:#334155;margin-top:3px}
.kcard .ft{display:flex;align-items:center;gap:8px;margin-top:10px}
.kcard .ft .btn{margin-left:auto}

/* ---------- matrix ---------- */
.mwrap{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);overflow:auto;max-height:calc(100vh - 220px)}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.mx th,table.mx td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
table.mx thead th{position:sticky;top:0;background:var(--panel2);z-index:2;font-weight:600;color:#334155;min-width:150px}
table.mx tbody th{position:sticky;left:0;background:var(--panel);z-index:1;font-weight:600;min-width:200px}
table.mx thead th:first-child{left:0;z-index:3}
.mcell{display:flex;flex-direction:column;gap:4px}
.mchip{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 8px;background:color-mix(in srgb,var(--c) 12%,white);color:color-mix(in srgb,var(--c) 85%,black);font-weight:600;cursor:pointer;border:0;text-align:left;font-size:12px}
.mchip small{font-weight:500;opacity:.8}
.mdone{color:var(--green);font-weight:700}
.mna{color:#cbd5e1}
.mpend{color:var(--muted2)}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tbl th{background:var(--panel2);font-size:12px;color:var(--muted);text-align:left;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f7f9fd}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#f1f5f9;font-size:12px;font-weight:600;color:#334155;margin:1px 2px 1px 0}
.tag.r1{background:#e0f2fe;color:#075985}.tag.r2{background:#fef3c7;color:#92400e}.tag.r3{background:#dcfce7;color:#166534}.tag.r4{background:#ede9fe;color:#5b21b6}
.muted{color:var(--muted)}

/* ---------- team ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line2);padding:16px}
.card h3{margin:0;font-size:15px}
.kv{display:flex;gap:16px;margin:12px 0}
.kv div{font-size:12px;color:var(--muted)}
.kv b{display:block;font-size:18px;color:var(--text)}
.dev{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:6px 0;border-top:1px dashed var(--line)}
.dev span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(580px,100vw);background:var(--panel);z-index:41;box-shadow:var(--shadow2);transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none;visibility:visible}
.drawer:not(.on){visibility:hidden;transition:transform .25s,visibility 0s .25s}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dh .ttl{flex:1;min-width:0}
.dh .ttl .sub{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dh h2{margin:0;font-size:18px;line-height:1.3}
.dh input.inp{font-size:17px;font-weight:700;padding:6px 8px;margin-left:-9px;border-color:transparent}
.dh input.inp:hover{border-color:var(--line)}
.db{flex:1;overflow:auto;padding:18px 20px}
.sec{margin-bottom:22px}
.sec h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px;font-size:12.5px;font-weight:500;text-align:left;display:flex;gap:7px;align-items:center;line-height:1.2;min-height:40px}
.sbtn::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.sbtn:hover{border-color:var(--c)}
.sbtn.on{background:color-mix(in srgb,var(--c) 14%,white);border-color:var(--c);font-weight:700}
.sbtn:disabled{opacity:.45;cursor:not-allowed}
.stepper{display:flex;gap:4px}
.step{flex:1;border:0;background:#eef1f7;padding:10px 6px 8px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;position:relative;line-height:1.2}
.step .num{display:block;width:22px;height:22px;border-radius:50%;background:#dfe4ee;margin:0 auto 5px;line-height:22px;color:#475569}
.step.done{background:#e8f6ee;color:#166534}.step.done .num{background:var(--green);color:#fff}
.step.cur{background:var(--brandSoft);color:var(--brand2)}.step.cur .num{background:var(--brand);color:#fff}
.step:disabled{cursor:not-allowed;opacity:.6}
.dfields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dfields .full{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 3px;border-radius:20px;background:#f1f5f9;font-size:12.5px;font-weight:500}
.chip button{border:0;background:transparent;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
.chip button:hover{color:var(--red)}
.chips select.inp{width:auto;padding:5px 8px;font-size:12.5px;border-style:dashed}
.comments{display:flex;flex-direction:column;gap:12px}
.cmt{display:flex;gap:10px;max-width:92%}
.cmt.mine{align-self:flex-end;flex-direction:row-reverse}
.bub{background:#f1f5f9;border-radius:14px;padding:9px 12px;min-width:0}
.cmt.mine .bub{background:var(--brandSoft)}
.bub .h{font-size:12px;color:var(--muted);margin-bottom:2px}
.bub .h b{color:var(--text)}
.bub .t{white-space:pre-wrap;word-wrap:break-word}
.bub .rd{font-size:11px;color:var(--muted2);margin-top:4px}
.newc{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
.newc textarea{min-height:44px;max-height:180px}
.hist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.hist div b{color:#334155}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;background:rgba(15,23,42,.45);overflow:auto}
.modal.on{display:flex}
.mbox{background:var(--panel);border-radius:16px;box-shadow:var(--shadow2);width:100%;max-width:560px;animation:pop .18s ease}
.mbox.wide{max-width:760px}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:16px;flex:1}
.mb{padding:20px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--panel2);border-radius:0 0 16px 16px}
.prio{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prio label{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12.5px;font-weight:600;text-align:center;cursor:pointer;line-height:1.2;display:flex;align-items:center;justify-content:center;min-height:44px}
.prio input{display:none}
.prio input:checked+span{color:var(--c)}
.prio label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,white);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,white)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 10px 4px 4px;cursor:pointer;font-size:12.5px}
.pick input{display:none}
.pick label:has(input:checked){border-color:var(--brand);background:var(--brandSoft);font-weight:600}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches label{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.swatches input{display:none}
.swatches label:has(input:checked){border-color:var(--text)}
.rlist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
.ritem{display:grid;grid-template-columns:1fr 190px;gap:8px;align-items:center;padding:4px 6px;border-radius:8px}
.ritem.on{background:var(--brandSoft)}
.ritem .chk{color:var(--text)}
.ritem select.inp{padding:5px 8px;font-size:12.5px}
.ritem:not(.on) select{opacity:.4}
.ms-btn{display:inline-flex;align-items:center;gap:8px;max-width:270px;min-width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:13.5px;text-align:left;color:var(--text)}
.ms-btn:hover{border-color:#cbd3e1}
.ms-btn.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand2);font-weight:600}
.ms-btn.open{box-shadow:0 0 0 3px var(--brandSoft);border-color:var(--brand)}
.ms-btn .ms-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn .ms-n{background:var(--brand);color:#fff;border-radius:20px;font-size:11px;padding:0 7px;line-height:18px}
.ms-btn .ms-ch{width:16px;height:16px;color:var(--muted);transition:transform .15s}
.ms-btn.open .ms-ch{transform:rotate(180deg)}
.mspop{position:fixed;z-index:95;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow2);display:none;flex-direction:column;max-height:min(420px,70vh)}
.mspop.on{display:flex}
.ms-search{position:relative;padding:10px 10px 6px}
.ms-search svg{position:absolute;left:21px;top:50%;transform:translateY(-35%);color:var(--muted2);width:16px;height:16px}
.ms-search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:8px;outline:none}
.ms-search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
.ms-acts{display:flex;justify-content:space-between;padding:0 12px 6px}
.ms-acts button{border:0;background:none;color:var(--brand);font-size:12.5px;font-weight:600;padding:2px 0}
.ms-list{overflow:auto;padding:0 6px 8px;border-top:1px solid var(--line2)}
.ms-it{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px}
.ms-it:hover{background:#f3f6fc}
.ms-it input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.ms-it .ms-t{display:block;line-height:1.25}
.ms-it small{display:block;color:var(--muted2);font-size:11.5px}
.ms-it.dim{opacity:.55}
.dirty{border-color:#f59e0b!important;box-shadow:0 0 0 3px #fef3c7!important}
.sbtn.dirty,.step.dirty{box-shadow:0 0 0 2px #f59e0b!important}
.unsaved{font-size:12.5px;color:#b45309;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.unsaved::before{content:'';width:8px;height:8px;border-radius:50%;background:#f59e0b}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:13px}
.file svg{width:15px;height:15px;color:var(--muted);flex:none}
.file a{font-weight:600;color:var(--text);text-decoration:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file a:hover{color:var(--brand);text-decoration:underline}
.file small{color:var(--muted2);margin-left:auto;white-space:nowrap}
.file button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 4px;cursor:pointer}
.file button:hover{color:var(--red)}
.rq{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px}
.rq.new{border-left:4px solid var(--brand)}
.rq .rh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.rq .rh b{color:var(--text);font-size:13.5px}
.rq .rt{font-weight:700;font-size:15px;margin:6px 0 2px}
.rq .rd{white-space:pre-wrap;color:#334155;font-size:13.5px}
.rq .ra{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.rq .note{font-size:13px;background:#f8fafc;border-left:3px solid var(--brand);padding:6px 10px;border-radius:0 8px 8px 0;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:4px 0 16px}
.kpi{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.kpi .v{font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted2);margin-top:2px}
.sgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.scard{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;min-width:0}
.scard h3{margin:0 0 4px;font-size:15px}
.scard .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
.hl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.hl .scard{display:flex;gap:12px;align-items:center}
.hl .big{font-size:26px}
.hl b{display:block;font-size:14px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap .col{cursor:pointer}
.chartwrap .col:hover .hit{fill:rgba(15,23,42,.04)}
.ctip{position:absolute;pointer-events:none;background:#0f172a;color:#fff;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;opacity:0;transition:opacity .1s;z-index:5}
.ctip.on{opacity:1}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 92px;gap:10px;align-items:center;padding:6px 0;font-size:13px;border-top:1px solid var(--line2)}
.hbar:first-of-type{border-top:0}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:14px;display:flex;gap:2px}
.hbar .seg{height:100%;min-width:2px}
.hbar .seg:first-child{border-radius:0}
.hbar .seg:last-child{border-radius:0 4px 4px 0}
.hbar .num{text-align:right;font-variant-numeric:tabular-nums;color:#334155}
.hbar .num small{color:var(--muted2)}
table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st th[data-act]{cursor:pointer}
table.st th[data-act]:hover,table.st th.on{color:var(--brand)}
table.st td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.st tr:last-child td{border-bottom:0}
table.st .pct{display:inline-flex;align-items:center;gap:8px}
table.st .mini{width:60px;height:6px;border-radius:3px;background:#eef1f7;overflow:hidden;display:inline-block}
table.st .mini span{display:block;height:100%;background:#0ca30c}
.stwrap{overflow-x:auto}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.sgrid2,.hl{grid-template-columns:1fr}}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hbar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 80px}}
.preview{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#334155}

/* ---------- notif panel ---------- */
.npanel{position:fixed;top:64px;right:28px;width:min(400px,calc(100vw - 32px));max-height:70vh;background:var(--panel);border-radius:14px;box-shadow:var(--shadow2);z-index:50;display:none;flex-direction:column;border:1px solid var(--line)}
.npanel.on{display:flex}
.npanel .nh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.npanel .nh button{margin-left:auto}
.nlist{overflow:auto}
.nitem{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line2);cursor:pointer;font-size:13px}
.nitem:hover{background:#f7f9fd}
.nitem.unread{background:#f3f6ff}
.nitem.unread .t{font-weight:600}
.nitem .tm{font-size:11.5px;color:var(--muted2);margin-top:2px}

/* ---------- toasts ---------- */
.toasts{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:#0f172a;color:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow2);max-width:380px;font-size:13px;display:flex;gap:10px;align-items:flex-start;animation:pop .2s ease;cursor:pointer}
.toast.err{background:#7f1d1d}
.toast.ok{background:#14532d}
.toast.nt{background:var(--panel);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--brand)}
.toast .x{margin-left:auto;opacity:.6}

/* ---------- անձնական դասավորություն ---------- */
.nav .navedit{margin-top:8px;border:0;background:transparent;color:#8ea0d6;font-size:12px;padding:6px 10px;border-radius:8px;display:flex;gap:6px;align-items:center;width:100%}
.nav .navedit:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav.editing{outline:1px dashed rgba(255,255,255,.3);outline-offset:4px;border-radius:12px}
.navi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:#cfd8f3;background:rgba(255,255,255,.05);margin-bottom:4px;cursor:grab;user-select:none;font-size:13.5px}
.navi.sepi{background:transparent;border:1px dashed rgba(255,255,255,.18);justify-content:center;color:#8ea0d6;font-size:11.5px;padding:4px}
.navi.off{opacity:.4}
.navi .h{opacity:.6}
.navi .t{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi button{border:0;background:transparent;color:inherit;padding:2px 4px;border-radius:6px;font-size:14px;cursor:pointer}
.navi button:hover{background:rgba(255,255,255,.12)}
.navi.drag,.coli.drag,th.drag{opacity:.35}
.navbar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.navbar button{flex:1;border:0;border-radius:8px;padding:7px 8px;font-size:12.5px;font-weight:600;cursor:pointer}
.navbar .ok{background:var(--brand);color:#fff}.navbar .no{background:rgba(255,255,255,.1);color:#fff}
.navbar .rs{background:transparent;color:#8ea0d6;flex-basis:100%}
.coll{display:flex;flex-direction:column;gap:6px}
.coli{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:grab;user-select:none}
.coli .h{color:var(--muted2)}
.coli .t{flex:1}
.coli .mv{border:1px solid var(--line);background:var(--panel2);border-radius:6px;width:28px;height:26px;cursor:pointer}
.coli.req .t::after{content:' (միշտ)';color:var(--muted2);font-size:12px}
.tbl th[draggable=true]{cursor:grab}
.tbl th.dropl{box-shadow:inset 3px 0 0 var(--brand)}.tbl th.dropr{box-shadow:inset -3px 0 0 var(--brand)}
.colbtn{display:inline-flex;align-items:center;gap:6px}
.stats .stat[draggable=true]{cursor:grab}
.lsec{margin-bottom:16px}.lsec h4{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}

.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px 2px;margin:10px 0}
.chat .m{max-width:82%;padding:8px 12px;border-radius:14px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.chat .m small{display:block;font-size:11px;opacity:.7;white-space:normal}
.chat .m.c{background:#f1f5f9;align-self:flex-start;border-bottom-left-radius:4px}
.chat .m.t{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.xchips{display:flex;flex-wrap:wrap;gap:4px}
.cbox{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.cbox label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;font-size:13.5px}
.cbox label:hover{background:var(--panel2)}

.chats{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;height:calc(100vh - 110px);min-height:420px}
.chl{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chl-top{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line2)}
#chl{flex:1;overflow:auto}
.chi{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.chi:hover{background:#f7f9fd}.chi.on{background:#eef3ff}
.cav{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2457f5,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13.5px;flex:none}
.cav.r{background:#f1f5f9;font-size:18px}
.cn{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct{font-size:11.5px;color:var(--muted2)}
.cu{display:inline-block;background:#16a34a;color:#fff;border-radius:12px;font-size:11.5px;font-weight:700;padding:0 7px;margin-top:3px}
.chr{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chh{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line2)}
.chback{display:none}
@media (max-width:860px){.chats{grid-template-columns:1fr;height:calc(100vh - 150px)}.chats.has .chl{display:none}.chats:not(.has) .chr{display:none}.chback{display:inline-flex}}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:70;width:260px;transform:translateX(-100%);transition:.2s}
  .side.on{transform:none;box-shadow:var(--shadow2)}
  .menubtn{display:grid}
  .top{padding:12px 16px;flex-wrap:wrap}
  .top h1{font-size:17px}
  .search{order:5;flex-basis:100%;max-width:none}
  .content{padding:8px 16px 40px}
  .trow{grid-template-columns:4px minmax(0,1fr) auto;grid-template-areas:"s m d" "s p c";row-gap:8px}
  .trow .stripe{grid-area:s}.trow .tmain{grid-area:m}.trow .due{grid-area:d}
  .trow .pillw{grid-area:p}.trow .people,.trow .c-x{display:none}.trow .cm{grid-area:c;justify-content:flex-end}
  .fgrid,.dfields{grid-template-columns:1fr}
  .sgrid{grid-template-columns:repeat(2,1fr)}
  .prio{grid-template-columns:repeat(2,1fr)}
  .npanel{right:16px}
  .tbl{display:block;overflow-x:auto}
}
</style>
</head>
<body>
<div id="nxboot" style="position:fixed;inset:0;display:grid;place-items:center;font:15px system-ui,sans-serif;color:#64748b;background:#f4f6fb;z-index:9998">Բեռնվում է…</div>

<div id="bar"></div>

<!-- ============ LOGIN ============ -->
<div id="login" class="hidden">
  <div class="lcard">
    <div class="logo"><div class="mark">N</div><div><b id="lCompany">Numetrix</b><small>Թասքերի և հաշվետվությունների համակարգ</small></div></div>
    <div id="lBody"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside class="side" id="side">
    <div class="logo"><div class="mark">N</div><div><b id="sCompany">Numetrix</b><small>Tasks</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="bottom">
      <button class="notifcta hidden" id="notifCta" data-act="enableNotif"><span>🔔</span><span>Միացնել ծանուցումները և ձայնը</span></button>
      <div class="me" id="meBox"></div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="iconbtn menubtn" data-act="toggleSide" title="Մենյու"><svg class="i"><use href="#i-menu"/></svg></button>
      <h1 id="pageTitle">Թասքեր</h1>
      <div class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" placeholder="Որոնում՝ թասք, կազմակերպություն, ID…" autocomplete="off"></div>
      <button class="iconbtn" data-act="hardRefresh" id="hardRef" title="Թարմացնել տվյալները (բոլորի փոփոխությունները)"><svg class="i"><use href="#i-refresh"/></svg></button>
      <button class="iconbtn" data-act="toggleNotifs" title="Ծանուցումներ"><svg class="i"><use href="#i-bell"/></svg><span class="badge hidden" id="nBadge">0</span></button>
      <button class="btn primary" data-act="newTask"><svg class="i"><use href="#i-plus"/></svg><span>Նոր թասք</span></button>
    </header>
    <section class="content" id="view"></section>
  </div>
</div>

<div class="scrim" id="scrim" data-act="closeDrawer"></div>
<aside class="drawer" id="drawer"></aside>
<div class="npanel" id="npanel"></div>
<div class="mspop" id="mspop"></div>
<div class="modal" id="modal"></div>
<div class="toasts" id="toasts"></div>

<script>
/* NXCHAT:BEGIN — ավտոմատ տեղադրված src/chat.js-ից */
/* ============== NxDlg — ծրագրի ոճով պատուհաններ (բրաուզերի confirm/alert-ի փոխարեն) ==============
   await NxDlg.confirm('Տեքստ', { title, ok, cancel, danger })  → true/false
   await NxDlg.alert('Տեքստ', { title }) */
const NxDlg = (function () {
  let css = false;
  const CSS = `
.nxd-bg{position:fixed;inset:0;z-index:100000;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:nxdF .15s ease-out;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.nxd{background:#fff;color:#0f172a;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.35);width:100%;max-width:420px;padding:22px 22px 18px;animation:nxdS .18s ease-out;font-family:inherit}
.nxd-h{display:flex;gap:12px;align-items:flex-start}
.nxd-ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#eef3ff;color:#2457f5}
.nxd.danger .nxd-ic{background:#fef2f2;color:#dc2626}
.nxd-t{font-weight:700;font-size:16.5px;line-height:1.35;margin:1px 0 4px}
.nxd-m{font-size:14.5px;line-height:1.5;color:#475569;white-space:pre-wrap;overflow-wrap:anywhere}
.nxd-b{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.nxd-b button{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;min-width:96px}
.nxd-b .c{background:#f1f5f9;color:#334155}
.nxd-b .c:hover{background:#e2e8f0}
.nxd-b .o{background:#2457f5;color:#fff}
.nxd-b .o:hover{filter:brightness(1.08)}
.nxd.danger .nxd-b .o{background:#dc2626}
.nxd-b button:focus-visible{outline:3px solid rgba(36,87,245,.35);outline-offset:2px}
@media (max-width:480px){.nxd-bg{align-items:flex-end;padding:0}.nxd{border-radius:18px 18px 0 0;max-width:none;padding:20px 18px calc(16px + env(safe-area-inset-bottom))}.nxd-b button{flex:1}}
@keyframes nxdF{from{opacity:0}}
@keyframes nxdS{from{opacity:0;transform:translateY(12px) scale(.98)}}`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function show(msg, o, isConfirm) {
    o = o || {};
    if (!css) { const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st); css = true; }
    // առաջին տողը՝ վերնագիր, մնացածը՝ բացատրություն (եթե title չի տրված)
    let title = o.title, body = String(msg || '');
    if (!title) { const p = body.split('\n'); title = p.shift(); body = p.join('\n').trim(); }
    const danger = o.danger !== undefined ? o.danger : /Ջնջ|ջնջ|Դուրս|Զրոյ|Անջատ|չի աշխատի|հետ բերել/.test(String(msg));
    return new Promise(res => {
      const bg = document.createElement('div'); bg.className = 'nxd-bg';
      bg.innerHTML = `<div class="nxd ${danger ? 'danger' : ''}" role="dialog" aria-modal="true"><div class="nxd-h"><div class="nxd-ic">${danger ? '!' : isConfirm ? '?' : 'i'}</div><div style="min-width:0"><div class="nxd-t">${esc(title)}</div>${body ? `<div class="nxd-m">${esc(body)}</div>` : ''}</div></div>
        <div class="nxd-b">${isConfirm ? `<button class="c" data-v="0">${esc(o.cancel || 'Չեղարկել')}</button>` : ''}<button class="o" data-v="1">${esc(o.ok || (isConfirm ? (danger ? 'Այո, շարունակել' : 'Այո') : 'Լավ'))}</button></div></div>`;
      const done = v => { document.removeEventListener('keydown', key, true); bg.remove(); res(v); };
      const key = e => { if (e.key === 'Escape') { e.preventDefault(); done(false); } if (e.key === 'Enter') { e.preventDefault(); done(true); } };
      bg.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) done(b.dataset.v === '1'); else if (e.target === bg) done(false); });
      document.addEventListener('keydown', key, true);
      document.body.appendChild(bg);
      setTimeout(() => { const b = bg.querySelector(isConfirm && danger ? '.c' : '.o'); if (b) b.focus(); }, 30);
    });
  }
  return { confirm: (m, o) => show(m, o, true), alert: (m, o) => show(m, o, false).then(() => undefined) };
})();

/* ============== NxFb — Firebase-ի միացում (իրական ժամանակի չաթ) ==============
   Apps Script-ը տալիս է ժամանակավոր բանալի (fbToken), հավելվածը ուղղակիորեն լսում/գրում է Firestore-ում։
   Եթե Firebase-ը կարգավորված չէ կամ չի բեռնվում, ամեն ինչ աշխատում է նախկին եղանակով։ */
const NxFb = (function () {
  const VERS = ['12.0.0', '11.10.0', '10.14.1'];
  const st = { p: null, on: false, me: null, skew: 0, tz: 240, db: null, F: null, app: null, A: null, gen: 0 };
  const p2 = n => String(n).padStart(2, '0');
  async function load() {
    let err;
    const list = window.NX_FB_BASE ? [window.NX_FB_BASE] : VERS.map(v => 'https:' + '/' + '/www.gstatic.com/firebasejs/' + v + '/');
    for (const b of list) {
      try {
        const [A, U, F] = await Promise.all([import(b + 'firebase-app.js'), import(b + 'firebase-auth.js'), import(b + 'firebase-firestore.js')]);
        return { A, U, F };
      } catch (e) { err = e; }
    }
    throw err || new Error('Firebase SDK');
  }
  function start(call) {
    if (st.p) return st.p;
    const gen = ++st.gen;
    st.p = (async () => {
      const t = await call('fbToken', {});
      if (!t || t.off || gen !== st.gen) return false;
      const { A, U, F } = await load();
      const app = A.initializeApp(t.cfg, 'nx' + gen + '-' + Date.now());
      const auth = U.initializeAuth(app, { persistence: U.inMemoryPersistence });
      await U.signInWithCustomToken(auth, t.token);
      if (gen !== st.gen) { try { A.deleteApp(app); } catch (e) {} return false; }
      Object.assign(st, { app, A, F, db: F.initializeFirestore(app, { experimentalAutoDetectLongPolling: true }), me: t.me, skew: (+t.now || Date.now()) - Date.now() });
      const m = String(t.tz || '+0400').match(/([+-])(\d\d)(\d\d)/); st.tz = m ? (m[1] === '-' ? -1 : 1) * (+m[2] * 60 + +m[3]) : 240;
      st.on = true;
      return true;
    })().catch(e => {
      try { console.warn('Firebase-ը չմիացավ', e); } catch (x) {}
      st.on = false; st.err = String(e && e.message || e);
      // 2 րոպե հետո կրկին կփորձի
      setTimeout(() => { if (gen === st.gen && !st.on) st.p = null; }, 120000);
      return false;
    });
    return st.p;
  }
  function stop() {
    st.gen++; st.p = null; st.on = false;
    if (st.app && st.A) { try { st.A.deleteApp(st.app); } catch (e) {} }
    st.app = null; st.db = null;
  }
  const now = () => Date.now() + st.skew;
  function nowStr() { const d = new Date(now() + st.tz * 60000); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()); }
  const path = (cid, owner, thread) => ['co', String(cid), 'u', String(owner), 'th', String(thread)];
  const newId = () => 'W-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const side = () => st.me && st.me.s === 't' ? 'team' : 'client';
  function listenMsgs(pth, sinceMs, cb) {
    const F = st.F;
    const q = F.query(F.collection(st.db, ...pth, 'm'), F.where('u', '>', F.Timestamp.fromMillis(sinceMs)));
    return F.onSnapshot(q, snap => cb(snap.docChanges().map(ch => ({ type: ch.type, id: ch.doc.id, d: ch.doc.data({ serverTimestamps: 'estimate' }) }))), err => cb(null, err));
  }
  function listenDoc(pth, cb) {
    const F = st.F;
    return F.onSnapshot(F.doc(st.db, ...pth), s => cb(s.exists() ? s.data() : null), () => {});
  }
  /** Ազդանշան (sig/team կամ sig/<կազմ.>)՝ նոր հաղորդագրության մասին. առաջին վիճակը բաց է թողնվում */
  function onSig(key, cb) {
    if (!st.on) return () => {};
    const F = st.F; let first = true;
    return F.onSnapshot(F.doc(st.db, 'sig', String(key)), s => { if (first) { first = false; return; } cb(s.exists() ? s.data() : null); }, () => {});
  }
  /** Աշխատակցի տվյալների պատճենը (snap/<uid>) */
  function listenSnap(cb) {
    if (!st.on || !st.me) return () => {};
    const F = st.F;
    return F.onSnapshot(F.doc(st.db, 'snap', st.me.k), s => { if (!s.exists()) return; const x = s.data(); try { cb(JSON.parse(x.j), +x.t || 0); } catch (e) {} }, () => {});
  }
  function withTimeout(pr, ms) { return Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
  function send(pth, id, msg, cid, thread) {
    const F = st.F, b = F.writeBatch(st.db), ts = F.serverTimestamp();
    b.set(F.doc(st.db, ...pth, 'm', id), Object.assign({}, msg, { u: ts }));
    b.set(F.doc(st.db, ...pth), { ty: { [st.me.k]: { n: st.me.n, s: st.me.s, at: 0 } }, u: ts }, { merge: true });
    const sg = { t: String(thread), at: now(), s: st.me.s, u: ts };
    b.set(F.doc(st.db, 'sig', 'team'), sg);
    b.set(F.doc(st.db, 'sig', String(cid)), sg);
    return withTimeout(b.commit(), 6000);
  }
  /** Ֆայլերը Firestore-ում՝ մասերով (յուրաքանչյուրը ≤ 700 ԿԲ base64) */
  const CH = 700000;
  async function putFiles(pth, items) {
    const F = st.F; let b = F.writeBatch(st.db), sz = 0; const all = [];
    for (const it of items) {
      for (let i = 0; i * CH < it.b64.length || i === 0; i++) {
        const part = it.b64.slice(i * CH, (i + 1) * CH);
        if (sz + part.length > 6000000) { all.push(b.commit()); b = F.writeBatch(st.db); sz = 0; }
        b.set(F.doc(st.db, ...pth, 'f', it.id + '-' + i), { d: part, u: F.serverTimestamp() }); sz += part.length;
      }
    }
    all.push(b.commit());
    return withTimeout(Promise.all(all), 120000);
  }
  async function getFile(pth, id, n) {
    const F = st.F, parts = await Promise.all(Array.from({ length: n }, (_, i) => F.getDoc(F.doc(st.db, ...pth, 'f', id + '-' + i))));
    return parts.map(p => { if (!p.exists()) throw new Error('Ֆայլը չի գտնվել'); return p.data().d; }).join('');
  }
  function typing(pth) {
    const F = st.F;
    return F.setDoc(F.doc(st.db, ...pth), { ty: { [st.me.k]: { n: st.me.n, s: st.me.s, at: now() } }, u: F.serverTimestamp() }, { merge: true }).catch(() => {});
  }
  function markRead(pth, ids) {
    const F = st.F, b = F.writeBatch(st.db), ts = F.serverTimestamp(), fl = st.me.s === 't' ? 'rt' : 'rc';
    ids.slice(0, 400).forEach(id => b.update(F.doc(st.db, ...pth, 'm', id), { [fl]: true, u: ts }));
    return b.commit().catch(() => {});
  }
  return {
    start, stop, now, nowStr, path, newId, side, listenMsgs, listenDoc, onSig, listenSnap, send, typing, markRead, putFiles, getFile, chunks: s => Math.max(1, Math.ceil(s.length / CH)),
    ready: () => st.p || Promise.resolve(false),
    on: () => st.on, me: () => st.me, err: () => st.err || ''
  };
})();

/* ============== NxChat — ընդհանուր չաթ (օգտագործվում է և՛ թիմի, և՛ հաճախորդի էջում) ==============
   NxChat.mount(el, { thread, side, call, onConvert, convertLabel, canConvert, onInfo, compact })
   call(action, payload) → Promise<data> */
const NxChat = (function () {
  const CSS = `
.nxc{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--nxc-bg,#eef2f8);border-radius:inherit;position:relative;font-size:14.5px}
.nxc *{box-sizing:border-box}
.nxc-top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel,#fff);border-bottom:1px solid var(--line,#e5e9f2)}
.nxc-top .t{flex:1;min-width:0;font-size:13px;color:var(--muted,#64748b)}
.nxc-top button{border:1px solid var(--line,#e5e9f2);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:inherit}
.nxc-top button.on{background:var(--brand,#2457f5);color:#fff;border-color:transparent}

        </div>
        <input type="file" data-f="cam" accept="image/${'*'}" capture="environment" hidden>
        <input type="file" data-f="vid" accept="video/${'*'}" capture="environment" hidden>

        <input type="file" data-f="any" multiple hidden>
        <input type="file" data-f="aud" accept="audio/${'*'}" capture hidden>
        ${S.err ? `<div class="nxc-err">${esc(S.err)}</div>` : ''}`;

        const btn = c.querySelector('[data-a=send],[data-a=mic]'), has = ta.value.trim() || S.files.length || S.edit;
        btn.dataset.a = has ? 'send' : 'mic'; btn.textContent = has ? '➤' : '🎤'; btn.classList.toggle('nxc-send', !!has);
        if (Date.now() - S.typingAt > 3000 && ta.value.trim()) { S.typingAt = Date.now(); if (S.fbPath && NxFb.on()) NxFb.typing(S.fbPath); else call('chatTyping', { thread: o.thread }).catch(() => {}); }

        if (e.key === 'Escape') { S.reply = null; S.edit = null; drawComposer(); }
      };
      c.querySelectorAll('input[type=file]').forEach(fi => fi.onchange = async () => { await addFiles(fi.files); fi.value = ''; });
    }
    async function addFiles(fl) {
      S.err = '';
      const max = (S.info && S.info.maxFileMb) || 25;
      for (let f of [...fl]) {
        if (S.files.length >= 10) { S.err = 'Առավելագույնը 10 ֆայլ'; break; }
        f = await shrinkImage(f);
        if (f.size > max * 1048576) { S.err = `«${f.name}» ֆայլը մեծ է ${max} ՄԲ-ից${/^video/.test(f.type) ? '։ Նկարեք ավելի կարճ տեսանյութ։' : ''}`; continue; }
        if (S.files.reduce((a, x) => a + x.size, 0) + f.size > 45 * 1048576) { S.err = 'Մեկ անգամում՝ մինչև 45 ՄԲ'; break; }

    /** Արագ ուղարկում Firebase-ով (միայն տեքստ)՝ մյուս կողմը տեսնում է անմիջապես, աղյուսակում պահվում է զուգահեռ */
    async function sendFast(text, files) {
      files = files || [];
      const id = NxFb.newId(), me = NxFb.me(), sd = NxFb.side(), at = NxFb.nowStr(), replyTo = S.reply ? S.reply.id : '', pth = S.fbPath;
      const fl = files.map(f => {
        const k = kindOf(f.name) !== 'file' ? kindOf(f.name) : fileKindLocal(f);
        const m = { id: 'L-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), name: f.name, size: f.size, kind: k, at, by: me.n, mime: f.type || 'application/octet-stream', n: 1, live: 1 };
        SHARED.set(m.id, Promise.resolve({ url: URL.createObjectURL(f), mime: m.mime, name: f.name }));   // ուղարկողը տեսնում է անմիջապես
        return { f, m };
      });
      S.pend.set(id, { id, author: me.n, side: sd, text, at, replyTo, files: fl.map(x => x.m), edited: false, deleted: false, reactions: {}, mine: true, read: false, pending: true });
      S.reply = null; S.err = ''; S.typingAt = 0; S.files = [];
      $r('cmp').innerHTML = ''; drawComposer(); setMsgs(true);
      const t2 = $r('cmp').querySelector('textarea'); if (t2 && !('ontouchstart' in window)) t2.focus();
      let ok = true, data = [];
      try {
        data = await Promise.all(fl.map(async x => ({ name: x.f.name, mime: x.f.type, data: await readB64(x.f) })));
        if (fl.length) {
          fl.forEach((x, i) => { x.m.n = NxFb.chunks(data[i].data); });
          await NxFb.putFiles(pth, fl.map((x, i) => ({ id: x.m.id, b64: data[i].data })));
        }
        const msg = { author: me.n, side: sd, x: me.x || '', text, at, replyTo, files: fl.map(x => x.m), edited: false, deleted: false, reactions: {}, rt: INT ? false : sd === 'team', rc: sd === 'client' };
        await NxFb.send(pth, id, msg, S.info.companyId, o.thread);
      } catch (e) { ok = false; }
      const payload = { thread: o.thread, text, replyTo, fid: id, fat: at, files: data };
      if (ok && fl.length) payload.live = fl.map(x => ({ id: x.m.id, n: x.m.n }));
      if (!ok) {
        // Firebase-ը չաշխատեց՝ ուղարկում ենք սովորական ճանապարհով (նույն ID-ով, կրկնօրինակ չի լինի)
        try { const r = await call('chatSend', Object.assign(payload, { push: 1 })); S.pend.delete(id); apply(r, true); }
        catch (e) { S.pend.delete(id); setMsgs(); S.err = e.message; drawComposer(); const t = $r('cmp').querySelector('textarea'); if (t && !t.value) t.value = text; }
        return;
      }
      for (let i = 0; i < 4; i++) {
        try { await call('chatSend', Object.assign({}, payload, { lite: 1 })); return; }
        catch (e) { if (/AUTH|հասանելի չէ|չի գտնվել|Սխալ/.test(e.message) || i === 3) { S.err = 'Հաղորդագրությունը չպահպանվեց աղյուսակում՝ ' + e.message; drawComposer(); return; } await new Promise(r => setTimeout(r, 2000 * (i + 1))); }
      }
    }
    async function send() {
      const ta = $r('cmp').querySelector('textarea'); const text = ta ? ta.value.trim() : '';
      if (S.busy || (!text && !S.files.length)) return;
      // Firebase-ով (արագ)՝ տեքստ և մինչև 6 ՄԲ ֆայլեր, մեծերը՝ սովորական ճանապարհով
      if (!S.edit && S.fbPath && NxFb.on() && S.info && S.files.reduce((a, f) => a + f.size, 0) <= 6 * 1048576) return sendFast(text, S.files.slice());
      S.busy = true; S.err = ''; drawComposer();
      try {
        let r;
        if (S.edit) r = await call('chatEdit', { id: S.edit.id, text });
        else {
          const files = await Promise.all(S.files.map(async f => ({ name: f.name, mime: f.type, data: await readB64(f) })));
          r = await call('chatSend', { thread: o.thread, text, files, replyTo: S.reply ? S.reply.id : '' });
        }
        S.files = []; S.reply = null; S.edit = null; S.busy = false;
        $r('cmp').innerHTML = ''; apply(r, true); drawComposer();
        const t2 = $r('cmp').querySelector('textarea'); if (t2 && !('ontouchstart' in window)) t2.focus();
      } catch (e) { S.busy = false; S.err = e.message; drawComposer(); }
    }
    async function startRec() {
      let stream;
      try {
        if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('nosupport');
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        if (e && e.name === 'NotAllowedError') { S.err = 'Միկրոֆոնի թույլտվությունը տրված չէ (միացրեք բրաուզերի/հեռախոսի կարգավորումներում)'; drawComposer(); return; }
        root.querySelector('[data-f="aud"]').click(); return;
      }
      const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
      const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined), chunks = [], t0 = Date.now();
      let cancel = false;
      S.rec = mr; drawComposer();
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const tm = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000), el = $r('rt'); if (el) el.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); if (s >= 300) mr.stop(); }, 250);
      mr.onstop = async () => {
        stream.getTracks().forEach(t => t.stop()); clearInterval(tm); S.rec = null;
        if (cancel || !chunks.length || Date.now() - t0 < 700) { drawComposer(); return; }
        const type = (mr.mimeType || mime || 'audio/webm').split(';')[0], ext = /mp4/.test(type) ? 'm4a' : /ogg/.test(type) ? 'ogg' : 'webm';
        S.files = [new File(chunks, `Ձայնային-${stamp()}.${ext}`, { type })];
        drawComposer(); send();
      };
      root.querySelector('[data-a=rx]').onclick = () => { cancel = true; mr.stop(); };
      root.querySelector('[data-a=rs]').onclick = () => mr.stop();
      mr.start(1000);
    }

    /* ---------- գործողությունների մենյու ---------- */
    function menu(m, btn) {

  if (/H/.test(p)) { const a = p.split('-H'); return a[0] + ' ' + ['I', 'II'][+a[1] - 1] + ' կիսամյ.'; }
  return p;
}

/* ====================== API ====================== */
function call(action, payload, opts) {
  opts = opts || {};
  if (!opts.silent) busy(1);
  return new Promise((resolve, reject) => {
    const done = r => {
      if (!opts.silent) busy(-1);
      if (r && r.ok) {
        // մեր իսկ փոփոխությունից հետո ամբողջ տվյալները նորից չբեռնելու համար
        if (r.dvb && S.d && S.d.dv === r.dvb.prev) S.d.dv = r.dvb.next;
        return resolve(r.data);
      }
      const msg = (r && r.error) || 'Կապի սխալ';
      if (/^AUTH/.test(msg) && action !== 'login') { logoutLocal(msg.replace(/^AUTH:\s*/, '')); }
      reject(new Error(msg.replace(/^AUTH:\s*/, '')));
    };
    const fail = e => { if (!opts.silent) busy(-1); reject(new Error('Կապի սխալ՝ ' + (e && e.message || e))); };
    if (IS_GAS) {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(action, S.token, payload || {});
    } else {
      if (!API_URL) return fail(new Error('API_URL-ը լրացված չէ'));
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, payload: payload || {} }) })
        .then(r => r.json()).then(done).catch(fail);
    }
  });
}
function busy(d) { S.busy = Math.max(0, S.busy + d); const b = $('#bar'); if (S.busy) { b.classList.add('on'); } else { b.classList.remove('on'); } }

/* ====================== toasts / sound / notifications ====================== */
function toast(msg, type, onClick, ms) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.innerHTML = `<div>${msg}</div><span class="x">✕</span>`;
  el.onclick = () => { el.remove(); if (onClick) onClick(); };
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), ms || (type === 'nt' ? 12000 : 4000));
}
function unlockAudio() {
  try {
    if (!S.audio) S.audio = new (window.AudioContext || window.webkitAudioContext)();
    if (S.audio.state === 'suspended') S.audio.resume();
  } catch (e) {}
}
function chime() {
  if (lsGet('nx_sound', '1') !== '1') return;
  try {
    unlockAudio();
    const ctx = S.audio; if (!ctx) return;
    const t0 = ctx.currentTime;
    [[880, 0], [1320, 0.16], [1760, 0.32]].forEach(([f, dt]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.45);
      o.connect(g); g.connect(ctx.destination); o.start(t0 + dt); o.stop(t0 + dt + 0.5);
    });
  } catch (e) {}
}
function canDesktopNotify() { return 'Notification' in window && Notification.permission === 'granted'; }

  } catch (e) { after('denied'); }

async function pollOnce() {

    const r = await call('poll', { nv: S.d.nv, dv: S.d.dv }, { silent: true });
    S.d.today = r.today;
    if (r.notifs) { S.d.nv = r.nv; handleNotifs(r.notifs); }
    if (r.dv !== S.d.dv) await refresh(true);
    if (r.cv && r.cv !== S.ch.cv) { S.ch.cv = r.cv; loadChatUnread(); if (S.view === 'chats') loadChats(); }
  } catch (e) { /* ցանցի խափանում — կփորձենք նորից */ }
}
/* Firebase՝ հաճախորդի նոր հաղորդագրության մասին ազդանշանը գալիս է ակնթարթորեն */
let FBSIG = null, FBSIG_T = [];
function fbStart() {
  if (!S.token || FBSIG) return;
  FBSIG = 'wait';
  NxFb.start((a, p) => call(a, p, { silent: true })).then(ok => {
    if (!ok || !S.token) { FBSIG = null; return; }
    const offSig = NxFb.onSig('team', () => {
      FBSIG_T.forEach(clearTimeout);
      const go = () => { loadChatUnread(); if (S.view === 'chats') loadChats(); };
      FBSIG_T = [setTimeout(go, 2500), setTimeout(go, 7000)];
    });
    // ուրիշի փոփոխությունը՝ ազդանշանով, տվյալները բեռնվում են ֆոնային ռեժիմում
    let dT = null;
    const offData = NxFb.onSig('data', sg => {
      if (!S.d || !S.token || (sg && sg.s && sg.s === S.d.dv)) return;   // մեր իսկ փոփոխությունն է
      clearTimeout(dT); dT = setTimeout(() => { refresh(true).catch(() => {}); }, 400);
    });
    const me0 = NxFb.me();
    const offNv = me0 ? NxFb.onSig(me0.k, () => { pollOnce(); }) : () => {};
    S.snapLive = true;
    FBSIG = () => { offSig(); offData(); offNv(); S.snapLive = false; };
  });
}
function fbStop() { if (typeof FBSIG === 'function') try { FBSIG(); } catch (e) {} FBSIG = null; FBSIG_T.forEach(clearTimeout); NxFb.stop(); }
function startPolling() {
  stopPolling();
  fbStart();
  loadChatUnread();
  const ms = S.snapLive ? 60000 : Math.max(10, (S.d && S.d.settings.pollSeconds) || 20) * 1000;
  S.pollTimer = setTimeout(async function tick() {
    if (!S.token || !S.d) return;
    await pollOnce();
    if (S.token && S.d) S.pollTimer = setTimeout(tick, ms);
  }, ms);
}
function stopPolling() { if (S.pollTimer) clearTimeout(S.pollTimer); S.pollTimer = null; }
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && S.token && S.d) { stopPolling(); await pollOnce(); startPolling(); }
});
// Պատուհանին վերադառնալիս կամ ցանցը վերականգնվելիս՝ անմիջապես թարմացնել

function applyBoot(d) {

/** Պահված հերթականություն + նոր (դեռ չպահված) տարրերն իրենց լռելյայն տեղում */
function mergeOrder(defKeys, saved) {
  const out = (saved || []).filter(k => defKeys.includes(k));
  defKeys.forEach((k, i) => {
    if (out.includes(k)) return;
    const prev = defKeys.slice(0, i).reverse().find(x => out.includes(x));
    out.splice(prev ? out.indexOf(prev) + 1 : 0, 0, k);
  });
  return out;
}

  const defs = navDefs(), L = myLayout();
  const by = Object.fromEntries(defs.map(d => [d.k, d]));
  const hide = L.navHide || [];

}

/** Քաշել-թողնել՝ container-ի ներսում itemSel տարրերի հերթականությունը. axis՝ 'x' կամ 'y' */
function sortable(box, itemSel, axis, onEnd) {
  if (!box) return;
  let dragEl = null;
  box.querySelectorAll(itemSel).forEach(el => {
    el.addEventListener('dragstart', e => { dragEl = el; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', el.dataset.k); } catch (x) {} });
    el.addEventListener('dragend', () => { el.classList.remove('drag'); box.querySelectorAll('.dropl,.dropr').forEach(x => x.classList.remove('dropl', 'dropr')); if (dragEl) { dragEl = null; onEnd([...box.querySelectorAll(itemSel)].map(x => x.dataset.k)); } });
    el.addEventListener('dragover', e => {
      if (!dragEl || dragEl === el) return;
      e.preventDefault();
      const r = el.getBoundingClientRect();
      const after = axis === 'x' ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2;
      el.parentNode.insertBefore(dragEl, after ? el.nextSibling : el);
    });
    el.addEventListener('drop', e => e.preventDefault());
  });
}

function orderModal(title, intro, secs, onSave, onReset) {
  const st = {}; secs.forEach(sc => st[sc.k] = sc.items.map(x => Object.assign({}, x)));
  const draw = k => st[k].map((c, i) => `<div class="coli ${c.req && !secs.find(x => x.k === k).noHide ? 'req' : ''}" draggable="true" data-k="${esc(c.k)}"><span class="h">⠿</span>

  const bind = k => {

    sortable(box, '.coli', 'y', keys => { const by = Object.fromEntries(st[k].map(c => [c.k, c])); st[k] = keys.map(x => by[x]); redraw(); });

/** Ամբողջ թվերով առանցք՝ 1/2/5 × 10ⁿ քայլով */
function niceScale(v) {
  const raw = Math.max(1, v) / 4, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = Math.max(1, [1, 2, 5, 10].map(m => m * p).find(x => x >= raw));
  const ticks = Math.max(1, Math.ceil(Math.max(1, v) / step));
  return { step, max: step * ticks, ticks };
}
function trendSvg(tr) {
  const vw = ($('#view') && $('#view').clientWidth) || 900;
  const W = vw >= 1100 ? 560 : Math.max(320, Math.min(560, vw - 70)), H = 240, L = 34, R = 8, T = 14, B = 38;
  const sc = niceScale(Math.max(...tr.map(t => t.n)));
  const max = sc.max;
  const cw = (W - L - R) / tr.length, bw = Math.min(34, cw * 0.62);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let i = 0; i <= sc.ticks; i++) {
    const v = sc.step * i, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#e5e9f2" stroke-width="1"${i ? ' stroke-dasharray="2 3"' : ''}/><text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="#94a3b8">${v}</text>`;
  }
  const rTop = (x, y0, w, h) => { const r = Math.min(4, h, w / 2); return `M${x},${y0 + h}V${y0 + r}Q${x},${y0} ${x + r},${y0}H${x + w - r}Q${x + w},${y0} ${x + w},${y0 + r}V${y0 + h}Z`; };
  const cols = tr.map((t, i) => {
    const x = L + cw * i + (cw - bw) / 2;
    const yOn = y(t.on), hOn = y(0) - yOn;
    const yL = y(t.on + t.late), hL = yOn - yL;
    let marks = '';
    const gap = t.on && t.late ? 2 : 0;
    if (t.late) marks += t.on ? `<path d="${rTop(x, yL, bw, Math.max(0, hL - gap))}" fill="${C_LATE}"/>` : `<path d="${rTop(x, yL, bw, hL)}" fill="${C_LATE}"/>`;
    if (t.on) marks += t.late ? `<rect x="${x}" y="${yOn}" width="${bw}" height="${hOn}" fill="${C_GOOD}"/>` : `<path d="${rTop(x, yOn, bw, hOn)}" fill="${C_GOOD}"/>`;
    const lbl = `<text x="${x + bw / 2}" y="${H - 22}" text-anchor="middle" font-size="11" fill="${t.cur ? '#0f172a' : '#64748b'}" font-weight="${t.cur ? 700 : 400}">${esc(t.label.top)}</text>` + (t.label.sub ? `<text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="#94a3b8">${esc(t.label.sub)}</text>` : '');
    const top = t.cur && t.n ? `<text x="${x + bw / 2}" y="${yL - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">${t.n}</text>` : '';
    return `<g class="col" data-i="${i}"><rect class="hit" x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T - B}" fill="transparent"/>${marks}${top}${lbl}</g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ավարտված թասքերի դինամիկա">${g}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="#cbd5e1"/>${cols}</svg>`;
}

      return `<div style="margin:3px 0"><span class="tag">${esc(code)}</span> ${now}${nx}${sk}</div>`;
    }).join('');

}

function showDiag(name, r) {
  const d = r.diag || [];
  if (!d.length) { toast('Պահպանված է', 'ok'); return; }
  const rows = d.map(x => {
    let st;
    if (x.problem) st = `<span style="color:var(--red)">⚠ ${esc(x.problem)}</span>`;
    else {
      const parts = [];
      if (x.created && x.created.length) parts.push(`<span style="color:var(--green)">✔ ստեղծվեց՝ ${esc(x.created.join(', '))}</span>`);
      else if (x.open) parts.push(`<span class="muted">բաց թասք արդեն կա (${x.open})</span>`);
      if (x.skipped) parts.push(`<span class="muted">↷ ${x.skipped.n} հին ժամանակաշրջան (${esc(x.skipped.from)} – ${esc(x.skipped.to)}) բաց թողնվեց՝ ժամկետն անցել է</span>`);
      if (x.next) parts.push(`հաջորդը՝ <b>${esc(x.next.label)}</b>, կհայտնվի <b>${esc(x.next.date)}</b>, ժամկետ ${esc(x.next.due)}`);
      st = parts.join('<br>') || '<span class="muted">—</span>';
    }
    return `<tr><td><b>${esc(x.code)}</b><div class="muted" style="font-size:12px">${esc(x.name || '')}${x.period ? ' · ' + esc(x.period) : ''}</div></td><td>${st}</td></tr>`;
  }).join('');
  openModal('Պահպանված է՝ ' + name, `<p class="muted" style="margin-top:0">Ամեն հաշվետվության թասքը հայտնվում է ժամանակաշրջանի ավարտին հաջորդող օրը։</p>
    <table class="tbl" style="box-shadow:none;border:1px solid var(--line)"><thead><tr><th>Հաշվետվություն</th><th>Կարգավիճակ</th></tr></thead><tbody>${rows}</tbody></table>`, null, { okOnly: true, wide: true });
}

function readB64(f) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(new Error('Չհաջողվեց կարդալ ' + f.name)); r.readAsDataURL(f); });
}
async function uploadFiles(files) {
  if (!S.drawer || !files.length) return;
  const id = S.drawer.id, st = () => $('#upSt'); let n = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (f.size > 25 * 1048576) { toast(`«${esc(f.name)}» ֆայլը մեծ է 25 ՄԲ-ից`, 'err'); continue; }
    if (st()) st().textContent = `Բեռնվում է ${i + 1}/${files.length}՝ ${f.name}…`;
    try {
      const data = await readB64(f);
      const r = await call('uploadFile', { taskId: id, file: { name: f.name, mime: f.type, data } }, { silent: true });
      n++; if (S.drawer && S.drawer.id === id) { S.drawer.data.files = r.files; renderDrawer(); }
    } catch (e) { toast(esc(e.message), 'err'); }
  }
  if (st()) st().textContent = '';
  if (n) toast('📎 Կցված է ' + n + ' ֆայլ', 'ok');
}

/** Պատճենում է տեքստը (աշխատում է նաև Apps Script-ի iframe-ում) */
function copyText(t) {
  let ok = false;
  try {
    const ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
  } catch (e) {}
  if (!ok && navigator.clipboard) { try { navigator.clipboard.writeText(t); ok = true; } catch (e) {} }
  return ok;
}

function dueText(r) {

  if (r.period === 'Տարեկան' && off >= 1 && off <= 12) return `հաջորդ տարվա ${MONTHS_FULL[off - 1].toLowerCase()}ի ${r.dueDay}-ը`;
  if (off === 0) return `ժամանակաշրջանի վերջին ամսվա ${r.dueDay}-ը`;
  if (off === 1) return `${unit} հաջորդող ամսվա ${r.dueDay}-ը`;
  return `ավարտից ${off}-րդ ամսվա ${r.dueDay}-ը`;
}
function rtPreview(r) {

}

    if (preset.msgId) { if (TEAMCHAT) TEAMCHAT.refresh(); toast('Թասքը ստեղծված է' + (preset.fromClient ? ' · հաճախորդը կտեսնի այն իր «Անելիքներ»-ում' : ''), 'ok'); }
    toast(`✔ Թասքը ստեղծվեց և ուղարկվեց ${esc(t.assignee)}-ին`, 'ok');
    S.d.tasks.push(t);
    renderShell(); renderView();
  }, { submit: 'Ստեղծել թասքը', wide: true });
  m.querySelectorAll('input[name=priority]').forEach(r => r.onchange = () => { m.querySelector('[name=due]').value = dueForPrio(r.value); });

async function openTask(id) {

  if (S.drawer && S.drawer.id === id) { loadDrawer(id, true); return; }
  closeNotifs();
  const local = S.d.tasks.find(t => t.id === id) || (S.arch && S.arch.rows.find(t => t.id === id));
  S.drawer = { id, data: local ? { task: Object.assign({ archived: !S.d.tasks.some(t => t.id === id) }, local), comments: null, history: null, files: null } : null };
  if (S.drawer.data) renderDrawer(); else $('#drawer').innerHTML = `<div class="db"><div class="muted">Բեռնվում է…</div></div>`;

    const i = S.d.tasks.findIndex(t => t.id === id);

/** Փոփոխությունը պահվում է տեղում, մինչև «Պահպանել» սեղմելը */
function stageEdit(k, v, quiet) {
  if (!S.drawer || !S.drawer.data) return;
  const E = S.drawer.edit || (S.drawer.edit = {});
  const orig = S.drawer.data.task[k];
  const same = k === 'participants' ? splitList(orig).join(', ') === v.join(', ') : String(orig == null ? '' : orig) === String(v);
  const had = Object.keys(E).length;
  if (same) delete E[k]; else E[k] = v;
  // տեքստային դաշտերում գրելիս ամբողջը չենք վերանկարում (որ կուրսորը չկորչի)
  if (quiet && !!had === !!Object.keys(E).length) { const el = k === 'title' ? $('#dTitle') : $('#dDesc'); if (el) el.classList.toggle('dirty', !same); return; }
  renderDrawer();
}
function isDirty() { return !!(S.drawer && S.drawer.edit && Object.keys(S.drawer.edit).length); }
async function confirmDiscard() { return !isDirty() || NxDlg.confirm('Կան չպահպանված փոփոխություններ\nՇարունակե՞լ առանց պահպանելու։', { ok: 'Չպահպանել', cancel: 'Մնալ', danger: true }); }
async function saveTask(extra) {
  if (!S.drawer) return;
  const patch = Object.assign({}, S.drawer.edit || {}, extra || {});
  if (!Object.keys(patch).length) return;
  if (patch.status && ARCHIVE_ST.includes(patch.status) && !(await NxDlg.confirm(`Նշե՞լ «${patch.status}»\nԹասքը կտեղափոխվի արխիվ։`, { ok: 'Այո, ' + patch.status, danger: false }))) return;
  const keep = S.drawer.edit;
  S.drawer.edit = {};
  const ok = await patchTask(patch, '✔ Պահպանված է');
  if (!ok && S.drawer) { S.drawer.edit = keep; renderDrawer(); }
}
const ARCHIVE_ST = ['Ավարտված', 'Ուղարկված է'];
async function patchTask(patch, okMsg) {
  const id = S.drawer.id;
  // օպտիմիստական թարմացում՝ էկրանը փոխվում է անմիջապես, սերվերը հաստատում է հետո
  const i0 = S.d.tasks.findIndex(x => x.id === id);
  const before = i0 >= 0 ? Object.assign({}, S.d.tasks[i0]) : null;
  const local = Object.assign({}, patch);
  if (local.participants) local.participants = local.participants.join(', ');
  const willArchive = patch.status && ARCHIVE_ST.includes(patch.status);
  if (before && !willArchive) {
    Object.assign(S.d.tasks[i0], local);
    Object.assign(S.drawer.data.task, local);
    renderDrawer(); renderView();
  }
  try {
    const t = await call('updateTask', { id, patch }, { silent: !willArchive });
    const i = S.d.tasks.findIndex(x => x.id === id);
    if (t.archived) {
      if (i >= 0) S.d.tasks.splice(i, 1);
      toast('🗄 ' + esc(t.status) + ' — տեղափոխվեց արխիվ', 'ok');
      S.arch = null; closeDrawer();
    } else {
      if (i >= 0) S.d.tasks[i] = t;
      if (S.drawer && S.drawer.id === id) { S.drawer.data.task = Object.assign(S.drawer.data.task, t); renderDrawer(); }
      if (okMsg) toast(okMsg, 'ok');
    }
    renderShell(); renderView();
    return true;
  } catch (e) {
    toast(esc(e.message), 'err');
    if (before) { const i = S.d.tasks.findIndex(x => x.id === id); if (i >= 0) S.d.tasks[i] = before; if (S.drawer && S.drawer.id === id) Object.assign(S.drawer.data.task, before); renderView(); }
    renderDrawer();
    return false;
  }
}
async function sendComment() {
  const ct = $('#cText'); const text = ct.value.trim(); if (!text) return;
  ct.disabled = true;
  try {
    const id = S.drawer.id;
    const r = await call('addComment', { id, text }, { silent: true });
    if (!S.drawer || S.drawer.id !== id) return;
    ct.value = '';
    (S.drawer.data.comments || (S.drawer.data.comments = [])).push(r.comment);
    const st = S.d.commentStats[id] || (S.d.commentStats[id] = { count: 0, unread: 0 });
    st.count++;
    const i = S.d.tasks.findIndex(x => x.id === id);
    if (i >= 0) S.d.tasks[i] = Object.assign(S.d.tasks[i], r.task);
    S.drawer.data.task = Object.assign(S.drawer.data.task, r.task);
    S.drawer.data.history = null;
    renderDrawer(); renderView();
    scrollComments();
    setTimeout(() => { const n = $('#cText'); if (n) n.focus(); }, 30);
  } catch (e) { toast(esc(e.message), 'err'); ct.disabled = false; }
}

function closeNotifs() { $('#npanel').classList.remove('on'); }
function renderNotifPanel() {
  const list = S.d.notifs;
  $('#npanel').innerHTML = `<div class="nh">Ծանուցումներ<button class="btn sm" data-act="readAll">Նշել բոլորը կարդացված</button></div>

/* ====================== MODAL ====================== */
function formData(root) {
  const o = {};
  root.querySelectorAll('input[name],select[name],textarea[name]').forEach(el => {
    if (el.type === 'checkbox') { if (el.closest('.pick,.multi')) { if (el.checked) (o[el.name] = o[el.name] || []).push(el.value); } else o[el.name] = el.checked; }
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value;
  });
  return o;
}
function openModal(title, body, onSubmit, opts) {
  opts = opts || {};
  const m = $('#modal');
  m.innerHTML = `<form class="mbox ${opts.wide ? 'wide' : ''}" novalidate>
    <div class="mh"><h3>${esc(title)}</h3><button type="button" class="iconbtn" data-act="closeModal">${ico('x')}</button></div>
    <div class="mb">${body}<div class="lerr" id="mErr"></div></div>
    <div class="mf">${opts.extra || ''}${opts.okOnly ? '<button type="button" class="btn primary" data-act="closeModal">Լավ</button>' : `<button type="button" class="btn" data-act="closeModal">Չեղարկել</button><button type="submit" class="btn primary">${esc(opts.submit || 'Պահպանել')}</button>`}</div>
  </form>`;
  m.classList.add('on');
  const form = m.querySelector('form');
  form.onsubmit = async e => {
    e.preventDefault();
    if (!onSubmit) return closeModal();
    const req = [...form.querySelectorAll('[required]')].find(x => !x.value.trim());
    if (req) { req.focus(); $('#mErr').textContent = 'Լրացրեք պարտադիր դաշտերը'; return; }
    const btn = form.querySelector('[type=submit]'); btn.disabled = true; $('#mErr').textContent = '';
    try { await onSubmit(formData(form)); closeModal(); }
    catch (err) { $('#mErr').textContent = err.message; btn.disabled = false; }
  };
  return form;
}
function closeModal() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }

document.addEventListener('click', e => {
  unlockAudio();
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('#npanel')) closeNotifs(); return; }
  if (el.dataset.act !== 'toggleNotifs' && !el.closest('#npanel')) closeNotifs();
  if (el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.act];
  if (fn) {
    try { const r = fn(el, e); if (r && r.catch) r.catch(err => { console.error(err); toast(esc(err.message || String(err)), 'err'); }); }
    catch (err) { console.error(err); toast('Սխալ՝ ' + esc(err.message || String(err)) + ' (' + esc(el.dataset.act) + ')', 'err'); }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'docComp') { S.docComp = el.value; S.docMark = {}; renderView(); return; }
  if (el.hasAttribute && el.hasAttribute('data-markall')) { const L = (S.docList || {})[S.docComp]; S.docMark = {}; if (el.checked && L) L.files.forEach(f => { S.docMark[f.fid] = true; }); renderView(); return; }
  if (el.dataset.mark) { S.docMark = S.docMark || {}; S.docMark[el.dataset.mark] = el.checked; renderView(); return; }
  if (el.dataset.chg) {
    const k = el.dataset.chg, v = el.type === 'checkbox' ? el.checked : el.value;
    if (k === 'sound') { lsSet('nx_sound', v ? '1' : '0'); return; }
    const [o, f] = k.split('.');
    S[o][f] = v;
    if (o === 'af') { S.arch = null; renderView(); return; }
    renderView(); return;
  }
  if (el.dataset.dchg && S.drawer) {
    const k = el.dataset.dchg;
    if (k === 'addPart') { if (!el.value) return; const E = S.drawer.edit || {}; const cur = E.participants || splitList(S.drawer.data.task.participants); stageEdit('participants', cur.concat(el.value)); return; }
    stageEdit(k, el.value);
  }
});
let rzTimer;
window.addEventListener('resize', () => { clearTimeout(rzTimer); rzTimer = setTimeout(() => { if (S.d && S.view === 'stats' && S.stats) renderView(); }, 250); });
let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value; if (S.view === 'archive') { S.arch = null; } renderView(); }, 200); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.msOpen) closeMs(); else if ($('#modal').classList.contains('on')) closeModal(); else if (S.drawer) ACT.closeDrawer(); else closeNotifs(); }
});

/* ====================== start ====================== */
(function init() {
  S.token = lsGet('nx_token', null);
  if (S.token) boot(); else showLogin();
})();

(function () { var b = document.getElementById('nxboot'); if (b) b.remove(); })();
</script>
