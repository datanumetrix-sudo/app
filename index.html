<script>
/* NXCHAT:BEGIN — ավտոմատ տեղադրված src/chat.js-ից */
/* ============== NxFb — Firebase-ի միացում (իրական ժամանակի չաթ) ==============
   Apps Script-ը տալիս է ժամանակավոր բանալի (fbToken), հավելվածը ուղղակիորեն լսում/գրում է Firestore-ում։
   Եթե Firebase-ը կարգավորված չէ կամ չի բեռնվում, ամեն ինչ աշխատում է նախկին եղանակով։ */
const NxFb = (function () {
  const VERS = ['12.0.0', '11.10.0', '10.14.1'];
  const st = { p: null, on: false, me: null, skew: 0, tz: 240, db: null, F: null, app: null, A: null, gen: 0 };
  const p2 = n => String(n).padStart(2, '0');
  async function load() {
    let err;
    const list = window.NX_FB_BASE ? [window.NX_FB_BASE] : VERS.map(v => 'https:' + '/' + '/www.gstatic.com/firebasejs/' + v + '/');
    for (const b of list) {
      try {
        const [A, U, F] = await Promise.all([import(b + 'firebase-app.js'), import(b + 'firebase-auth.js'), import(b + 'firebase-firestore.js')]);
        return { A, U, F };
      } catch (e) { err = e; }
    }
    throw err || new Error('Firebase SDK');
  }
  function start(call) {
    if (st.p) return st.p;
    const gen = ++st.gen;
    st.p = (async () => {
      const t = await call('fbToken', {});
      if (!t || t.off || gen !== st.gen) return false;
      const { A, U, F } = await load();
      const app = A.initializeApp(t.cfg, 'nx' + gen + '-' + Date.now());
      const auth = U.initializeAuth(app, { persistence: U.inMemoryPersistence });
      await U.signInWithCustomToken(auth, t.token);
      if (gen !== st.gen) { try { A.deleteApp(app); } catch (e) {} return false; }
      Object.assign(st, { app, A, F, db: F.initializeFirestore(app, { experimentalAutoDetectLongPolling: true }), me: t.me, skew: (+t.now || Date.now()) - Date.now() });
      const m = String(t.tz || '+0400').match(/([+-])(\d\d)(\d\d)/); st.tz = m ? (m[1] === '-' ? -1 : 1) * (+m[2] * 60 + +m[3]) : 240;
      st.on = true;
      return true;
    })().catch(e => {
      try { console.warn('Firebase-ը չմիացավ', e); } catch (x) {}
      st.on = false; st.err = String(e && e.message || e);
      // 2 րոպե հետո կրկին կփորձի
      setTimeout(() => { if (gen === st.gen && !st.on) st.p = null; }, 120000);
      return false;
    });
    return st.p;
  }
  function stop() {
    st.gen++; st.p = null; st.on = false;
    if (st.app && st.A) { try { st.A.deleteApp(st.app); } catch (e) {} }
    st.app = null; st.db = null;
  }
  const now = () => Date.now() + st.skew;
  function nowStr() { const d = new Date(now() + st.tz * 60000); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()); }
  const path = (cid, owner, thread) => ['co', String(cid), 'u', String(owner), 'th', String(thread)];
  const newId = () => 'W-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const side = () => st.me && st.me.s === 't' ? 'team' : 'client';
  function listenMsgs(pth, sinceMs, cb) {
    const F = st.F;
    const q = F.query(F.collection(st.db, ...pth, 'm'), F.where('u', '>', F.Timestamp.fromMillis(sinceMs)));
    return F.onSnapshot(q, snap => cb(snap.docChanges().map(ch => ({ type: ch.type, id: ch.doc.id, d: ch.doc.data({ serverTimestamps: 'estimate' }) }))), err => cb(null, err));
  }
  function listenDoc(pth, cb) {
    const F = st.F;
    return F.onSnapshot(F.doc(st.db, ...pth), s => cb(s.exists() ? s.data() : null), () => {});
  }
  /** Ազդանշան (sig/team կամ sig/<կազմ.>)՝ նոր հաղորդագրության մասին. առաջին վիճակը բաց է թողնվում */
  function onSig(key, cb) {
    if (!st.on) return () => {};
    const F = st.F; let first = true;
    return F.onSnapshot(F.doc(st.db, 'sig', String(key)), s => { if (first) { first = false; return; } cb(s.exists() ? s.data() : null); }, () => {});
  }
  function withTimeout(pr, ms) { return Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
  function send(pth, id, msg, cid, thread) {
    const F = st.F, b = F.writeBatch(st.db), ts = F.serverTimestamp();
    b.set(F.doc(st.db, ...pth, 'm', id), Object.assign({}, msg, { u: ts }));
    b.set(F.doc(st.db, ...pth), { ty: { [st.me.k]: { n: st.me.n, s: st.me.s, at: 0 } }, u: ts }, { merge: true });
    const sg = { t: String(thread), at: now(), s: st.me.s, u: ts };
    b.set(F.doc(st.db, 'sig', 'team'), sg);
    b.set(F.doc(st.db, 'sig', String(cid)), sg);
    return withTimeout(b.commit(), 6000);
  }
  function typing(pth) {
    const F = st.F;
    return F.setDoc(F.doc(st.db, ...pth), { ty: { [st.me.k]: { n: st.me.n, s: st.me.s, at: now() } }, u: F.serverTimestamp() }, { merge: true }).catch(() => {});
  }
  function markRead(pth, ids) {
    const F = st.F, b = F.writeBatch(st.db), ts = F.serverTimestamp(), fl = st.me.s === 't' ? 'rt' : 'rc';
    ids.slice(0, 400).forEach(id => b.update(F.doc(st.db, ...pth, 'm', id), { [fl]: true, u: ts }));
    return b.commit().catch(() => {});
  }
  return {
    start, stop, now, nowStr, path, newId, side, listenMsgs, listenDoc, onSig, send, typing, markRead,
    ready: () => st.p || Promise.resolve(false),
    on: () => st.on, me: () => st.me, err: () => st.err || ''
  };
})();

/* ============== NxChat — ընդհանուր չաթ (օգտագործվում է և՛ թիմի, և՛ հաճախորդի էջում) ==============
   NxChat.mount(el, { thread, side, call, onConvert, convertLabel, canConvert, onInfo, compact })
   call(action, payload) → Promise<data> */
const NxChat = (function () {
  const CSS = `
.nxc{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--nxc-bg,#eef2f8);border-radius:inherit;position:relative;font-size:14.5px}
.nxc *{box-sizing:border-box}
.nxc-top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel,#fff);border-bottom:1px solid var(--line,#e5e9f2)}
.nxc-top .t{flex:1;min-width:0;font-size:13px;color:var(--muted,#64748b)}
.nxc-top button{border:1px solid var(--line,#e5e9f2);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:inherit}
.nxc-top button.on{background:var(--brand,#2457f5);color:#fff;border-color:transparent}
.nxc-top input{flex:1;min-width:0;border:1px solid var(--line,#e5e9f2);border-radius:8px;padding:6px 10px;font:inherit;font-size:13.5px}
.nxc-list{flex:1;min-height:0;overflow-y:auto;padding:10px 12px 6px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.nxc-day{align-self:center;background:rgba(15,23,42,.06);color:#475569;font-size:11.5px;font-weight:600;border-radius:10px;padding:2px 10px;margin:8px 0 4px}
.nxc-sys{align-self:center;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:12.5px;border-radius:10px;padding:5px 12px;margin:6px 0;max-width:90%;text-align:center}
.nxc-m{display:flex;flex-direction:column;max-width:82%;align-self:flex-start;position:relative;margin-top:2px}
.nxc-m.nxc-me{align-self:flex-end;align-items:flex-end}
.nxc-b{background:#fff;border-radius:14px;border-bottom-left-radius:4px;padding:6px 10px 4px;box-shadow:0 1px 1px rgba(15,23,42,.08);position:relative;min-width:72px;max-width:100%}
.nxc-m.nxc-me .nxc-b{background:var(--nxc-me,#d9e6ff);border-bottom-left-radius:14px;border-bottom-right-radius:4px}
.nxc-m.flash .nxc-b{animation:nxcFlash 1.4s}
@keyframes nxcFlash{0%,60%{box-shadow:0 0 0 3px #fbbf24}}

    /* ---------- գրելու դաշտ ---------- */

          <button class="nxc-ib ${draft.trim() || S.files.length || S.edit ? 'nxc-send' : ''}" data-a="${draft.trim() || S.files.length || S.edit ? 'send' : 'mic'}" title="${draft.trim() || S.files.length || S.edit ? 'Ուղարկել' : 'Ձայնային հաղորդագրություն'}">${S.busy ? '⏳' : (draft.trim() || S.files.length || S.edit ? '➤' : '🎤')}</button>
        </div>
        <input type="file" data-f="cam" accept="image/${'*'}" capture="environment" hidden>

        fit();

        if (Date.now() - S.typingAt > 3000 && ta.value.trim()) { S.typingAt = Date.now(); if (S.fbPath && NxFb.on()) NxFb.typing(S.fbPath); else call('chatTyping', { thread: o.thread }).catch(() => {}); }

    async function addFiles(fl) {
      S.err = '';
      const max = (S.info && S.info.maxFileMb) || 25;
      for (let f of [...fl]) {
        if (S.files.length >= 10) { S.err = 'Առավելագույնը 10 ֆայլ'; break; }
        f = await shrinkImage(f);
        if (f.size > max * 1048576) { S.err = `«${f.name}» ֆայլը մեծ է ${max} ՄԲ-ից${/^video/.test(f.type) ? '։ Նկարեք ավելի կարճ տեսանյութ։' : ''}`; continue; }
        if (S.files.reduce((a, x) => a + x.size, 0) + f.size > 45 * 1048576) { S.err = 'Մեկ անգամում՝ մինչև 45 ՄԲ'; break; }
        S.files.push(f);
      }
      drawComposer();
    }
    function attachMenu() {

    /** Արագ ուղարկում Firebase-ով (միայն տեքստ)՝ մյուս կողմը տեսնում է անմիջապես, աղյուսակում պահվում է զուգահեռ */
    async function sendFast(text) {
      const id = NxFb.newId(), me = NxFb.me(), sd = NxFb.side(), at = NxFb.nowStr(), replyTo = S.reply ? S.reply.id : '';
      const msg = { author: me.n, side: sd, x: me.x || '', text, at, replyTo, files: [], edited: false, deleted: false, reactions: {}, rt: sd === 'team', rc: sd === 'client' };
      S.pend.set(id, { id, author: me.n, side: sd, text, at, replyTo, files: [], edited: false, deleted: false, reactions: {}, mine: true, read: false, pending: true });
      S.reply = null; S.err = ''; S.typingAt = 0;
      $r('cmp').innerHTML = ''; drawComposer(); setMsgs(true);
      const t2 = $r('cmp').querySelector('textarea'); if (t2 && !('ontouchstart' in window)) t2.focus();
      let ok = true;
      try { await NxFb.send(S.fbPath, id, msg, S.info.companyId, o.thread); } catch (e) { ok = false; }
      const payload = { thread: o.thread, text, replyTo, fid: id, fat: at };
      if (!ok) {
        // Firebase-ը չաշխատեց՝ ուղարկում ենք սովորական ճանապարհով (նույն ID-ով, կրկնօրինակ չի լինի)
        try { const r = await call('chatSend', Object.assign(payload, { push: 1 })); S.pend.delete(id); apply(r, true); }
        catch (e) { S.pend.delete(id); setMsgs(); S.err = e.message; drawComposer(); const t = $r('cmp').querySelector('textarea'); if (t && !t.value) t.value = text; }
        return;
      }
      for (let i = 0; i < 4; i++) {
        try { await call('chatSend', Object.assign({}, payload, { lite: 1 })); return; }
        catch (e) { if (/AUTH|հասանելի չէ|չի գտնվել|Սխալ/.test(e.message) || i === 3) { S.err = 'Հաղորդագրությունը չպահպանվեց աղյուսակում՝ ' + e.message; drawComposer(); return; } await new Promise(r => setTimeout(r, 2000 * (i + 1))); }
      }
    }
    async function send() {
      const ta = $r('cmp').querySelector('textarea'); const text = ta ? ta.value.trim() : '';
      if (S.busy || (!text && !S.files.length)) return;
      if (!S.edit && !S.files.length && S.fbPath && NxFb.on() && S.info) return sendFast(text);
      S.busy = true; S.err = ''; drawComposer();
      try {
        let r;
        if (S.edit) r = await call('chatEdit', { id: S.edit.id, text });
        else {
          const files = await Promise.all(S.files.map(async f => ({ name: f.name, mime: f.type, data: await readB64(f) })));
          r = await call('chatSend', { thread: o.thread, text, files, replyTo: S.reply ? S.reply.id : '' });
        }
        S.files = []; S.reply = null; S.edit = null; S.busy = false;
        $r('cmp').innerHTML = ''; apply(r, true); drawComposer();
        const t2 = $r('cmp').querySelector('textarea'); if (t2 && !('ontouchstart' in window)) t2.focus();
      } catch (e) { S.busy = false; S.err = e.message; drawComposer(); }
    }
    async function startRec() {
      let stream;
      try {
        if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('nosupport');
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        if (e && e.name === 'NotAllowedError') { S.err = 'Միկրոֆոնի թույլտվությունը տրված չէ (միացրեք բրաուզերի/հեռախոսի կարգավորումներում)'; drawComposer(); return; }
        root.querySelector('[data-f="aud"]').click(); return;
      }
      const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
      const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined), chunks = [], t0 = Date.now();
      let cancel = false;
      S.rec = mr; drawComposer();
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      const tm = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000), el = $r('rt'); if (el) el.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); if (s >= 300) mr.stop(); }, 250);
      mr.onstop = async () => {
        stream.getTracks().forEach(t => t.stop()); clearInterval(tm); S.rec = null;
        if (cancel || !chunks.length || Date.now() - t0 < 700) { drawComposer(); return; }
        const type = (mr.mimeType || mime || 'audio/webm').split(';')[0], ext = /mp4/.test(type) ? 'm4a' : /ogg/.test(type) ? 'ogg' : 'webm';
        S.files = [new File(chunks, `Ձայնային-${stamp()}.${ext}`, { type })];
        drawComposer(); send();
      };
      root.querySelector('[data-a=rx]').onclick = () => { cancel = true; mr.stop(); };
      root.querySelector('[data-a=rs]').onclick = () => mr.stop();
      mr.start(1000);
    }

function stamp() { const d = new Date(), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; }
let REC = null;
function bindMedia(listKey, p, flId, errId, max, dropId) {
  const er = () => $('#' + errId);
  const draw = () => {
    $('#' + flId).innerHTML = CL[listKey].map((f, i) => `<div class="fitem">${/^image[/]/.test(f.type) ? `<img class="th" src="${objUrl(f)}">` : /^video[/]/.test(f.type) ? `<video class="th" src="${objUrl(f)}" muted playsinline></video>` : fileIcon(f.type)}
      ${/^audio[/]/.test(f.type) ? `<audio controls src="${objUrl(f)}"></audio>` : `<span>${esc(f.name)}</span>`}<small style="color:var(--muted);margin-left:auto">${fmtSize(f.size)}</small><button type="button" data-i="${i}">×</button></div>`).join('');
    $('#' + flId).querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { CL[listKey].splice(+b.dataset.i, 1); draw(); });
  };
  const add = async list => {
    if (er()) er().textContent = '';
    for (let f of [...list]) {
      if (CL[listKey].length >= max) { if (er()) er().textContent = 'Առավելագույնը ' + max + ' ֆայլ'; break; }
      f = await shrinkImage(f);
      if (f.size > CL.v.maxFileMb * 1048576) { if (er()) er().textContent = `«${f.name}» ֆայլը մեծ է ${CL.v.maxFileMb} ՄԲ-ից${/^video[/]/.test(f.type) ? '։ Նկարեք ավելի կարճ տեսանյութ կամ ուղարկեք մասերով։' : ''}`; continue; }
      if (CL[listKey].reduce((a, x) => a + x.size, 0) + f.size > 45 * 1048576) { if (er()) er().textContent = 'Մեկ անգամում՝ մինչև 45 ՄԲ։ Ուղարկեք մասերով։'; break; }
      CL[listKey].push(f);
    }
    draw();
  };
  ['cam', 'vid', 'gal', 'any', 'aud'].forEach(k => { const fi = $('#' + p + k); if (fi) fi.onchange = () => { add(fi.files); fi.value = ''; }; });
  document.querySelectorAll(`[data-pick^="${p}"]`).forEach(b => b.onclick = () => $('#' + b.dataset.pick).click());
  const mic = $('#' + p + 'mic'); if (mic) mic.onclick = () => startRec(p, f => add([f]));
  const drop = dropId && $('#' + dropId);
  if (drop) {
    drop.onclick = () => $('#' + p + 'any').click();
    drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
    drop.ondragleave = () => drop.classList.remove('on');
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); add(e.dataTransfer.files); };
  }
  draw();
}
/** Ձայնագրություն միկրոֆոնով (չստացվելու դեպքում՝ հեռախոսի ձայնագրիչ) */
async function startRec(p, done) {
  if (REC) return;
  const box = $('#' + p + 'rec');
  let stream;
  try {
    if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('nosupport');
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    const fi = $('#' + p + 'aud');
    if (e && e.name === 'NotAllowedError') { alert('Միկրոֆոնի թույլտվությունը տրված չէ։ Միացրեք այն հեռախոսի/բրաուզերի կարգավորումներում կամ ձայնագրեք հեռախոսի ձայնագրիչով և կցեք որպես ֆայլ։'); return; }
    if (fi) fi.click(); return;
  }
  const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/webm'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
  const mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined), chunks = [];
  let cancel = false; const t0 = Date.now();
  REC = mr;
  mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(tm); box.classList.add('hidden'); REC = null;
    if (cancel || !chunks.length) return;
    const type = (mr.mimeType || mime || 'audio/webm').split(';')[0], ext = /mp4/.test(type) ? 'm4a' : /ogg/.test(type) ? 'ogg' : 'webm';
    done(new File(chunks, `Ձայնային-${stamp()}.${ext}`, { type }));
  };
  box.classList.remove('hidden');
  const tm = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000); $('#' + p + 'rt').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    if (s >= 300) mr.stop();   // առավելագույնը 5 րոպե
  }, 250);
  $('#' + p + 'rs').onclick = () => mr.stop();
  $('#' + p + 'rx').onclick = () => { cancel = true; mr.stop(); };
  mr.start(1000);
}
function clBindNew() {
  bindMedia('files', 'n', 'fl', 'nerr', 10, 'drop');
  $('#nf').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target).entries()), go = $('#ngo'), er = $('#nerr');
    if (!d.companyId) { er.textContent = 'Ընտրեք կազմակերպությունը'; return; }
    if (!d.title.trim()) { er.textContent = 'Գրեք, թե ինչ է պետք անել'; return; }
    go.disabled = true; go.textContent = CL.files.length ? 'Ֆայլերը բեռնվում են…' : 'Ուղարկվում է…'; er.textContent = '';
    try {
      d.files = await Promise.all(CL.files.map(async f => ({ name: f.name, mime: f.type, data: await readB64(f) })));
      lsSet('nx_client_comp', d.companyId);
      const r = await ccall('clientSubmit', d);
      CL.v = r.view; CL.files = []; CL.filter = 'open'; CL.screen = 'home';
      toastC('✔ Ուղարկված է։ Կարգավիճակին և պատասխաններին կարող եք հետևել այստեղ։'); clOpen(r.id);
    } catch (ex) { er.textContent = ex.message; go.disabled = false; go.textContent = 'Ուղարկել'; }
  };
}
function toastC(t) {
  const d = document.createElement('div'); d.className = 'ok'; d.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;box-shadow:0 6px 20px rgba(0,0,0,.15);max-width:90vw';
  d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4000);
}
let CHAT = null;
function clOpen(thread) {
  const v = CL.v, r = v.requests.find(x => x.id === thread), c = v.chats.find(x => x.thread === thread);
  if (!r && !c) return;
  CL.screen = 'chat'; CL.thread = thread;
  if (CHAT) { CHAT.destroy(); CHAT = null; }
  const title = r ? r.title : c.companyName;
  const sub = r ? `${esc(r.companyName)} · ${esc(r.id)}` : 'Չաթ Numetrix-ի հետ';
  $('#root').innerHTML = `<div class="chatpage">
    <div class="chbar"><button class="lnk" id="bk" style="font-size:22px;padding:0 6px">←</button><div class="av">${esc(initials(r ? r.companyName : c.companyName))}</div>
      <div style="flex:1;min-width:0"><div class="t ell">${esc(title)}</div><div class="m ell" id="chsub">${sub}</div></div>
      ${r ? '<button class="btn2" id="inf" style="padding:6px 10px">ℹ</button>' : ''}</div>
    ${r ? `<div class="chinfo" id="chinfo" style="display:none">${stPill(r.status)}${r.description ? `<p style="white-space:pre-wrap;margin:8px 0 0">${esc(r.description)}</p>` : ''}${r.link ? `<p style="margin:6px 0 0">🔗 <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a></p>` : ''}${r.due ? `<p class="m" style="margin:6px 0 0">Ցանկալի ժամկետ՝ ${esc(fmtDT(r.due))}</p>` : ''}${r.note ? `<p style="margin:6px 0 0">💬 ${esc(r.note)}</p>` : ''}<p class="m" style="margin:6px 0 0">Ուղարկվել է՝ ${esc(fmtDT(r.createdAt))}</p></div>` : ''}
    <div class="chbody" id="chbox"></div></div>`;
  $('#bk').onclick = clBack;
  const inf = $('#inf'); if (inf) inf.onclick = () => { const x = $('#chinfo'); x.style.display = x.style.display === 'none' ? '' : 'none'; };
  CHAT = NxChat.mount($('#chbox'), {
    thread, side: 'client', call: ccall, meName: v.me.name,
    emptyText: r ? 'Այստեղ կարող եք գրել հարցեր և ուղարկել լրացուցիչ նկարներ, փաստաթղթեր, ձայնային այս անելիքի վերաբերյալ։' : 'Գրեք մեզ ցանկացած հարց, ուղարկեք նկար, տեսանյութ, ձայնային 👋',
    topText: i => i && i.req ? `${stPill(i.req.status)}` : '',
    onInfo: i => { if (i.req) { const p = document.querySelector('#chinfo .pill'); if (p) p.outerHTML = stPill(i.req.status); } },
    canConvert: (m, i) => i && i.kind === 'G' && m.mine && m.side === 'client' && !m.deleted,
    convertLabel: '📋 Դարձնել անելիք',
    onConvert: async (m, i) => {
      if (!confirm('Ստեղծե՞լ անելիք այս հաղորդագրությունից։ Այն կհայտնվի «Անելիքներ» բաժնում, և կկարողանաք հետևել կատարմանը։')) return;
      const title = (m.text || (m.files[0] ? m.files[0].name : 'Անելիք')).split('\n')[0].slice(0, 200);
      const res = await ccall('clientSubmit', { companyId: i.companyId, title, description: m.text, fromMsg: m.id });
      CL.v = res.view; toastC('✔ Ստեղծվեց անելիք ' + res.id); CHAT.refresh();
    }
  });
}
async function clBack() {
  if (CHAT) { CHAT.destroy(); CHAT = null; }
  CL.screen = 'home'; CL.thread = null;
  try { CL.v = await ccall('clientInfo', {}); } catch (e) {}
  clRender(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', () => { if (CL.screen !== 'home' && CL.v) clBack(); });

async function clLogout() {
  try { await ccall('clientLogout', {}); } catch (e) {}
  if (CHAT) { CHAT.destroy(); CHAT = null; }
  fbStopC();
  CL.tok = ''; CL.v = null; CL.screen = 'home'; CL.thread = null; lsSet('nx_client_tok', ''); clLogin();
}
let clTimer = null;
function homeBusy() { return CL.screen !== 'home' || (CL.q || '').trim() || (document.activeElement && document.activeElement.id === 'gq'); }
function clPoll() {
  clearInterval(clTimer);
  clTimer = setInterval(async () => {
    if (!CL.tok || !CL.v) return;
    try {
      const v = await ccall('clientInfo', {});
      if (JSON.stringify(v) !== JSON.stringify(CL.v)) { notifyChanges(CL.v, v); CL.v = v; if (!homeBusy()) clRender(); }
    } catch (e) {}
  }, 30000);
}
// հավելվածը նորից բացելիս՝ անմիջապես թարմացնել
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !CL.tok || !CL.v) return;
  try { const v = await ccall('clientInfo', {}); if (JSON.stringify(v) !== JSON.stringify(CL.v)) { notifyChanges(CL.v, v); CL.v = v; if (!homeBusy()) clRender(); } } catch (e) {}
});

(async function init() {
  if (!TOKEN) return clientInit();
  try { INFO = await call('portalInfo', {}); render(); }
  catch (e) { $('#root').innerHTML = `<div class="card bad"><div class="big">🔒</div><b>${esc(e.message)}</b></div>`; }
})();

(function () { var b = document.getElementById('nxboot'); if (b) b.remove(); })();
</script>
