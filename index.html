.head h1{margin:0;font-size:20px;line-height:1.2}
.head small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:16px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 6px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:border .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
textarea.inp{resize:vertical;min-height:90px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.drop{border:1.5px dashed #cbd5e1;border-radius:12px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:.15s}
.drop:hover,.drop.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand2)}
.flist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fitem{display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:13px}
.fitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.fitem button:hover{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--brand);color:#fff;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;width:100%}
.btn:hover{background:var(--brand2)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
.ok{background:#ecfdf3;border:1px solid #bbf7d0;color:#166534;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.req{border-top:1px solid var(--line2);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.req:first-child{border-top:0;padding-top:0}
.req .t{font-weight:600}
.req .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.req .note{font-size:13px;background:#f8fafc;border-left:3px solid var(--brand);padding:6px 10px;border-radius:0 8px 8px 0;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;background:color-mix(in srgb,var(--c) 12%,white);color:color-mix(in srgb,var(--c) 80%,black);margin-left:auto;flex:none}
.pill::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c)}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:13.5px}
.bad{text-align:center;padding:40px 20px}
.bad .big{font-size:38px;margin-bottom:8px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top .who{margin-left:auto;text-align:right;font-size:13px;color:var(--muted)}
.top .who b{display:block;color:var(--text);font-size:14px}
.lnk{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.btn2{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13.5px}
.btn2:hover{border-color:#cbd5e1}
.seg{display:inline-flex;background:#eef1f7;border-radius:10px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.it{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.it:hover{background:#f8fafc;border-color:var(--line2)}
.it .t{font-weight:600}
.it .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.un{background:var(--red);color:#fff;border-radius:20px;font-size:11.5px;font-weight:700;padding:1px 8px;margin-left:6px}
.thread{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg small{display:block;font-size:11.5px;opacity:.7;margin-bottom:2px;white-space:normal}
.msg.them{background:#f1f5f9;align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.dl{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:#f8fafc;font-size:13px;cursor:pointer;width:100%;text-align:left}
.dl:hover{border-color:var(--brand)}
.dl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:11.5px;background:var(--brandSoft);color:var(--brand2);border-radius:6px;padding:1px 7px;margin-left:6px;font-weight:600}
.reply{display:flex;gap:8px;align-items:flex-end}
.reply textarea{min-height:44px}
.reply .ic{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px}
.reply .send{flex:none;width:auto;padding:11px 16px}
.mbar{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.mbar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 2px;font-size:11.5px;font-weight:600;color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.mbar button b{font-size:19px;font-weight:400}
.mbar button:active{background:var(--brandSoft)}
.rec{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:12px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-weight:600}
.rec .dot{width:10px;height:10px;border-radius:50%;background:#dc2626;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec button{margin-left:auto;border:0;border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;background:#dc2626;color:#fff}
.rec button.x{margin-left:0;background:#fff;color:#991b1b;border:1px solid #fecaca}
.fitem .th{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:#e2e8f0}
.fitem audio{height:32px;max-width:160px}
.viewer{position:fixed;inset:0;background:rgba(2,6,23,.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.viewer img,.viewer video{max-width:100%;max-height:75vh;border-radius:10px}
.viewer .vb{display:flex;gap:10px}
.viewer .vb button{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.hidden{display:none!important}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#2457f5,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it{align-items:center}
.chatpage{position:fixed;left:0;right:0;top:0;height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--bg);z-index:5}
body.inchat{overflow:hidden;position:fixed;inset:0;width:100%}

<script>
/* NXCHAT:BEGIN — ավտոմատ տեղադրված src/chat.js-ից */
/* Թարգմանություն. հաճախորդի հավելվածը սահմանում է window.NX_T (en/ru), թիմի հավելվածում՝ միշտ հայերեն */
const _t = (s, ...a) => { let r = (typeof window !== 'undefined' && window.NX_T) ? window.NX_T(s) : s; a.forEach((v, i) => { r = r.split('{' + i + '}').join(v); }); return r; };
/* ============== NxDlg — ծրագրի ոճով պատուհաններ (բրաուզերի confirm/alert-ի փոխարեն) ==============
   await NxDlg.confirm('Տեքստ', { title, ok, cancel, danger })  → true/false
   await NxDlg.alert('Տեքստ', { title }) */
const NxDlg = (function () {
  let css = false;
  const CSS = `
.nxd-bg{position:fixed;inset:0;z-index:100000;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;animation:nxdF .15s ease-out;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.nxd{background:#fff;color:#0f172a;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.35);width:100%;max-width:420px;padding:22px 22px 18px;animation:nxdS .18s ease-out;font-family:inherit}
.nxd-h{display:flex;gap:12px;align-items:flex-start}
.nxd-ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#eef3ff;color:#2457f5}
.nxd.danger .nxd-ic{background:#fef2f2;color:#dc2626}
.nxd-t{font-weight:700;font-size:16.5px;line-height:1.35;margin:1px 0 4px}
.nxd-m{font-size:14.5px;line-height:1.5;color:#475569;white-space:pre-wrap;overflow-wrap:anywhere}
.nxd-b{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.nxd-b button{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;min-width:96px}
.nxd-b .c{background:#f1f5f9;color:#334155}
.nxd-b .c:hover{background:#e2e8f0}
.nxd-b .o{background:#2457f5;color:#fff}
.nxd-b .o:hover{filter:brightness(1.08)}
.nxd.danger .nxd-b .o{background:#dc2626}
.nxd-b button:focus-visible{outline:3px solid rgba(36,87,245,.35);outline-offset:2px}
@media (max-width:480px){.nxd-bg{align-items:flex-end;padding:0}.nxd{border-radius:18px 18px 0 0;max-width:none;padding:20px 18px calc(16px + env(safe-area-inset-bottom))}.nxd-b button{flex:1}}
@keyframes nxdF{from{opacity:0}}
@keyframes nxdS{from{opacity:0;transform:translateY(12px) scale(.98)}}`;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function show(msg, o, isConfirm) {
    o = o || {};
    if (!css) { const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st); css = true; }
    // առաջին տողը՝ վերնագիր, մնացածը՝ բացատրություն (եթե title չի տրված)
    let title = o.title, body = String(msg || '');
    if (!title) { const p = body.split('\n'); title = p.shift(); body = p.join('\n').trim(); }
    const danger = o.danger !== undefined ? o.danger : /Ջնջ|ջնջ|Դուրս|Զրոյ|Անջատ|չի աշխատի|հետ բերել/.test(String(msg));
    return new Promise(res => {
      const bg = document.createElement('div'); bg.className = 'nxd-bg';
      bg.innerHTML = `<div class="nxd ${danger ? 'danger' : ''}" role="dialog" aria-modal="true"><div class="nxd-h"><div class="nxd-ic">${danger ? '!' : isConfirm ? '?' : 'i'}</div><div style="min-width:0"><div class="nxd-t">${esc(title)}</div>${body ? `<div class="nxd-m">${esc(body)}</div>` : ''}</div></div>
        <div class="nxd-b">${isConfirm ? `<button class="c" data-v="0">${esc(o.cancel || _t('Չեղարկել'))}</button>` : ''}<button class="o" data-v="1">${esc(o.ok || (isConfirm ? (danger ? _t('Այո, շարունակել') : _t('Այո')) : _t('Լավ')))}</button></div></div>`;
      const done = v => { document.removeEventListener('keydown', key, true); bg.remove(); res(v); };
      const key = e => { if (e.key === 'Escape') { e.preventDefault(); done(false); } if (e.key === 'Enter') { e.preventDefault(); done(true); } };
      bg.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) done(b.dataset.v === '1'); else if (e.target === bg) done(false); });
      document.addEventListener('keydown', key, true);
      document.body.appendChild(bg);
      setTimeout(() => { const b = bg.querySelector(isConfirm && danger ? '.c' : '.o'); if (b) b.focus(); }, 30);
    });
  }
  return { confirm: (m, o) => show(m, o, true), alert: (m, o) => show(m, o, false).then(() => undefined) };
})();

/* ============== NxFb — Firebase-ի միացում (իրական ժամանակի չաթ) ==============
   Apps Script-ը տալիս է ժամանակավոր բանալի (fbToken), հավելվածը ուղղակիորեն լսում/գրում է Firestore-ում։
   Եթե Firebase-ը կարգավորված չէ կամ չի բեռնվում, ամեն ինչ աշխատում է նախկին եղանակով։ */
const NxFb = (function () {
  const VERS = ['12.0.0', '11.10.0', '10.14.1'];
  const st = { p: null, on: false, me: null, skew: 0, tz: 240, db: null, F: null, app: null, A: null, gen: 0 };
  const p2 = n => String(n).padStart(2, '0');
  async function load() {
    let err;
    const list = window.NX_FB_BASE ? [window.NX_FB_BASE] : VERS.map(v => 'https:' + '/' + '/www.gstatic.com/firebasejs/' + v + '/');
    for (const b of list) {
      try {
        const [A, U, F] = await Promise.all([import(b + 'firebase-app.js'), import(b + 'firebase-auth.js'), import(b + 'firebase-firestore.js')]);
        return { A, U, F };
      } catch (e) { err = e; }
    }
    throw err || new Error('Firebase SDK');
  }
  function start(call) {
    if (st.p) return st.p;
    const gen = ++st.gen;
    st.p = (async () => {
      const t = await call('fbToken', {});
      if (!t || t.off || gen !== st.gen) return false;
      const { A, U, F } = await load();
      const app = A.initializeApp(t.cfg, 'nx' + gen + '-' + Date.now());
      const auth = U.initializeAuth(app, { persistence: U.inMemoryPersistence });
      await U.signInWithCustomToken(auth, t.token);
      if (gen !== st.gen) { try { A.deleteApp(app); } catch (e) {} return false; }
      Object.assign(st, { app, A, F, db: F.initializeFirestore(app, { experimentalAutoDetectLongPolling: true }), me: t.me, skew: (+t.now || Date.now()) - Date.now() });
      const m = String(t.tz || '+0400').match(/([+-])(\d\d)(\d\d)/); st.tz = m ? (m[1] === '-' ? -1 : 1) * (+m[2] * 60 + +m[3]) : 240;
      st.on = true;
      return true;
    })().catch(e => {
      try { console.warn('Firebase-ը չմիացավ', e); } catch (x) {}
      st.on = false; st.err = String(e && e.message || e);
      // 2 րոպե հետո կրկին կփորձի
      setTimeout(() => { if (gen === st.gen && !st.on) st.p = null; }, 120000);
      return false;
    });
    return st.p;
  }
  function stop() {
    st.gen++; st.p = null; st.on = false;
    if (st.app && st.A) { try { st.A.deleteApp(st.app); } catch (e) {} }
    st.app = null; st.db = null;
  }
  const now = () => Date.now() + st.skew;
  function nowStr() { const d = new Date(now() + st.tz * 60000); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' + p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds()); }
  const path = (cid, owner, thread) => ['co', String(cid), 'u', String(owner), 'th', String(thread)];
  const newId = () => 'W-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const side = () => st.me && st.me.s === 't' ? 'team' : 'client';
  function listenMsgs(pth, sinceMs, cb) {
    const F = st.F;
    const q = F.query(F.collection(st.db, ...pth, 'm'), F.where('u', '>', F.Timestamp.fromMillis(sinceMs)));
    return F.onSnapshot(q, snap => cb(snap.docChanges().map(ch => ({ type: ch.type, id: ch.doc.id, d: ch.doc.data({ serverTimestamps: 'estimate' }) }))), err => cb(null, err));
  }
  function listenDoc(pth, cb) {
    const F = st.F;
    return F.onSnapshot(F.doc(st.db, ...pth), s => cb(s.exists() ? s.data() : null), () => {});
  }
  /** Ազդանշան (sig/team կամ sig/<կազմ.>)՝ նոր հաղորդագրության մասին. առաջին վիճակը բաց է թողնվում */
  function onSig(key, cb) {
    if (!st.on) return () => {};
    const F = st.F; let first = true;
    return F.onSnapshot(F.doc(st.db, 'sig', String(key)), s => { if (first) { first = false; return; } cb(s.exists() ? s.data() : null); }, () => {});
  }
  /** Աշխատակցի տվյալների պատճենը (snap/<uid>) */
  function listenSnap(cb) {
    if (!st.on || !st.me) return () => {};
    const F = st.F;
    return F.onSnapshot(F.doc(st.db, 'snap', st.me.k), s => { if (!s.exists()) return; const x = s.data(); try { cb(JSON.parse(x.j), +x.t || 0); } catch (e) {} }, () => {});
  }
  function withTimeout(pr, ms) { return Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }
  function send(pth, id, msg, cid, thread) {
    const F = st.F, b = F.writeBatch(st.db), ts = F.serverTimestamp();
    b.set(F.doc(st.db, ...pth, 'm', id), Object.assign({}, msg, { u: ts }));
    b.set(F.doc(st.db, ...pth), { ty: { [st.me.k]: { n: st.me.n, s: st.me.s, at: 0 } }, u: ts }, { merge: true });
    const sg = { t: String(thread), at: now(), s: st.me.s, u: ts };
    b.set(F.doc(st.db, 'sig', 'team'), sg);
    b.set(F.doc(st.db, 'sig', String(cid)), sg);
    return withTimeout(b.commit(), 6000);
  }
  /** Ֆայլերը Firestore-ում՝ մասերով (յուրաքանչյուրը ≤ 700 ԿԲ base64) */
  const CH = 700000;
  async function putFiles(pth, items) {
    const F = st.F; let b = F.writeBatch(st.db), sz = 0; const all = [];
    for (const it of items) {
      for (let i = 0; i * CH < it.b64.length || i === 0; i++) {
        const part = it.b64.slice(i * CH, (i + 1) * CH);
        if (sz + part.length > 6000000) { all.push(b.commit()); b = F.writeBatch(st.db); sz = 0; }
        b.set(F.doc(st.db, ...pth, 'f', it.id + '-' + i), { d: part, u: F.serverTimestamp() }); sz += part.length;
      }
    }
    all.push(b.commit());
    return withTimeout(Promise.all(all), 120000);
  }
  async function getFile(pth, id, n) {
    const F = st.F, parts = await Promise.all(Array.from({ length: n }, (_, i) => F.getDoc(F.doc(st.db, ...pth, 'f', id + '-' + i))));
    return parts.map(p => { if (!p.exists()) throw new Error(_t('Ֆայլը չի գտնվել')); return p.data().d; }).join('');
  }
  function typing(pth) {
    const F = st.F;
    return F.setDoc(F.doc(st.db, ...pth), { ty: { [st.me.k]: { n: st.me.n, s: st.me.s, at: now() } }, u: F.serverTimestamp() }, { merge: true }).catch(() => {});
  }
  function markRead(pth, ids) {
    const F = st.F, b = F.writeBatch(st.db), ts = F.serverTimestamp(), fl = st.me.s === 't' ? 'rt' : 'rc';
    ids.slice(0, 400).forEach(id => b.update(F.doc(st.db, ...pth, 'm', id), { [fl]: true, u: ts }));
    return b.commit().catch(() => {});
  }
  return {
    start, stop, now, nowStr, path, newId, side, listenMsgs, listenDoc, onSig, listenSnap, send, typing, markRead, putFiles, getFile, chunks: s => Math.max(1, Math.ceil(s.length / CH)),
    ready: () => st.p || Promise.resolve(false),
    on: () => st.on, me: () => st.me, err: () => st.err || ''
  };
})();

/* ============== NxChat — ընդհանուր չաթ (օգտագործվում է և՛ թիմի, և՛ հաճախորդի էջում) ==============
   NxChat.mount(el, { thread, side, call, onConvert, convertLabel, canConvert, onInfo, compact })
   call(action, payload) → Promise<data> */
const NxChat = (function () {
  const CSS = `

.nxc-top button{border:1px solid var(--line,#e5e9f2);background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:inherit}

.nxc-day{align-self:center;background:rgba(15,23,42,.06);color:#475569;font-size:11.5px;font-weight:600;border-radius:10px;padding:2px 10px;margin:8px 0 4px}
.nxc-sys{align-self:center;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:12.5px;border-radius:10px;padding:5px 12px;margin:6px 0;max-width:90%;text-align:center}
.nxc-m{display:flex;flex-direction:column;max-width:82%;align-self:flex-start;position:relative;margin-top:2px}
.nxc-m.nxc-me{align-self:flex-end;align-items:flex-end}
.nxc-b{background:#fff;border-radius:14px;border-bottom-left-radius:4px;padding:6px 10px 4px;box-shadow:0 1px 1px rgba(15,23,42,.08);position:relative;min-width:72px;max-width:100%}
.nxc-m.nxc-me .nxc-b{background:var(--nxc-me,#d9e6ff);border-bottom-left-radius:14px;border-bottom-right-radius:4px}

.nxc-q{border-left:3px solid var(--brand,#2457f5);background:rgba(36,87,245,.07);border-radius:6px;padding:3px 8px;margin:2px 0 4px;font-size:12.5px;cursor:pointer;max-width:100%}
.nxc-q b{display:block;font-size:11.5px;color:var(--brand,#2457f5)}
.nxc-q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#475569}

.nxc-vid,.nxc-doc,.nxc-aud{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(15,23,42,.05);margin:2px 0;cursor:pointer;min-width:200px;max-width:280px;border:0;font:inherit;color:inherit;text-align:left;width:100%}
.nxc-vid .ic,.nxc-doc .ic,.nxc-aud .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--brand,#2457f5);color:#fff;flex:none;font-size:15px}

    async function addFiles(fl) {

    /** Արագ ուղարկում Firebase-ով (միայն տեքստ)՝ մյուս կողմը տեսնում է անմիջապես, աղյուսակում պահվում է զուգահեռ */
    async function sendFast(text, files) {
      files = files || [];
      const id = NxFb.newId(), me = NxFb.me(), sd = NxFb.side(), at = NxFb.nowStr(), replyTo = S.reply ? S.reply.id : '', pth = S.fbPath;
      const fl = files.map(f => {
        const k = kindOf(f.name) !== 'file' ? kindOf(f.name) : fileKindLocal(f);
        const m = { id: 'L-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), name: f.name, size: f.size, kind: k, at, by: me.n, mime: f.type || 'application/octet-stream', n: 1, live: 1 };
        SHARED.set(m.id, Promise.resolve({ url: URL.createObjectURL(f), mime: m.mime, name: f.name }));   // ուղարկողը տեսնում է անմիջապես
        return { f, m };
      });
      S.pend.set(id, { id, author: me.n, side: sd, text, at, replyTo, files: fl.map(x => x.m), edited: false, deleted: false, reactions: {}, mine: true, read: false, pending: true });
      S.reply = null; S.err = ''; S.typingAt = 0; S.files = [];
      $r('cmp').innerHTML = ''; drawComposer(); setMsgs(true);
      const t2 = $r('cmp').querySelector('textarea'); if (t2 && !('ontouchstart' in window)) t2.focus();
      let ok = true, data = [];
      try {
        data = await Promise.all(fl.map(async x => ({ name: x.f.name, mime: x.f.type, data: await readB64(x.f) })));
        if (fl.length) {
          fl.forEach((x, i) => { x.m.n = NxFb.chunks(data[i].data); });
          await NxFb.putFiles(pth, fl.map((x, i) => ({ id: x.m.id, b64: data[i].data })));
        }
        const msg = { author: me.n, side: sd, x: me.x || '', text, at, replyTo, files: fl.map(x => x.m), edited: false, deleted: false, reactions: {}, rt: INT ? false : sd === 'team', rc: sd === 'client' };
        await NxFb.send(pth, id, msg, S.info.companyId, o.thread);
      } catch (e) { ok = false; }
      const payload = { thread: o.thread, text, replyTo, fid: id, fat: at, files: data };
      if (ok && fl.length) payload.live = fl.map(x => ({ id: x.m.id, n: x.m.n }));
      if (!ok) {
        // Firebase-ը չաշխատեց՝ ուղարկում ենք սովորական ճանապարհով (նույն ID-ով, կրկնօրինակ չի լինի)
        try { const r = await call('chatSend', Object.assign(payload, { push: 1 })); S.pend.delete(id); apply(r, true); }
        catch (e) { S.pend.delete(id); setMsgs(); S.err = e.message; drawComposer(); const t = $r('cmp').querySelector('textarea'); if (t && !t.value) t.value = text; }
        return;
      }
      for (let i = 0; i < 4; i++) {
        try { await call('chatSend', Object.assign({}, payload, { lite: 1 })); return; }
        catch (e) { if (/AUTH|հասանելի չէ|չի գտնվել|Սխալ/.test(e.raw || e.message) || i === 3) { S.err = _t('Հաղորդագրությունը չպահպանվեց') + '՝ ' + e.message; drawComposer(); return; } await new Promise(r => setTimeout(r, 2000 * (i + 1))); }
      }
    }
    async function send() {
      const ta = $r('cmp').querySelector('textarea'); const text = ta ? ta.value.trim() : '';
      if (S.busy || (!text && !S.files.length)) return;
      // Firebase-ով (արագ)՝ տեքստ և մինչև 6 ՄԲ ֆայլեր, մեծերը՝ սովորական ճանապարհով
      if (!S.edit && S.fbPath && NxFb.on() && S.info && S.files.reduce((a, f) => a + f.size, 0) <= 6 * 1048576) return sendFast(text, S.files.slice());

    async function startRec() {
      let stream;
      try {
        if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('nosupport');
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        if (e && e.name === 'NotAllowedError') { S.err = _t('Միկրոֆոնի թույլտվությունը տրված չէ (միացրեք բրաուզերի/հեռախոսի կարգավորումներում)'); drawComposer(); return; }
        root.querySelector('[data-f="aud"]').click(); return;
      }

    }

    /* ---------- իրադարձություններ ---------- */
    root.addEventListener('click', async e => {

const CL = { tok: lsGet('nx_client_tok'), v: null, screen: 'home', thread: null, filter: 'open', files: [], login: '', check: null, q: '', res: null };
/** Կարդալու գործողությունները ցանցի խափանման դեպքում կրկնվում են (մինչև 2 անգամ) */

async function ccall(action, payload) {
  for (let i = 0; ; i++) {
    try { return await ccall1(action, payload); }
    catch (e) {
      if (!RETRY_OK[action] || i >= 2 || !/Կապի սխալ/.test(e.raw || e.message) || /AUTH/.test(e.raw || e.message)) throw e;
      await new Promise(r => setTimeout(r, 1500 * (i + 1)));
    }
  }
}
function ccall1(action, payload) {
  return new Promise((resolve, reject) => {
    const done = r => {
      if (r && r.ok) return resolve(r.data);
      const msg = (r && r.error) || 'Կապի սխալ';
      const raw = msg.replace(/^AUTH:\s*/, '');
      if (/^AUTH:/.test(msg)) { CL.tok = ''; lsSet('nx_client_tok', ''); fbStopC(); clLogin(trErr(raw)); }
      const er = new Error(trErr(raw)); er.raw = raw; reject(er);
    };
    const fail = e => { const m = 'Կապի սխալ՝ ' + (e && e.message || e), er = new Error(trErr(m)); er.raw = m; reject(er); };
    if (IS_GAS) google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(action, CL.tok, payload || {});
    else if (API_URL) {
      const tm = setTimeout(() => fail(new Error(t('սերվերը չի պատասխանում (60 վրկ)'))), 60000);
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: CL.tok, payload: payload || {} }) })
        .then(r => r.text()).then(txt => { clearTimeout(tm); let j; try { j = JSON.parse(txt); } catch (e) { throw new Error(t('սերվերը վերադարձրեց ոչ ճիշտ պատասխան (ստուգեք API_URL-ը և Deploy-ը)')); } done(j); })
        .catch(e => { clearTimeout(tm); fail(e); });
    }
    else fail(new Error('API_URL'));
  });
}

function clientInit() {

}
async function clBack() {
  if (CHAT) { CHAT.destroy(); CHAT = null; }
  document.body.classList.remove('inchat');
  CL.screen = 'home'; CL.thread = null;
  // գլխավոր էջը՝ անմիջապես, թարմ տվյալները՝ հետո
  clRender(); window.scrollTo(0, 0);
  clRefresh();
}
/* iPhone. ստեղնաշարը բացվելիս էջը չի «փախչում», վերևի գիծը (← հետ) միշտ երևում է */
function fitChat() {
  const el = document.querySelector('.chatpage'), vv = window.visualViewport;
  if (!el || !vv) return;
  el.style.height = vv.height + 'px';
  el.style.top = vv.offsetTop + 'px';
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitChat);
  visualViewport.addEventListener('scroll', fitChat);
}
document.addEventListener('focusout', () => { if (CL.screen === 'chat') setTimeout(() => { window.scrollTo(0, 0); fitChat(); }, 60); });
window.addEventListener('popstate', () => { if (CL.screen !== 'home' && CL.v) clBack(); });

async function clLogout() {
  try { await ccall('clientLogout', {}); } catch (e) {}
  if (CHAT) { CHAT.destroy(); CHAT = null; }
  fbStopC();
  try { localStorage.removeItem(VKEY()); } catch (e) {}
  CL.tok = ''; CL.v = null; CL.screen = 'home'; CL.thread = null; lsSet('nx_client_tok', ''); clLogin();
}
let clTimer = null;
function homeBusy() { return CL.screen !== 'home' || (CL.q || '').trim() || (document.activeElement && document.activeElement.id === 'gq'); }
function clPoll() {
  clearInterval(clTimer);
  clTimer = setInterval(async () => {
    if (!CL.tok || !CL.v) return;
    try {
      const v = await ccall('clientInfo', {});
      if (JSON.stringify(v) !== JSON.stringify(CL.v)) { notifyChanges(CL.v, v); CL.v = v; if (!homeBusy()) clRender(); }
    } catch (e) {}
  }, 30000);
}
// հավելվածը նորից բացելիս՝ անմիջապես թարմացնել
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !CL.tok || !CL.v) return;
  try { const v = await ccall('clientInfo', {}); if (JSON.stringify(v) !== JSON.stringify(CL.v)) { notifyChanges(CL.v, v); CL.v = v; if (!homeBusy()) clRender(); } } catch (e) {}
});

(async function init() {
  if (!TOKEN) return clientInit();
  try { INFO = await call('portalInfo', {}); render(); }
  catch (e) { $('#root').innerHTML = `<div class="card bad"><div class="big">🔒</div><b>${esc(e.message)}</b></div>`; }
})();

(function () { var b = document.getElementById('nxboot'); if (b) b.remove(); })();
</script>
