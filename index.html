   Աղբյուրը՝ Numetrix HR 1.5.9-ի app.css (նույն թոքենները, նույն դասերը)։ Մուգ թեման՝ ըստ համակարգի կամ <html data-theme="dark">։

:root {

  --accent-soft: #EDF0F6;
  --stamp: #7C3AED;
  --stamp-fg: #7C3AED;
  --stamp-soft: #EFE7FD;
  --stamp-ink: #FFFFFF;
  --info: #0369A1;
  --info-soft: #E2F4FC;
  --ok: #166534;
  --ok-soft: #DCF5E6;
  --warn: #92400E;
  --warn-soft: #FDF1D6;
  --bad: #B91C1C;
  --bad-soft: #FDE8E8;
  --chip: #ECEEF1;
  --chip-ink: #4B5A70;
  --field-bg: #FFFFFF;
  --field-line: #C3CCDA;
  --field-hover: #98A6BD;
  --field-ro: #F2F5F9;
  --field-ro-line: #D9DFE8;
  --bad-row: #FDF1F1;
  --bad-row-hover: #FBE7E7;
  --paper: #FFFFFF;
  --paper-ink: #111827;
  --focus: #1F3A75;
  --scrim: rgba(13, 21, 48, .5);
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 8px 24px rgba(15, 23, 42, .08);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05);
  --side-bg: #101B34;
  --side-border: #101B34;
  /* Պատվիրատուի օրինակի գույները (2026-10-15)․ մուգ կապույտ և ոսկեգույն */
  --gold: #C99A3D;
  --navy: #101B34;
  --tile: #101B34;
  --title: #16213A;
  --frame: #E1E5EC;
  --side-active: #2D3036;
  --side-ink: #C7D0EA;
  --side-strong: #FFFFFF;
  --side-muted: #8EA0D6;
  --side-hover: #18213F;
  --side-card: #16214A;
  --side-field: #1B233C;
  --side-line: #2E3858;
  --side-badge: #2F364D;
  --side-on: #C99A3D;
  --side-on-badge: #E3C27A;
  --font-ui: "Noto Sans Armenian", "Noto Sans", "Segoe UI", Arial, sans-serif;
  --font-doc: "Noto Serif Armenian", "Noto Serif", Georgia, "Times New Roman", serif;

}

  --bg: #0B1120; --surface: #121A2E; --surface-2: #172036; --surface-3: #1C2740; --seg-on: #2B3858;
  --ink: #E6EAF2; --ink-2: #C3CADB; --muted: #94A0B8; --line: #27324E; --line-2: #1E2842;

  --field-bg: #0E1628; --field-line: #3A4766; --field-hover: #5A6890; --field-ro: #151E33; --field-ro-line: #2A3550; --bad-row: #2A1619; --bad-row-hover: #331B1F;

* { box-sizing: border-box; }
html, body, #app { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-fg); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.code, .num { font-family: var(--font-code); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.num { text-align: right; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); }
/* ---------- Shell ----------
   Պատվիրատուի օրինակով․ ձախում՝ մուգ ուղղորդիչ առանձին քարտով, աջում՝ սպիտակ աշխատանքային դաշտ եզրագծով, ներդիրները՝ դրա վերևում */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); gap: var(--gap-page); min-height: 100%; padding: 6px 10px 10px; }
.app.nav-off { grid-template-columns: minmax(0, 1fr); }
.app.nav-off > .side { display: none; }
.side {
  position: sticky; top: 6px; height: calc(100vh - 16px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--side-line) transparent;
  background: var(--side-bg); color: var(--side-ink); border-radius: var(--r-lg); display: flex; flex-direction: column;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 18px 16px 14px; }
.brand img { width: 40px; height: 40px; flex: none; }
.brand b { display: block; font-size: 17px; font-weight: 700; color: var(--side-strong); letter-spacing: -.01em; line-height: 1.2; }
.brand span { display: block; font-size: 12.5px; color: var(--side-muted); }
.orgpick { margin: 2px 12px 8px; }
.orgpick label { display: block; font-size: 11px; color: var(--side-muted); text-transform: uppercase; letter-spacing: .07em; margin: 0 0 5px 4px; }
.orgpick select { width: 100%; background-color: var(--side-field); border-color: var(--side-line); color: var(--side-strong); color-scheme: dark; }
.side-head { display: flex; align-items: center; gap: 4px; padding-right: 8px; }
.side-head .brand { flex: 1; min-width: 0; }
.side-x { width: 32px; height: 32px; flex: none; border: 0; border-radius: var(--r); background: none; color: var(--side-muted); cursor: pointer; display: grid; place-items: center; }
.side-x:hover { background: var(--side-hover); color: var(--side-strong); }
.side-x svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; }
/* Բաժինների ցանկ՝ 8 կետ, ընտրվածը՝ բաց ֆոնով և ոսկեգույն ձախ գծով */
.snav { display: flex; flex-direction: column; gap: 4px; padding: 10px 14px 16px; }
.snav button { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 8px 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--side-ink); text-align: left; cursor: pointer; font-size: 13px; line-height: 1.3; }
.snav button:hover { background: rgba(255, 255, 255, .06); color: var(--side-strong); }
.snav button.on { background: var(--side-active); color: #FFFFFF; font-weight: 600; }
.snav button.on::before { content: ''; position: absolute; left: -4px; top: 0; bottom: 0; width: 3px; border-radius: 2px; background: var(--gold); }
.snav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; }
.snav .lbl { min-width: 0; flex: 1 1 auto; }
.snav .cnt { margin-left: auto; font-size: 11px; font-weight: 600; line-height: 1; padding: 4px 7px; border-radius: var(--r-pill); background: var(--side-badge); color: var(--side-ink); white-space: nowrap; flex: none; }
.snav button.on .cnt { background: color-mix(in srgb, var(--gold) 35%, var(--side-active)); color: #FFFFFF; }
.snav .dot { width: 7px; height: 7px; flex: none; margin-left: auto; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent); }
.side-scrim { display: none; }
.side-foot { margin-top: auto; padding: 12px; display: grid; gap: 6px; }
.ucard { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-lg); background: var(--side-card); color: var(--side-strong); }
.ucard:hover { background: color-mix(in srgb, var(--side-card) 85%, #FFFFFF); }
.ucard:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.uav { width: 36px; height: 36px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--side-on); color: var(--navy); font-size: 13px; font-weight: 700; box-shadow: 0 0 0 2px var(--side-card), 0 0 0 3px var(--side-on-badge); }
.uinfo { min-width: 0; display: grid; }
.uinfo b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uinfo span { font-size: 12px; color: var(--side-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ucard svg { margin-left: auto; width: 16px; height: 16px; flex: none; stroke: var(--side-muted); fill: none; stroke-width: 1.8; }
.ucard select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; color-scheme: dark; }
.side-foot .reset { justify-self: start; border: 0; background: none; padding: 4px 6px; font-size: 12px; color: var(--side-muted); cursor: pointer; border-radius: var(--r-sm); }
.side-foot .reset:hover { color: var(--side-strong); background: var(--side-hover); }

.main { min-width: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--frame); border-radius: var(--r-lg); min-height: calc(100vh - 16px); }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: stretch; gap: 10px; min-height: 52px;
  padding: 0 14px 0 8px; background: var(--surface); border-bottom: 1px solid var(--frame); border-radius: var(--r-lg) var(--r-lg) 0 0;
}
.top > .menu-btn, .top > .syncpill, .top > .orgl { align-self: center; }
/* Աշխատանքային դաշտի ներդիրներ */
.wtabs { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 2px; padding-top: 9px; margin-bottom: -1px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; box-shadow: inset 0 -1px 0 var(--frame); position: relative; z-index: 1; }
.wtabs::-webkit-scrollbar { display: none; }
.wtab { flex: 0 1 auto; min-width: 92px; display: flex; align-items: center; gap: 7px; max-width: 240px; height: 38px; padding: 0 6px 0 14px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--r) var(--r) 0 0; color: var(--muted); cursor: pointer; font-size: 13px; user-select: none; }
.wtab:hover { color: var(--ink); background: color-mix(in srgb, var(--surface-3) 60%, transparent); }
.wtab.on { color: var(--title); font-weight: 600; background: var(--surface); border-color: var(--frame); border-bottom: 1px solid var(--surface); height: 39px; }
.wt-i { display: grid; place-items: center; flex: none; color: color-mix(in srgb, var(--muted) 70%, transparent); }
.wt-i svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.wtab.on .wt-i { color: var(--gold); }
.wtab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.wt-t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt-x { width: 22px; height: 22px; flex: none; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.wt-x:hover { background: var(--surface-3); color: var(--ink); }
.wt-x svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; }
.orgl { font-size: 12.5px; color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .crumbs { min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .crumbs b { color: var(--ink); font-weight: 600; }
.top .grow { flex: 1; }
.syncpill { white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 5px 12px; background: var(--surface); box-shadow: var(--shadow-sm); cursor: pointer; }
.syncpill:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.syncpill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.syncpill.pending i { background: var(--warn); }
.syncpill.error i { background: var(--bad); }

.page { padding-block: 22px 60px; padding-inline: var(--page-x); display: flex; flex-direction: column; gap: var(--gap-page); max-width: var(--page-max); width: 100%; }
/* ---------- Քարտեր (Փաստաթղթեր, Հաշվետվություններ)՝ պատվիրատուի օրինակի չափերով ---------- */
.gcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(212px, 1fr)); gap: 15px; }
.gcard {
  display: flex; flex-direction: column; align-items: flex-start; min-width: 0; min-height: 146px; padding: 20px 20px 22px; text-align: left;
  background: var(--surface); border: 1px solid var(--frame); border-radius: var(--r-card); color: var(--title); cursor: pointer; transition: border-color .15s, box-shadow .15s;
}
.gcard:hover { border-color: var(--gold); box-shadow: 0 6px 18px rgba(16, 27, 52, .07); }
.gcard:focus-visible { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 28%, transparent); }
.gcard[disabled] { cursor: not-allowed; opacity: .55; box-shadow: none; border-color: var(--frame); }
.gcard .gi { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: var(--r); background: var(--tile); color: var(--gold); margin-bottom: 20px; }
.gcard .gi svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.gcard .gi.code { width: auto; min-width: 38px; padding: 0 7px; font-family: var(--font-code); font-size: 12px; font-weight: 600; letter-spacing: -.01em; }
.gcard .gt { max-width: 100%; font-size: 14.5px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.gcard .gc { max-width: 100%; margin-top: 12px; font-size: 13px; line-height: 1.4; color: var(--muted); overflow-wrap: anywhere; }
.gcard.tcard .gt { font-size: 14px; -webkit-line-clamp: 3; }
.gcard.tcard .gc { margin-top: auto; padding-top: 12px; font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* Բաժնի ենթաէջեր */
.secnav { display: flex; gap: 6px; flex-wrap: wrap; }
.secnav button { height: 32px; padding: 0 14px; border: 1px solid var(--frame); border-radius: var(--r-pill); background: var(--surface); color: var(--ink-2); font-size: 13px; cursor: pointer; }
.secnav button:hover { border-color: var(--gold); color: var(--title); }
.secnav button.on { background: var(--tile); border-color: var(--tile); color: #FFFFFF; font-weight: 600; cursor: default; }
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head .t { min-width: 0; flex: 1 1 320px; }
.page-head h1 { margin: 0; font-weight: 700; font-size: 22px; line-height: 1.25; letter-spacing: -.015em; text-wrap: balance; }
.page-head .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
/* «Լողացող» վերնագիր (app.js՝ stickySetup). Հետ, Պահպանել, Ջնջել, Հաստատել…՝ միշտ տեսանելի, ոլորելիս՝ սեղմ տեսքով */
/* Ոլորման «խարիսխը» (scroll anchoring) անջատված է. վերնագիրը սեղմվելիս Chrome-ը էջը ետ էր տանում վերև, և վերնագիրը թրթռում էր (ոլորել չէր լինում) */
html { overflow-anchor: none; }
.sticky-sent { flex: none; margin-bottom: -18px; }
.sticky-head { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h, 52px)); z-index: 15; background: var(--surface); margin: -8px calc(-1 * var(--page-x)); padding: 8px var(--page-x); }
.page-head > .page-back { flex: 1 0 100%; margin-bottom: 2px; }
.emphead > .page-back { grid-column: 1 / -1; margin-bottom: 2px; }
.sticky-head.stuck { box-shadow: 0 1px 0 var(--frame), 0 12px 18px -18px rgba(16, 27, 52, .5); }
.page-head.stuck { flex-wrap: nowrap; align-items: center; gap: 12px; }
.emphead.stuck { grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; }
.sticky-head.stuck > .page-back { flex: none; grid-column: auto; margin: 0; }
.page-head.stuck .t { flex: 1 1 auto; }
.sticky-head.stuck h1 { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sticky-head.stuck .sub, .sticky-head.stuck .meta, .sticky-head.stuck .avatar, .sticky-head.stuck .asof { display: none; }
.sticky-head.stuck .actions { flex-wrap: nowrap; }
@media (max-width: 640px) {
  .sticky-head.stuck h1 { display: none; }
  .sticky-head.stuck > .page-back .btn { font-size: 0; gap: 0; padding: 0 8px; }
  .sticky-head.stuck .actions { overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; justify-content: flex-start; }
  .sticky-head.stuck .actions > :first-child { margin-left: auto; }
  .sticky-head.stuck .actions::-webkit-scrollbar { display: none; }
  .sticky-head.stuck .actions .btn { flex: none; height: 32px; padding: 0 10px; font-size: 12.5px; }
}
.actions { display: flex; gap: var(--gap-actions); flex-wrap: wrap; align-items: center; }
h2.sec { margin: 0; font-size: 15px; font-weight: 600; }
h3.sec { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
/* ---------- Buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--control-h); padding: 0 14px; font-weight: 500;
  border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: none; background: color-mix(in srgb, var(--accent) 86%, #FFFFFF); border-color: color-mix(in srgb, var(--accent) 86%, #FFFFFF); }
.btn.stamp { background: var(--stamp); border-color: var(--stamp); color: var(--stamp-ink); font-weight: 600; }
.btn.stamp:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); }
.btn.danger { color: var(--bad); }
.btn.sm { height: var(--control-h-sm); padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }
/* Հղում-կոճակ (<a class="btn">, օր.՝ ֆայլի հղում)՝ առանց ընդգծման */ a.btn { text-decoration: none; }

input[type=text], input[type=password], input[type=date], input[type=number], input[type=email], input[type=tel], input[type=search], input[type=month], select, textarea {
  width: 100%; height: var(--control-h); padding: 0 10px; border: 1px solid var(--field-line); border-radius: var(--r); background: var(--field-bg); color: var(--ink);
  box-shadow: inset 0 1px 2px rgba(15, 23, 42, .05);
}
input:hover, select:hover, textarea:hover { border-color: var(--field-hover); }
textarea { height: auto; min-height: 72px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
input[readonly], select[disabled], input[disabled], textarea[readonly] { background: var(--field-ro); border-color: var(--field-ro-line); color: var(--ink-2); box-shadow: none; }
input.code { letter-spacing: .02em; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label { font-size: 12.5px; font-weight: 500; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.field > label .lhint { font-size: 11.5px; font-weight: 400; color: var(--muted); }
.field > label.check { flex-wrap: nowrap; font-size: 13.5px; font-weight: 400; color: var(--ink); }
.field > label .req { color: var(--bad); }
.field > label .xml { margin-left: auto; font-family: var(--font-code); font-size: 10.5px; color: var(--muted); }
.field .hint { font-size: 12px; color: var(--muted); }
.field .err { font-size: 12px; color: var(--bad); }
.field.bad input, .field.bad select { border-color: var(--bad); }
.field.warn input, .field.warn select { border-color: var(--warn); background: var(--warn-soft); }
.check { display: flex; gap: 8px; align-items: center; min-height: var(--control-h); cursor: pointer; }
.check input { width: 16px; height: 16px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--gap-form-y) var(--gap-cols); }
.form .w2 { grid-column: span 2; }
.form .wall { grid-column: 1 / -1; }
.row { display: flex; gap: var(--gap-actions); align-items: center; flex-wrap: wrap; }
.row > * { min-width: 0; }
.inline-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.multi { display: flex; gap: 6px; flex-wrap: wrap; }
.multi label { border: 1px solid var(--field-line); border-radius: var(--r-pill); padding: 4px 11px; cursor: pointer; font-size: 12.5px; user-select: none; background: var(--surface); }
.multi label.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-fg); }
.multi input { display: none; }
/* ---------- Panels ---------- */
.panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
.panel > .ph { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.panel > .ph .grow { flex: 1; }
.panel > .pb { padding: var(--gap-cols); display: flex; flex-direction: column; gap: var(--gap-panel); }
.panel > .pb.flush { padding: 0; }
.panel > .pb.flush > .tw:last-child, .panel > .pb.flush > .t:last-child { border-radius: 0 0 var(--r-lg) var(--r-lg); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: var(--gap-cols); align-items: start; }
.cols > * { min-width: 0; }
.kv { display: grid; grid-template-columns: minmax(140px, 38%) 1fr; gap: 6px 14px; font-size: 13.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
/* ---------- Tables ---------- */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: var(--cell-y) var(--cell-x); border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
.t td { padding: var(--cell-y) var(--cell-x); border-bottom: 1px solid var(--line-2); vertical-align: top; }
.t tbody tr:last-child td { border-bottom: 0; }
.t tbody tr:hover td { background: var(--surface-2); }
.t tr.click { cursor: pointer; }
.t tr.dim td { color: var(--muted); }
.t td.num, .t th.num { text-align: right; }
.t .sub { display: block; font-size: 12px; color: var(--muted); }
.t tfoot td { font-weight: 600; border-top: 1px solid var(--line); border-bottom: 0; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
/* ---------- Chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; line-height: 1; padding: 4px 10px; border-radius: var(--r-pill); background: var(--chip); color: var(--chip-ink); border: 1px solid transparent; white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.chip.lbl::before { display: none; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.stamp { background: var(--stamp-soft); color: var(--stamp-fg); }
.chip.acc { background: var(--accent-soft); color: var(--accent-fg); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.draft { background: transparent; border: 1px dashed color-mix(in srgb, var(--muted) 55%, transparent); color: var(--muted); }
.t td .chip { white-space: normal; line-height: 1.25; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
.tag { font-family: var(--font-code); font-size: 11px; padding: 2px 6px; border-radius: var(--r-sm); background: var(--surface-3); color: var(--ink-2); }
/* ---------- Tabs, steps ---------- */
.tabs { display: flex; flex-wrap: wrap; gap: 0 2px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 9px 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; font-weight: 500; }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--accent-fg); border-bottom-color: var(--accent); font-weight: 600; }
.seg { display: inline-flex; gap: 2px; max-width: 100%; padding: 3px; border-radius: var(--r-card); background: var(--surface-3); overflow-x: auto; scrollbar-width: none; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: var(--r); cursor: pointer; color: var(--muted); white-space: nowrap; font-weight: 500; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--seg-on); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-sm); }
.steps { display: flex; gap: 0; counter-reset: s; overflow-x: auto; }
.steps .s { flex: 1 1 0; min-width: 120px; padding: 10px 12px; border-bottom: 2px solid var(--line); color: var(--muted); font-size: 13px; display: flex; gap: 8px; align-items: center; }
.steps .s b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; border: 1px solid var(--line); flex: none; }
.steps .s.on { color: var(--ink); border-bottom-color: var(--accent); }
.steps .s.on b { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.steps .s.done b { background: var(--accent-soft); color: var(--accent-fg); border-color: transparent; }
/* ---------- Notices ---------- */
.note { display: flex; gap: 10px; align-items: flex-start; padding: var(--cell-y) var(--cell-x); border-radius: var(--r); background: var(--surface-2); border: 1px solid var(--line-2); font-size: 13px; }
.note svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; margin-top: 1px; }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.note.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.note.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.note.stamp { background: var(--stamp-soft); border-color: transparent; color: var(--stamp-fg); }
.note.info { background: var(--info-soft); border-color: transparent; color: var(--info); }
.note > div { min-width: 0; }
/* ---------- Timeline ---------- */
.tl { display: flex; flex-direction: column; }
.tl .it { display: grid; grid-template-columns: 96px 18px minmax(0, 1fr); gap: 10px; }
.tl .d { font-family: var(--font-code); font-size: 12px; color: var(--muted); padding-top: 2px; text-align: right; }
.tl .ln { position: relative; }
.tl .ln::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 1px; background: var(--line); }
.tl .ln::after { content: ""; position: absolute; left: 4px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.tl .it.imp .ln::after { border-color: var(--muted); }
.tl .bx { padding-bottom: 14px; min-width: 0; }
.tl .bx b { font-weight: 600; }
/* ---------- Document sheet ---------- */
.sheetwrap { background: var(--surface-3); border-radius: var(--r-lg); padding: 20px; overflow-x: auto; }
.sheet { background: var(--paper); color: var(--paper-ink); max-width: 760px; margin: 0 auto; padding: 48px 56px; box-shadow: var(--shadow); font-family: var(--font-doc); font-size: 14.5px; line-height: 1.6; }
.sheet h4 { text-align: center; margin: 0 0 4px; font-size: 16px; letter-spacing: .02em; }
.sheet .cap { text-align: center; margin: 0 0 18px; font-size: 13.5px; }
.sheet .hdr { display: flex; justify-content: space-between; gap: 12px; margin: 18px 0; font-size: 13.5px; }
.sheet .tagv { background: var(--accent-soft); color: var(--accent-fg); border-radius: 4px; padding: 0 4px; font-family: var(--font-ui); font-size: 13px; }
.sheet .placeholder .code { overflow-wrap: anywhere; }
.sheet .placeholder { border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 14px; font-family: var(--font-ui); font-size: 13px; color: var(--muted); margin: 14px 0; }
.sheet .sign { display: flex; justify-content: space-between; gap: 24px; margin-top: 36px; font-size: 13.5px; }
/* Ձևանմուշով գծված փաստաթուղթ */
.sheet.doc { font-size: 13.5px; line-height: 1.55; padding: 44px 52px; }
.sheet.doc .d-title { text-align: center; font-weight: 700; margin: 1px 0; letter-spacing: .01em; }
.sheet.doc .d-right { margin: 0 0 4px auto; width: fit-content; max-width: 62%; display: grid; gap: 1px; }
.sheet.doc .d-row { display: flex; justify-content: space-between; gap: 16px; }
.sheet.doc .d-p { margin: 0 0 3px; text-align: justify; hyphens: manual; }
.sheet.doc .d-sub { padding-left: 1.4em; }
.sheet.doc .d-sub2 { padding-left: 2.8em; }
.sheet.doc .d-subt { text-align: center; margin: 0 0 1px; }
.sheet.doc .d-sign { text-align: left; }
.sheet.doc .d-gap { height: .85em; }
.sheet.doc .d-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; margin: 2px 0 6px; font-size: 13px; line-height: 1.5; }
.sheet.doc .d-col { min-width: 0; overflow-wrap: anywhere; }
.sheet.doc .d-colh { font-weight: 700; }
.sheet.doc .tv { background: color-mix(in srgb, var(--accent-soft) 75%, transparent); border-radius: 3px; padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.sheet.doc.plain .tv { background: none; padding: 0; }
.sheet.doc .tm { background: var(--bad-soft, #FDECEC); color: var(--bad); border: 1px dashed currentColor; border-radius: 3px; padding: 0 3px; font-family: var(--font-ui); font-size: .82em; white-space: nowrap; }
/* Կարճ փաստաթղթեր (հրաման, դիմում, ծանուցում, որոշում, ակտ)՝ A4 էջ (210 մմ = 794 px), դաշտեր՝ 1,5 սմ, ձախից 2 սմ, տառաչափ 12։
   Տարածությունները (d-gap) ձգվում են, որ փաստաթուղթը բաշխվի էջի վրա վերևից ներքև։ PDF-ը կառուցվում է նույն չափերով (drive.js՝ չափում է) */
.sheet.doc.letter { width: var(--sheet-w); max-width: 100%; min-height: 1123px; box-sizing: border-box; padding: 57px 57px 57px 76px; font-size: 16px; line-height: 1.564; }
.sheet.doc.letter .d-flow { display: flex; flex-direction: column; min-height: 868px; }
.sheet.doc.letter .d-flow > * { flex: none; }
.sheet.doc.letter .d-p { margin: 0 0 8px; text-indent: 47px; }
.sheet.doc.letter .d-p.d-nind, .sheet.doc.letter .d-p.d-quote { text-indent: 0; }
.sheet.doc.letter .d-sub, .sheet.doc.letter .d-sub2 { padding-left: 0; }
.sheet.doc.letter .d-flow > .d-gap { flex: 1 1 0; min-height: 14px; max-height: 46px; height: auto; }
.sheet.doc.letter .d-flow > .d-gap.g2 { flex-grow: 2; max-height: 76px; }
.sheet.doc.letter .d-flow > .d-gap.g3 { flex-grow: 3; max-height: 110px; }
.sheet.doc.letter .d-title { margin: 0; letter-spacing: 0; }
.sheet.doc.letter .d-org { font-size: 17.33px; padding-bottom: 10px; border-bottom: 1px solid currentColor; }
.sheet.doc.letter .d-main { font-size: 18.67px; margin-bottom: 4px; }
.sheet.doc.letter .d-main.d-long { font-size: 16px; }
.sheet.doc.letter .d-orgname { font-size: 17.33px; }
.sheet.doc.letter .d-subj { margin-bottom: 2px; }
.sheet.doc.letter .d-subt { margin: 0 0 2px; }
.sheet.doc.letter .d-right { margin: 0 0 0 auto; width: fit-content; min-width: 45%; max-width: 58%; line-height: 1.5; gap: 1px; }
.sheet.doc.letter .d-row { gap: 24px; }
.sheet.doc.letter .d-signs { display: grid; grid-template-columns: fit-content(42%) 130px minmax(0, 1fr); column-gap: 14px; align-items: end; }
.sheet.doc.letter .d-signs > * { padding-top: 30px; min-width: 0; }
.sheet.doc.letter .d-signs > .r0 { padding-top: 0; }
.sheet.doc.letter .d-signs > .e, .sheet.doc.letter .d-signs > .s-d { padding-top: 4px; }
.sheet.doc.letter .s-ln:not(.e) { border-bottom: 1px solid currentColor; height: 1.1em; box-sizing: content-box; }
.sheet.doc.letter .d-cols, .sheet.doc.letter .d-tblw { margin: 0; }
.sheet.doc.letter .d-cols { font-size: 14.67px; line-height: 1.5; }
.sheet.doc.letter .d-tbl { font-size: 12px; line-height: 1.5; }
.sheet.doc.letter .d-tbl th, .sheet.doc.letter .d-tbl td { padding: 2.67px 4px; }
.stampmark { display: inline-block; border: 2px solid var(--stamp-fg); color: var(--stamp-fg); border-radius: var(--r-sm); padding: 2px 8px; font-family: var(--font-code); font-size: 12px; transform: rotate(-3deg); }
/* ---------- Combo (search select) ---------- */
.combo { position: relative; }
.combo .list { position: absolute; z-index: 40; left: 0; right: 0; top: calc(100% + 4px); max-height: 260px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.combo .opt { padding: 7px 10px; cursor: pointer; display: flex; gap: 10px; font-size: 13px; }
.combo .opt .code { color: var(--muted); font-size: 12px; min-width: 64px; }
.combo .opt.hi, .combo .opt:hover { background: var(--accent-soft); }
/* ---------- Modal & toast ---------- */
.modal-bg { position: fixed; inset: 0; z-index: 80; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--r-modal); box-shadow: var(--shadow); width: min(var(--modal-w), 100%); max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; }
.modal.wide { width: min(880px, 100%); }
.modal .mh { padding: 18px 20px 6px; font-weight: 700; font-size: 16px; }
.modal .mb { padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 12px; }
.modal .mf { padding: 12px 20px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
/* երկար պատուհանում «Պահպանել»-ը և «Չեղարկել»-ը՝ միշտ տեսանելի (ներքևում) */
.modal .mf { position: sticky; bottom: 0; z-index: 2; background: var(--surface); border-radius: 0 0 var(--r-modal) var(--r-modal); }
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: var(--r-card); box-shadow: var(--shadow); font-size: 13px; max-width: 360px; cursor: pointer; overflow-wrap: anywhere; }
/* ---------- Misc ---------- */
.stats { display: flex; gap: 24px; flex-wrap: wrap; }

.it{align-items:center}

    async function addFiles(fl) {

    /** Արագ ուղարկում Firebase-ով (միայն տեքստ)՝ մյուս կողմը տեսնում է անմիջապես, աղյուսակում պահվում է զուգահեռ */
    async function sendFast(text, files) {
      files = files || [];
      const id = NxFb.newId(), me = NxFb.me(), sd = NxFb.side(), at = NxFb.nowStr(), replyTo = S.reply ? S.reply.id : '', pth = S.fbPath;
      const fl = files.map(f => {
        const k = kindOf(f.name) !== 'file' ? kindOf(f.name) : fileKindLocal(f);
        const m = { id: 'L-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), name: f.name, size: f.size, kind: k, at, by: me.n, mime: f.type || 'application/octet-stream', n: 1, live: 1 };

        return { f, m };

      S.reply = null; S.err = ''; S.typingAt = 0; S.files = [];
      $r('cmp').innerHTML = ''; drawComposer(); setMsgs(true);
      const t2 = $r('cmp').querySelector('textarea'); if (t2 && !('ontouchstart' in window)) t2.focus();
      let ok = true, data = [];
      try {
        data = await Promise.all(fl.map(async x => ({ name: x.f.name, mime: x.f.type, data: await readB64(x.f) })));
        if (fl.length) {
          fl.forEach((x, i) => { x.m.n = NxFb.chunks(data[i].data); });
          await NxFb.putFiles(pth, fl.map((x, i) => ({ id: x.m.id, b64: data[i].data })));
        }
        const msg = { author: me.n, side: sd, x: me.x || '', text, at, replyTo, files: fl.map(x => x.m), edited: false, deleted: false, reactions: {}, rt: INT ? false : sd === 'team', rc: sd === 'client' };
        await NxFb.send(pth, id, msg, S.info.companyId, o.thread);
      } catch (e) { ok = false; }
      const payload = { thread: o.thread, text, replyTo, fid: id, fat: at, files: data };
      if (ok && fl.length) payload.live = fl.map(x => ({ id: x.m.id, n: x.m.n }));
      if (!ok) {
        // Firebase-ը չաշխատեց՝ ուղարկում ենք սովորական ճանապարհով (նույն ID-ով, կրկնօրինակ չի լինի)
        try { const r = await call('chatSend', Object.assign(payload, { push: 1 })); S.pend.delete(id); apply(r, true); }
        catch (e) { S.pend.delete(id); setMsgs(); S.err = e.message; drawComposer(); const t = $r('cmp').querySelector('textarea'); if (t && !t.value) t.value = text; }
        return;

        try { await call('chatSend', Object.assign({}, payload, { lite: 1 })); return; }
        catch (e) { if (/AUTH|հասանելի չէ|չի գտնվել|Սխալ/.test(e.raw || e.message) || i === 3) { S.err = _t('Հաղորդագրությունը չպահպանվեց') + '՝ ' + e.message; drawComposer(); return; } await new Promise(r => setTimeout(r, 2000 * (i + 1))); }
      }
    }
    async function send() {
      const ta = $r('cmp').querySelector('textarea'); const text = ta ? ta.value.trim() : '';
      if (S.busy || (!text && !S.files.length)) return;
      // Firebase-ով (արագ)՝ տեքստ և մինչև 6 ՄԲ ֆայլեր, մեծերը՝ սովորական ճանապարհով

const CL = { tok: lsGet('nx_client_tok'), v: null, screen: 'home', thread: null, filter: 'open', files: [], login: '', check: null, q: '', res: null };
/** Կարդալու գործողությունները ցանցի խափանման դեպքում կրկնվում են (մինչև 2 անգամ) */

async function ccall(action, payload) {
  for (let i = 0; ; i++) {
    try { return await ccall1(action, payload); }
    catch (e) {
      if (!RETRY_OK[action] || i >= 2 || !/Կապի սխալ/.test(e.raw || e.message) || /AUTH/.test(e.raw || e.message)) throw e;
      await new Promise(r => setTimeout(r, 1500 * (i + 1)));
    }
  }
}
function ccall1(action, payload) {
  return new Promise((resolve, reject) => {
    const done = r => {
      if (r && r.ok) return resolve(r.data);
      const msg = (r && r.error) || 'Կապի սխալ';
      const raw = msg.replace(/^AUTH:\s*/, '');
      if (/^AUTH:/.test(msg)) { CL.tok = ''; lsSet('nx_client_tok', ''); fbStopC(); clLogin(trErr(raw)); }
      const er = new Error(trErr(raw)); er.raw = raw; reject(er);
    };
    const fail = e => { const m = 'Կապի սխալ՝ ' + (e && e.message || e), er = new Error(trErr(m)); er.raw = m; reject(er); };
    if (IS_GAS) google.script.run.withSuccessHandler(done).withFailureHandler(fail).api(action, CL.tok, payload || {});
    else if (API_URL) {
      const tm = setTimeout(() => fail(new Error(t('սերվերը չի պատասխանում (60 վրկ)'))), 60000);
      fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: CL.tok, payload: payload || {} }) })
        .then(r => r.text()).then(txt => { clearTimeout(tm); let j; try { j = JSON.parse(txt); } catch (e) { throw new Error(t('սերվերը վերադարձրեց ոչ ճիշտ պատասխան (ստուգեք API_URL-ը և Deploy-ը)')); } done(j); })
        .catch(e => { clearTimeout(tm); fail(e); });
    }
    else fail(new Error('API_URL'));
  });
}

/** Նոր պատասխան կամ կարգավիճակի փոփոխություն՝ ծանուցում + պատկերակի նշան */
/** Նոր հաղորդագրություն կամ կարգավիճակի փոփոխություն՝ ծանուցում + պատկերակի նշան */

    if (!prev || !('Notification' in window) || Notification.permission !== 'granted') return;
    const old = Object.fromEntries(allThreads(prev).map(r => [r.thread, r]));
    allThreads(next).forEach(r => {
      const o = old[r.thread]; if (!o || r.thread === CL.thread) return;

      if (!body) return;

      if (swReg && swReg.showNotification) swReg.showNotification(String(r.title).slice(0, 80), opt);

/* Firebase՝ նոր հաղորդագրությունների ազդանշան (ցուցակը թարմանում է անմիջապես) */
let FBC = null, FBC_T = [];
async function clRefresh() {
  if (!CL.tok || !CL.v) return;
  try { const v = await ccall('clientInfo', {}); if (JSON.stringify(v) !== JSON.stringify(CL.v)) { notifyChanges(CL.v, v); CL.v = v; if (!homeBusy()) clRender(); } } catch (e) {}
}
function fbStartC() {
  if (!CL.tok || FBC || !CL.v) return;
  FBC = 'wait';
  NxFb.start(ccall).then(ok => {
    if (!ok || !CL.tok || !CL.v) { FBC = null; return; }
    const offs = CL.v.companies.map(c => NxFb.onSig(c.id, s => {

      FBC_T.forEach(clearTimeout); FBC_T = [setTimeout(clRefresh, 2500), setTimeout(clRefresh, 7000)];

const VKEY = () => 'nx_cv_' + String(CL.tok).slice(0, 12);
function clientInit() {
  if (!IS_GAS && !API_URL) { $('#root').innerHTML = `<div class="card bad"><div class="big">${ico('nx-gear')}</div><b>${t('Հավելվածը դեռ կարգավորված չէ')}</b><p class="sub">index.html → API_URL</p></div>`; return; }
  if (!CL.tok) return clLogin();
  NxFb.start(ccall);   // Firebase-ը միանում է զուգահեռ
  // նախորդ անգամվա տվյալները՝ անմիջապես (թարմը կգա մի քանի վայրկյանից)

  ccall('clientInfo', {}).then(v => {
    lsSet(VKEY(), JSON.stringify(v));
    if (cached && CL.v === cached) {
      CL.v = v; notifyChanges(null, v);

      clPoll(); fbStartC(); return;
    }
    CL.v = v; notifyChanges(null, v);

    emptyText: r ? t('Այստեղ կարող եք գրել հարցեր և ուղարկել լրացուցիչ նկարներ, փաստաթղթեր, ձայնային այս անելիքի վերաբերյալ։') : t('Գրեք մեզ ցանկացած հարց, ուղարկեք նկար, տեսանյութ, ձայնային '),
    topText: i => i && i.req ? `${stPill(i.req.status)}` : '',
    onInfo: i => { if (i.req) { const p = document.querySelector('#chinfo .pill'); if (p) p.outerHTML = stPill(i.req.status); } },
    canConvert: (m, i) => i && i.kind === 'G' && m.mine && m.side === 'client' && !m.deleted,
    convertLabel: '' + t('Դարձնել անելիք'),
    onConvert: async (m, i) => {
      if (!await NxDlg.confirm(t('Ստեղծե՞լ անելիք այս հաղորդագրությունից') + '\n' + t('Այն կհայտնվի «Անելիքներ» բաժնում, և կկարողանաք հետևել կատարմանը։'), { danger: false, ok: t('Այո'), cancel: t('Չեղարկել') })) return;
      const title = (m.text || (m.files[0] ? m.files[0].name : 'Անելիք')).split('\n')[0].slice(0, 200);
      const res = await ccall('clientSubmit', { companyId: i.companyId, title, description: m.text, fromMsg: m.id });
      CL.v = res.view; toastC('' + t('Ստեղծվեց անելիք') + ' ' + res.id); CHAT.refresh();
    }
  });
}
async function clBack() {
  if (CHAT) { CHAT.destroy(); CHAT = null; }
  document.body.classList.remove('inchat');
  CL.screen = 'home'; CL.thread = null;
  // գլխավոր էջը՝ անմիջապես, թարմ տվյալները՝ հետո
  clRender(); window.scrollTo(0, 0);
  clRefresh();
}
/* iPhone. ստեղնաշարը բացվելիս էջը չի «փախչում», վերևի գիծը (← հետ) միշտ երևում է */
function fitChat() {
  const el = document.querySelector('.chatpage'), vv = window.visualViewport;
  if (!el || !vv) return;
  el.style.height = vv.height + 'px';
  el.style.top = vv.offsetTop + 'px';
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', fitChat);
  visualViewport.addEventListener('scroll', fitChat);
}
document.addEventListener('focusout', () => { if (CL.screen === 'chat') setTimeout(() => { window.scrollTo(0, 0); fitChat(); }, 60); });
window.addEventListener('popstate', () => { if (CL.screen !== 'home' && CL.v) clBack(); });

async function clLogout() {
  try { await ccall('clientLogout', {}); } catch (e) {}
  if (CHAT) { CHAT.destroy(); CHAT = null; }
  fbStopC();
  try { localStorage.removeItem(VKEY()); } catch (e) {}
  CL.tok = ''; CL.v = null; CL.screen = 'home'; CL.thread = null; lsSet('nx_client_tok', ''); clLogin();
}
let clTimer = null;
function homeBusy() { return CL.screen !== 'home' || (CL.q || '').trim() || (document.activeElement && document.activeElement.id === 'gq'); }
function clPoll() {
  clearInterval(clTimer);
  clTimer = setInterval(async () => {
    if (!CL.tok || !CL.v) return;
    try {
      const v = await ccall('clientInfo', {});
      if (JSON.stringify(v) !== JSON.stringify(CL.v)) { notifyChanges(CL.v, v); CL.v = v; if (!homeBusy()) clRender(); }
    } catch (e) {}
  }, 30000);
}
// հավելվածը նորից բացելիս՝ անմիջապես թարմացնել
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !CL.tok || !CL.v) return;
  try { const v = await ccall('clientInfo', {}); if (JSON.stringify(v) !== JSON.stringify(CL.v)) { notifyChanges(CL.v, v); CL.v = v; if (!homeBusy()) clRender(); } } catch (e) {}
});

(async function init() {
  if (!TOKEN) return clientInit();
  try { INFO = await call('portalInfo', {}); render(); }
  catch (e) { $('#root').innerHTML = `<div class="card bad"><div class="big">${ico('nx-shield')}</div><b>${esc(e.message)}</b></div>`; }
})();

(function () { var b = document.getElementById('nxboot'); if (b) b.remove(); })();
</script>
</body>
